      /* Страница-игрушка: сцена занимает экран целиком и ничего не прокручивает.
         Отдельная от сайта именно поэтому — на сайте прокрутка принадлежит
         странице, а здесь её нет вовсе. */

      #rock { position: fixed; inset: 0; }
      /* touch-action: жест над сценой — её собственный. Без этого браузер на
         трекпаде и телефоне сначала отдаёт своё пролистывание, и первое
         движение сцена не получает. */
      #rock > div, #rock canvas { touch-action: none; }
