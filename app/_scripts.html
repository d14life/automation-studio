<script>
/* Card fan: slot geometry from the original carousel (21 degrees at the edges, scale falling
   with the square of the distance). Pointing at a card lifts it and pushes its neighbours aside. */
(function(){
  var wrap=document.querySelector('.projects'); if(!wrap) return;
  var cards=[].slice.call(wrap.querySelectorAll('.proj'));
  var narrow=matchMedia('(max-width:820px)');
  var N=cards.length, center=(N-1)/2;
  /* the spread is measured from the container, so six cards always fit the screen instead of
     piling up on each other or running off the side */
  /* Card size follows the container: every card keeps at least 55 percent of its width clear
     of the next one, so six cards read as a fan instead of a pile on a narrow screen. */
  function cardW(){
    var avail=wrap.clientWidth;
    return Math.round(Math.max(260,Math.min(520,avail/2.9)));
  }
  function edgeX(){ return Math.max(60,(wrap.clientWidth-cardW())/2*0.92); }
  function slotCfg(slot){
    var d=N>1?(slot-center)/center:0, ad=Math.abs(d);
    return {rot:d*8, scale:1-0.08*ad*ad, x:d*edgeX(), y:ad*ad*2.2, z:10-Math.abs(slot-center)};
  }
  function apply(slot,extra){
    var c=slotCfg(slot), el=cards[slot]; extra=extra||{};
    el.style.setProperty('--fx',(c.x+(extra.dx||0)*16)+'px');
    el.style.setProperty('--fy',(c.y+(extra.dy||0))+'rem');
    el.style.setProperty('--fr',(c.rot+(extra.dr||0))+'deg');
    el.style.setProperty('--fs',(c.scale*(extra.ds||1)).toFixed(4));
    el.style.setProperty('--fz',extra.z!=null?extra.z:c.z);
  }
  function layout(hover){
    cards.forEach(function(el,slot){
      if(hover==null){apply(slot);return;}
      if(slot===hover){apply(slot,{dy:-1.4,ds:1.08,z:20});return;}
      var dist=Math.abs(slot-hover), push=2.6*(1+0.2*Math.max(0,3-dist));
      apply(slot,{dx:slot<hover?-push:push, dr:(slot<hover?-3:3)/dist});
    });
  }
  /* below the breakpoint the cards are a plain column, so the fan hands the layout back to CSS
     instead of leaving stale transforms behind - that is what piled them on top of each other */
  function refresh(){
    if(narrow.matches){
      cards.forEach(function(el){
        ['--fx','--fy','--fr','--fs','--fz'].forEach(function(p){el.style.removeProperty(p);});
      });
      return;
    }
    wrap.style.setProperty('--cardw',cardW()+'px');
    layout(null);
  }
  cards.forEach(function(el,slot){
    el.addEventListener('mouseenter',function(){ if(!narrow.matches) layout(slot); });
  });
  wrap.addEventListener('mouseleave',refresh);
  addEventListener('resize',refresh,{passive:true});
  addEventListener('load',refresh);
  refresh();
})();
</script>
<script>
/* phone menu: one toggle, closes after a jump so the page is not left covered */
(function(){
  var b=document.getElementById('burger'), n=document.getElementById('topnav');
  if(!b||!n) return;
  function set(open){ n.classList.toggle('open',open); b.setAttribute('aria-expanded',open?'true':'false'); }
  b.addEventListener('click',function(){ set(!n.classList.contains('open')); });
  n.addEventListener('click',function(e){ if(e.target.tagName==='A'||e.target.tagName==='BUTTON') set(false); });
  addEventListener('resize',function(){ if(innerWidth>700) set(false); },{passive:true});
})();
</script>
<script>
/* The border beam is animated by CSS through a registered custom property. If that animation
   is not advancing - an engine without @property support, a frozen timeline, anything - the
   ring would sit still and look broken. One check a second after load, then a cheap 12 fps
   driver only if it is actually needed. */
(function(){
  var root=document.documentElement;
  function angle(){ return parseFloat(getComputedStyle(root).getPropertyValue('--beam-a'))||0; }
  setTimeout(function(){
    var a=angle();
    setTimeout(function(){
      if (Math.abs(angle()-a)>0.05) return;         /* CSS is doing its job */
      var deg=a, last=0;
      (function spin(now){
        requestAnimationFrame(spin);
        if(document.hidden || now-last<80) return;   /* 12 fps is plenty for a slow sweep */
        deg=(deg+(now-last)*0.042)%360; last=now;    /* 42 deg per second, the resting speed */
        root.style.setProperty('--beam-a',deg.toFixed(1)+'deg');
      })(0);
    },700);
  },900);
})();
</script>

<script>
/* Hero graphics, exactly the settings confirmed on the bench:
   ice palette, Nunito, fast travel with the medium spread, tubes tight and one notch brighter. */
(function(){
  var ICE=['#DFF6FF','#7FD8FF','#5C82C9','#8E7BE8'];
  var FLOW=3.5, GLOW={l:.43,i:135};
  var stage=document.getElementById('stage');

  /* a phone gets a lighter field and no WebGL at all: the tube scene was the thing that
     killed mobile, and 700 stars redrawn every frame is more than a phone should pay */
  /* no WebGL scene where there is no mouse: phones and tablets paid for it in heat and frame
     drops, and the ribbons follow nothing there anyway */
  var SMALL=matchMedia('(hover:none)').matches || matchMedia('(pointer:coarse)').matches ||
            matchMedia('(max-width:600px)').matches ||
            (navigator.deviceMemory && navigator.deviceMemory<=4);
  var stopStars=Starfield1(document.getElementById('space'),{quantity:SMALL?300:2200,
    minFrameMs:SMALL?32:0,speed:SMALL?2.6:3.2,easing:1,warpFactor:10,opacity:0.1,
    mouseAdjust:false,clickToWarp:false,starColor:'rgba(255,255,255,1)',bgColor:'rgba(0,0,0,1)',zIndex:1});

  /* two lines, same timings, started in the same tick: they melt into the next phrase together */
  /* The ribbon path is centred on the viewport, but the words sit above the middle of the
     screen. The layer is nudged so the path's centre lands on the morph lines: that is what
     puts the ribbons behind the text instead of over the number below it. */
  function aimTubesAtText(){
    var layer=document.getElementById('tubelayer');
    var a=document.getElementById('liq1'), b=document.getElementById('liq2');
    if(!layer||!a||!b) return;
    var ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    var textMid=(ra.top+rb.bottom)/2, screenMid=(innerHeight||1)/2;
    layer.style.transform='translateY('+Math.round(textMid-screenMid)+'px)';
  }
  addEventListener('resize',aimTubesAtText,{passive:true});
  addEventListener('scroll',aimTubesAtText,{passive:true});   /* the words move, the band follows */
  addEventListener('load',aimTubesAtText);
  aimTubesAtText();

  var heroOn=true;
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(es){
      heroOn=es[0].isIntersecting;
      if(!heroOn) parkTubes(); else wakeTubes();
    },{rootMargin:'80px'}).observe(stage);
  }
  var MORPH={morphTime:SMALL?0.9:4.5,cooldownTime:SMALL?1.7:0.45,colors:ICE,flow:FLOW,
             drift:FLOW*3,spread:ICE.length*0.08,simple:SMALL,
             activeWhen:function(){return heroOn;}};
  var L1=document.getElementById('liq1'), L2=document.getElementById('liq2');
  LiquidText(L1,['АВТОМАТИЗИРУЕМ','БЫСТРО','ТОЛЬКО ПРАКТИКА'],MORPH);
  LiquidText(L2,['БИЗНЕС-ПРОЦЕССЫ','НЕ ЗНАЧИТ ПЛОХО','НОЛЬ ТЕОРИИ'],MORPH);

  /* One capture-phase listener does two jobs: it swallows the event so the tube library cannot
     chase the cursor, and it hands the position to the spotlight cards. Writes are folded into
     an animation frame, so a fast mouse still costs one write per frame. */
  var spotQueued=false, spotX=0, spotY=0;
  var glowCards=[].slice.call(document.querySelectorAll('.glow'));
  function placeGlow(){
    for(var i=0;i<glowCards.length;i++){
      var b=glowCards[i].getBoundingClientRect();
      glowCards[i].style.setProperty('--ox',Math.round(b.left));
      glowCards[i].style.setProperty('--oy',Math.round(b.top));
    }
  }
  var placeQueued=false;
  function queuePlace(){
    if(placeQueued) return; placeQueued=true;
    requestAnimationFrame(function(){placeQueued=false;placeGlow();});
  }
  addEventListener('scroll',queuePlace,{passive:true});
  addEventListener('resize',queuePlace,{passive:true});
  glowCards.forEach(function(c){c.addEventListener('mouseenter',queuePlace);
                               c.addEventListener('transitionend',queuePlace);});
  placeGlow();
  window.addEventListener('pointermove',function(e){
    e.stopPropagation();
    spotX=e.clientX; spotY=e.clientY;
    if(spotQueued) return;
    spotQueued=true;
    requestAnimationFrame(function(){
      spotQueued=false;
      var r=document.documentElement.style;
      r.setProperty('--x',spotX.toFixed(1));
      r.setProperty('--y',spotY.toFixed(1));
      r.setProperty('--xp',(spotX/innerWidth).toFixed(3));
      r.setProperty('--yp',(spotY/innerHeight).toFixed(3));
    });
  },true);

  /* Scene state lives in one scope. It used to sit inside the builder while the colour cycle
     read it from outside, so every frame threw and the ribbons stopped changing colour. */
  var layer=document.getElementById('tubelayer'), cv=null, app=null;
  var k=GLOW.l/0.64, sp=ICE.length*0.12, p0=ICE.length*0.10;
  function tubeSet(p){
    return [dim(paletteAt(ICE,p),k),dim(paletteAt(ICE,p+sp),k),dim(paletteAt(ICE,p+sp*2),k)];
  }
  function buildTubes(){
    if(SMALL||cv) return;
    cv=document.createElement('canvas'); cv.className='tubes'; layer.appendChild(cv);
    TubesCursorInit(cv,{tubes:{colors:tubeSet(p0),
      lights:{intensity:GLOW.i,colors:[dim(paletteAt(ICE,p0),k),dim(paletteAt(ICE,p0+sp*0.9),k),
                                       dim(paletteAt(ICE,p0+sp*1.5),k),dim(paletteAt(ICE,p0+sp*2.1),k)]}}},
      function(a){
        app=a;
        /* a flat wide figure keeps the ribbons in the line of the text instead of looping down
           across the number below it */
        app.options.sleepRadiusX=360;   /* horizontal sweep back to what it was */
        app.options.sleepRadiusY=200;   /* tall: the ribbons fill the height around the words */
      });
  }
  function parkTubes(){
    if(app){ try{ app.dispose(); }catch(e){} app=null; }
    if(cv){ cv.remove(); cv=null; }
  }
  function wakeTubes(){ buildTubes(); }

  /* No WebGL on a phone: half resolution was still too much for the device most visitors use. */
  if(SMALL){ layer.style.display='none'; }
  else { buildTubes(); }

  /* Watchdog, phones only and only after the page has settled: at load the first seconds are
     always slow (fonts, first paint, scene init) and judging the machine on those was wrong. */
  if(SMALL){
    setTimeout(function(){
      var frames=0,t0=0,done=false;
      (function tick(now){
        if(done) return;
        requestAnimationFrame(tick);
        if(!t0){ t0=now; return; }
        frames++;
        if(now-t0<2000) return;
        done=true;
        var fps=frames/((now-t0)/1000);
        if(fps<26 && stopStars && stopStars.setQuantity) stopStars.setQuantity(70);
      })(0);
    },3000);
  }

  /* tubes walk the same palette as the text, one step behind it */
  var hue=0,last=0;
  (function cycle(now){
    requestAnimationFrame(cycle);
    if(!app){last=now;return;}
    if(now-last<62) return;
    hue=(hue+360*(now-last)/1000/(FLOW*3))%360; last=now;
    var p=hue/360*ICE.length+p0;
    try{
      app.tubes.setColors(tubeSet(p));
      app.tubes.setLightsColors([dim(paletteAt(ICE,p+sp*0.3),k),dim(paletteAt(ICE,p+sp*0.9),k),
                                 dim(paletteAt(ICE,p+sp*1.5),k),dim(paletteAt(ICE,p+sp*2.1),k)]);
      window.__tubeHue=Math.round(hue);      /* readable proof that the cycle is alive */
    }catch(e){ if(!cycle.warned){cycle.warned=1;console.warn('tube colours:',e);} }
  })(0);
})();
</script>
<script>
/* Hero parallax: the two morph lines and the buttons leave at different speeds, so the first
   screen gains depth as you scroll instead of sliding away as one flat sheet. */
(function(){
  var l1=document.getElementById('liq1'), l2=document.getElementById('liq2'),
      acts=document.querySelector('.acts'), hint=null,
      num=document.querySelector('.hero101'),
      tubes=null;   /* the canvas arrives a moment later, so it is looked up lazily */
  if(!l1||!l2) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  /* written straight from the scroll handler: it only writes styles, never reads layout, and
     the browser already fires scroll at most once a frame. No animation-frame queue to miss. */
  function paint(){
    var y=window.pageYOffset||0, h=innerHeight||1;
    /* the track is exactly the scrollable part of the hero, so the text is gone at the very
       moment the next section reaches the top: no empty stretch of stars in between */
    /* the runway is exactly the part of the hero below the first screen: the dissolve finishes
       at the instant the next section reaches the top */
    var track=Math.max(160,(document.getElementById('stage').offsetHeight||h)-h);
    if(y>track*1.4) return;                   /* past the hero: stop paying for it */
    var f=Math.min(1,y/track);
    /* hold, then fade: the words stay readable for the first half of the scroll */
    var fade=Math.max(0,(f-0.10)/0.90);
    l1.style.transform='translateY('+(f*360).toFixed(1)+'px)';
    l1.style.opacity=(1-fade).toFixed(3);
    l2.style.transform='translateY('+(f*215).toFixed(1)+'px)';
    l2.style.opacity=(1-fade).toFixed(3);
    if(acts){ acts.style.transform='translateY('+(-f*165).toFixed(1)+'px)';
              acts.style.opacity=(1-fade*1.05).toFixed(3); }
    if(num){ num.style.transform='translateY('+(f*95).toFixed(1)+'px) scale('+(1+f*0.14).toFixed(3)+')';
             num.style.opacity=(1-fade).toFixed(3); }
    if(hint) hint.style.opacity=(1-f*3.2).toFixed(3);
    /* the ribbons sit behind the words, so they travel slower: that difference is the depth */
    if(!tubes) tubes=document.getElementById('tubelayer');
    if(tubes){ var op=Math.max(0,1-fade*1.5);
               tubes.style.opacity=op.toFixed(3);
               tubes.style.visibility=op<0.02?'hidden':'visible';
               var tcv=tubes.firstElementChild;
               if(tcv) tcv.style.transform='translateY('+(f*140).toFixed(1)+'px)'; }
  }
  addEventListener('scroll',paint,{passive:true});
  addEventListener('resize',paint,{passive:true});
  paint();
})();
