<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint INTO the safe areas - behind the notch and the
         home indicator - instead of stopping politely at their edges. Without it the strand can
         never reach the top or bottom of a phone however far it is stretched, because those
         strips are not part of the web view at all.
         theme-color then paints Safari's own status bar and toolbar black, so the browser
         chrome stops reading as two grey bands across a black page and disappears into it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Solutions101 v2 — черновик</title>
    <meta name="robots" content="noindex" />
    <!-- Same self-hosted faces the live site uses, so type metrics match and nothing is
         fetched from Google. -->
    <!-- Golos Text is the grotesk serious Russian fintech and SaaS use, and that is the whole
         reason it is here: the buyer this page is written for owns a logistics or gas company
         and is being asked to trust us with his processes. Nunito is a rounded, friendly face -
         it reads as approachable, which is the opposite of what that reader needs to feel.
         JetBrains Mono carries the figures ONLY. Monospaced numerals read as measured rather
         than marketed, which is the difference between a claim and a receipt - and the brief
         says бизнес любит цифры six different ways. Both are self-hosted and Cyrillic-subset:
         22KB and 9KB, nothing fetched from Google at runtime. -->
    <style>
      @font-face{font-family:Golos;font-style:normal;font-weight:400 900;font-display:swap;
        src:url(/fonts/golos-cyrillic.woff2) format('woff2');
        unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      @font-face{font-family:Golos;font-style:normal;font-weight:400 900;font-display:swap;
        src:url(/fonts/golos-latin.woff2) format('woff2');
        unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,
          U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:JBMono;font-style:normal;font-weight:500 700;font-display:swap;
        src:url(/fonts/jbmono-cyrillic.woff2) format('woff2');
        unicode-range:U+0000-00FF,U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    </style>
    <link rel="preload" href="/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The strand's first frame, 41KB. It is preloaded HERE rather than left to the <video
         poster> attribute alone because that attribute does not exist until React has parsed,
         mounted and rendered - by which point the blank screen has already been seen. From the
         head it is requested while the bundle is still downloading, so it is usually decoded
         before there is anything to put it in. -->
    <link rel="preload" href="/dna-poster.jpg" as="image" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/v2/main.tsx"></script>
  </body>
</html>
