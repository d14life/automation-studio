<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборщик прайсов — демо · Solutions101</title>
<style>
  :root{
    --bg:#0e202d; --panel:#132937; --border:rgba(242,247,245,.13);
    --text:#F2F7F5; --soft:rgba(242,247,245,.72); --accent:#7FD8FF; --warm:#ff6b5e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;
    align-items:center;justify-content:space-between;padding:0 20px;
    background:rgba(14,32,45,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);z-index:10;}
  header .brand{font-weight:800;letter-spacing:.02em;font-size:15px;}
  header a{color:var(--soft);text-decoration:none;font-size:14px;}
  header a:hover{color:var(--accent);}
  main{max-width:1180px;margin:0 auto;padding:88px 20px 60px;}
  h1{font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:-.01em;
    margin:0 0 8px;line-height:1.05;}
  .lead{color:var(--soft);font-size:16px;max-width:640px;margin:0 0 36px;}
  .sources{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:860px){.sources{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:18px;position:relative;overflow:hidden;
    min-height:260px;}
  .panel .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--soft);opacity:.6;margin-bottom:4px;}
  .panel h3{font-size:15px;margin:0 0 14px;font-weight:700;}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:1px solid var(--border);font-size:13.5px;
    transition:transform .5s ease, opacity .5s ease;}
  .row:last-child{border-bottom:none;}
  .row .name{color:var(--text);}
  .row .price{color:var(--soft);white-space:nowrap;}
  .row.flying{opacity:0;transform:translateY(-40px) scale(.9);}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    margin:28px 0;}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--border);
    padding:14px 26px;font-weight:700;font-size:15px;}
  .btn-main{background:var(--accent);color:#04222f;border:none;}
  .btn-main:hover{filter:brightness(1.08);}
  .btn-main:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:transparent;color:var(--soft);}
  .btn-ghost:hover{color:var(--text);border-color:var(--soft);}
  .summary{color:var(--accent);font-weight:700;font-size:15px;min-height:22px;}
  .result{background:var(--panel);border:1px solid var(--border);border-radius:20px;
    padding:22px;margin-top:8px;display:none;}
  .result.show{display:block;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--soft);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;padding:0 10px 10px;}
  td{padding:10px;border-top:1px solid var(--border);}
  tr.result-row{opacity:0;transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease;}
  tr.result-row.in{opacity:1;transform:none;}
  .price-best{color:var(--accent);font-weight:800;}
  .delta{color:var(--warm);font-size:12.5px;}
  .supplier{color:var(--soft);}
  @media (max-width:600px){
    table,thead,tbody,th,td,tr{display:block;}
    thead{display:none;}
    tr.result-row{border-top:1px solid var(--border);padding:10px 0;}
    td{border:none;padding:2px 0;}
    td::before{content:attr(data-label);color:var(--soft);
      font-size:11px;display:block;text-transform:uppercase;letter-spacing:.05em;}
  }
</style>
</head>
<body>
<header>
  <span class="brand">Solutions101 · демо</span>
  <a href="/v2.html">← на сайт</a>
</header>

<main>
  <h1>Сборщик прайсов</h1>
  <p class="lead">Собирает прайсы от разных поставщиков — почта, сайт, Excel — в одну таблицу с лучшей ценой по каждой позиции.</p>

  <div class="sources" id="sources"></div>

  <div class="controls">
    <button class="btn-main" id="mergeBtn">Свести в одну таблицу</button>
    <button class="btn-ghost" id="resetBtn" style="display:none;">Сбросить</button>
    <span class="summary" id="summary"></span>
  </div>

  <div class="result" id="result">
    <table>
      <thead><tr><th>Позиция</th><th>Лучшая цена</th><th>Поставщик</th><th>Δ к среднему</th></tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</main>

<script>
// демо-данные: три поставщика, частично пересекающиеся позиции
const sources = [
  { title: "Почта — прайс ООО Сталь-Трейд.xls", supplier: "Сталь-Трейд", items: [
    ["Лист г/к 3мм", 52400], ["Труба профильная 40x40x2", 3850],
    ["Арматура А500С 12мм", 61200], ["Уголок 50x50x5", 4120],
    ["Швеллер 10П", 6700], ["Круг стальной 20мм", 5480],
  ]},
  { title: "Сайт поставщика — Металлобаза 24", supplier: "Металлобаза 24", items: [
    ["Лист г/к 3мм", 51900], ["Труба профильная 40x40x2", 3990],
    ["Балка двутавровая 20Б1", 68500], ["Уголок 50x50x5", 3980],
    ["Сетка кладочная 50x50", 2150], ["Круг стальной 20мм", 5390],
  ]},
  { title: "Excel — прайс от менеджера", supplier: "Вторая база", items: [
    ["Лист г/к 3мм", 53100], ["Арматура А500С 12мм", 60800],
    ["Швеллер 10П", 6550], ["Балка двутавровая 20Б1", 69200],
    ["Сетка кладочная 50x50", 2090], ["Профнастил С8 0.5мм", 780],
  ]},
];
const fmt = n => n.toLocaleString('ru-RU') + ' ₽';

function renderSources(){
  const el = document.getElementById('sources');
  el.innerHTML = sources.map((s,si) => `
    <div class="panel" id="panel-${si}">
      <div class="tag">демо-данные</div>
      <h3>${s.title}</h3>
      ${s.items.map((it,ii) => `
        <div class="row" id="row-${si}-${ii}">
          <span class="name">${it[0]}</span>
          <span class="price">${fmt(it[1])}</span>
        </div>`).join('')}
    </div>`).join('');
}
renderSources();

function mergeData(){
  const map = new Map();
  sources.forEach(s => s.items.forEach(([name, price]) => {
    if(!map.has(name)) map.set(name, []);
    map.get(name).push({supplier: s.supplier, price});
  }));
  const rows = [];
  map.forEach((offers, name) => {
    const avg = offers.reduce((a,o)=>a+o.price,0) / offers.length;
    const best = offers.reduce((a,b)=> a.price < b.price ? a : b);
    rows.push({ name, best, avg, count: offers.length });
  });
  return rows;
}

const mergeBtn = document.getElementById('mergeBtn');
const resetBtn = document.getElementById('resetBtn');
const summary = document.getElementById('summary');
const resultBox = document.getElementById('result');
const resultBody = document.getElementById('resultBody');

mergeBtn.addEventListener('click', () => {
  mergeBtn.disabled = true;
  const allRows = [];
  sources.forEach((s,si) => s.items.forEach((it,ii) => allRows.push(document.getElementById(`row-${si}-${ii}`))));

  allRows.forEach((row, i) => {
    setTimeout(() => row.classList.add('flying'), i * 80);
  });

  const totalDelay = allRows.length * 80 + 350;
  setTimeout(() => {
    const rows = mergeData();
    resultBody.innerHTML = rows.map(r => `
      <tr class="result-row">
        <td data-label="Позиция">${r.name}</td>
        <td data-label="Лучшая цена" class="price-best">${fmt(r.best.price)}</td>
        <td data-label="Поставщик" class="supplier">${r.best.supplier}</td>
        <td data-label="Δ к среднему" class="delta">${r.best.price < r.avg ? '−' : '+'}${fmt(Math.round(Math.abs(r.best.price - r.avg)))} к среднему</td>
      </tr>`).join('');
    resultBox.classList.add('show');

    [...resultBody.children].forEach((tr, i) => {
      setTimeout(() => tr.classList.add('in'), i * 80);
    });

    let n = 0;
    const suppliers = new Set(sources.map(s=>s.supplier)).size;
    const timer = setInterval(() => {
      n++;
      summary.textContent = `${n} позиц${n===1?'ия':n<5?'ии':'ий'} · ${suppliers} поставщика · лучшая цена по каждой`;
      if(n >= rows.length) clearInterval(timer);
    }, 40);

    resetBtn.style.display = 'inline-block';
  }, totalDelay);
});

resetBtn.addEventListener('click', () => {
  renderSources();
  resultBox.classList.remove('show');
  resultBody.innerHTML = '';
  summary.textContent = '';
  mergeBtn.disabled = false;
  resetBtn.style.display = 'none';
});
</script>
</body>
</html>
