<!doctype html>
<html lang="ru">
<head>
<style>
  /* SELF-HOSTED. A demo that needs the internet is a demo that dies in a meeting room
     with bad wifi - and this file's whole promise is that it runs offline. The site
     serves both faces subset to Cyrillic. */
  @font-face{font-family:'Golos Text';font-style:normal;font-weight:400 900;font-display:swap;
    src:url(/fonts/golos-cyrillic.woff2) format('woff2');
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:'Golos Text';font-style:normal;font-weight:400 900;font-display:swap;
    src:url(/fonts/golos-latin.woff2) format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(/fonts/jbmono-cyrillic.woff2) format('woff2')}

</style>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арендный парк</title>


<style>
:root{
  /* ТЁПЛЫЙ ГРАФИТ, а не нейтральный чёрный. На том же сайте стоит /demo/sklad/ - тёмный
     терминал на #111214 с кислотным лаймом, капсом и моноширинным во всём. Park обязан
     читаться как ДРУГОЙ продукт, и подтон - половина этой работы: #14150F уходит в
     зелёно-жёлтую сторону и на глаз читается как тёплое железо, а не как чёрный экран.
     Контраст посчитан, не прикинут: ink 16.9:1 на surface, ink-2 8.4:1, ink-3 5.8:1,
     акцент 9.2:1. Всё, что светлее 5:1, для мелкого текста не берётся. */
  --bg:#0C0D0A; --panel:#14150F; --panel2:#1C1E16; --panel3:#24261C;
  --text:#F2F1E8; --muted:#ADAC9C; --dim:#8D8C7E;
  --acc:#F5A524; --on-acc:#12140F;
  --danger:#FF6B6B; --ok:#3FB980; --warn:#D8A72E; --steel:#616B77;
  --line:1px solid #2B2E24; --lc:#2B2E24;
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --rail:68px;
  /* РАДИУС - ТРИ ЗНАЧЕНИЯ, БЕЗ ИСКЛЮЧЕНИЙ. В файле их было двенадцать (3,4,5,6,7,8,12,16,
     50%,999px), то есть политики радиуса не было вообще. */
  --r-mark:2px;   /* марки данных: столбики, ячейки теплокарты, чипы, бейджи */
  --r-panel:6px;  /* карточки, панели, поля, кнопки */
  /* ОТСТУПЫ от базы 4 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --inset:#0F100C; --scheme:dark; --tint:rgba(255,255,255,.055); --tint2:var(--tint2);
  --heat0:#1A1C15;   /* самый тёмный шаг рампы - ОТЛИЧИМ от панели, иначе 0% и «нет данных» сливаются */
}
/* СВЕТЛАЯ ТЕМА. Её не было вообще - только @media print, где акцент вычищался в чёрный,
   то есть бренд исчезал ровно на том артефакте, который клиент уносит с собой.
   #6E7A84 проваливается на 4.39 и потому не взят; --dim здесь 5.28:1 на бумаге. */
html.light{
  --bg:#F5F6F7; --panel:#FFFFFF; --panel2:#FFFFFF; --panel3:#EDEFF1;
  --text:#14181C; --muted:#4C565F; --dim:#636D76;
  --acc:#A85F00; --on-acc:#FFFFFF;
  --danger:#C2181D; --ok:#0F7A4E; --warn:#8A6100; --steel:#5A6470;
  --line:1px solid #D8DDE1; --lc:#D8DDE1;
  --inset:#EDEFF1; --scheme:light; --tint:rgba(0,0,0,.045); --tint2:rgba(0,0,0,.10);
  --heat0:#E7EAEC;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.5;letter-spacing:-.008em;-webkit-text-size-adjust:100%}
/* ponytail: у страницы и рельса полос нет; внутренние таблицы оставляют тонкую тёмную —
   без неё 500px договоров недостижимы */
html,body,#nav{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,#nav::-webkit-scrollbar{width:0;height:0}
.card,.gantt,.modal .body,#modalWrap{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.20) transparent}
.card::-webkit-scrollbar,.gantt::-webkit-scrollbar,.modal .body::-webkit-scrollbar,#modalWrap::-webkit-scrollbar{width:8px;height:8px}
.card::-webkit-scrollbar-track,.gantt::-webkit-scrollbar-track,.modal .body::-webkit-scrollbar-track,#modalWrap::-webkit-scrollbar-track{background:transparent}
.card::-webkit-scrollbar-thumb,.gantt::-webkit-scrollbar-thumb,.modal .body::-webkit-scrollbar-thumb,#modalWrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.20);border-radius:4px}
.card::-webkit-scrollbar-thumb:hover,.gantt::-webkit-scrollbar-thumb:hover,.modal .body::-webkit-scrollbar-thumb:hover{background:rgba(245,165,36,.6)}
/* ГЛУБИНА ТОНОМ, НЕ РИСУНКОМ. Здесь стояли янтарное пятно, второе белое и миллиметровка в
   обе стороны - четыре слоя фона под учётной ведомостью. Янтарь по новой политике работает
   только на кнопке, активном состоянии и линии «сегодня», поэтому пятно ушло; сетка ушла
   вместе с ним, потому что глубину дают три ступени поверхности, а не линии. */
body{overflow-x:hidden;background:var(--bg)}
.num,td.n,th.n,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
td.n,th.n{text-align:right}
a{color:var(--text);text-decoration:none}
a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit}
.caps{text-transform:uppercase;letter-spacing:.05em;font:600 10.5px/1.3 var(--ui);color:var(--dim)}
#app{display:flex;min-height:100vh}

/* ── рельс ── */
/* РЕЛЬС БЫЛ ХОЛОДНО-СИНИМ - ровно тот подтон, от которого уходит весь этот рестайл.
   Тёплый графит, одна ступень поверхности, без стекла. */
#nav{width:var(--rail);flex:none;background:var(--panel);border-right:var(--line);padding:14px 0 20px;display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:0;height:100vh;z-index:40}
.brand{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:7px;margin-bottom:10px;
  font:800 13px/1 var(--ui);letter-spacing:.03em;color:var(--acc);
  background:rgba(245,165,36,.10);box-shadow:inset 0 0 0 1px rgba(245,165,36,.45)}
.navadd{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:7px;border:0;cursor:pointer;
  background:var(--acc);color:#17130A;margin-bottom:14px}
.navadd:hover{background:#FFB63F}
.navb{position:relative;width:46px;height:42px;display:grid;place-items:center;border-radius:7px;background:none;border:0;cursor:pointer;color:var(--dim)}
.navb span:not(.badge){display:none}
.navb:hover{color:var(--text);background:var(--tint)}
.navb[aria-current="true"]{color:var(--acc);background:rgba(245,165,36,.12);box-shadow:inset 0 0 0 1px rgba(245,165,36,.28)}
.navb[aria-current="true"]::before{content:'';position:absolute;left:-11px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--acc);box-shadow:0 0 10px 1px rgba(245,165,36,.8)}
.navb::after{content:attr(data-t);position:absolute;left:52px;top:50%;transform:translateY(-50%) scale(.96);transform-origin:left center;white-space:nowrap;background:var(--panel3);border:var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--text);opacity:0;pointer-events:none;transition:.12s;z-index:60;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.navb:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
.navb .badge{position:absolute;top:4px;right:4px;min-width:15px;height:15px;padding:0 3px;font:600 10px/15px var(--mono);background:var(--danger);color:#0e202d;border-radius:8px}
.navsp{flex:1}
/* ponytail: своя история — у приложения один URL, кнопка «назад» браузера тут бесполезна */
.hedge{position:fixed;top:0;bottom:0;width:12px;z-index:55;border:0;padding:0;cursor:pointer;
  background:var(--tint);color:transparent;display:grid;place-items:center;
  transition:width .14s ease,background .14s ease,color .14s ease}
.hedge:not(.r){left:var(--rail);border-left:var(--line)}
.hedge.r{right:0;border-right:var(--line)}
.hedge:hover,.hedge:focus-visible{width:34px;background:var(--tint2);color:var(--text);outline:none}
.hedge:active{background:rgba(245,165,36,.18);color:var(--acc)}
.hedge svg{flex:none}
.hedge.r svg{transform:scaleX(-1)}
.hedge[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.hedge{transition:none}}

main{flex:1;min-width:0;display:flex;flex-direction:column}
/* ── шапка ── */
#top{position:sticky;top:0;z-index:30;padding:13px 22px 12px;border-bottom:var(--line);
  background:var(--panel);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#top .tl{display:flex;align-items:baseline;gap:10px;min-width:0}
#top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
#top .sub{font:500 12.5px/1.3 var(--ui);color:var(--muted);letter-spacing:0}
.spacer,#top .sp{flex:1}
.searchwrap{position:relative;display:flex;align-items:center}
.searchwrap svg{position:absolute;left:10px;opacity:.45;pointer-events:none}
input,select,textarea{background:var(--inset);border:var(--line);color:var(--text);border-radius:6px;padding:9px 11px;font:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:rgba(245,165,36,.65);box-shadow:0 0 0 3px rgba(245,165,36,.13)}
input[type=date]{color-scheme:var(--scheme);font-family:var(--mono);font-size:13px}
#search{padding-left:32px;width:200px;font-size:13px}
#search::placeholder{color:var(--dim)}
.btn{background:var(--panel2);border:var(--line);border-radius:6px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.14s}
.btn:hover{border-color:rgba(255,255,255,.32);background:var(--panel3)}
.btn.pri{background:var(--acc);color:#17130A;border-color:transparent;font-weight:700;box-shadow:none}
.btn.pri:hover{background:#FFB63F;border-color:transparent}
.btn.term{background:var(--tint);color:var(--text);border-color:var(--tint2);font-weight:650}
.btn.term:hover{background:var(--tint2);border-color:var(--tint2)}
.btn.dgr{color:var(--danger)}
.btn.dgr:hover{border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.08)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
#view{padding:20px 22px 90px;flex:1}
#view>*{animation:rise .36s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.09s}
#view>*:nth-child(4){animation-delay:.12s}#view>*:nth-child(5){animation-delay:.15s}
#view>*:nth-child(n+6){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}}

/* ── панели ── */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 70%),var(--panel);border:var(--line);border-radius:8px;padding:16px;overflow-x:auto}
.card h3{margin:0 0 12px;font:600 15px/1.4 var(--ui);letter-spacing:-.01em;color:var(--text)}
.grid{display:grid;gap:14px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.danger{color:var(--danger)}.ok{color:var(--ok)}.warn{color:var(--warn)}.acc{color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1.5 var(--ui);padding:2px 8px;border-radius:6px;border:var(--line);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.tag.ok{border-color:rgba(63,185,128,.55);color:var(--ok);background:rgba(63,185,128,.14)}
.tag.dgr{border-color:rgba(229,72,77,.55);color:var(--danger);background:rgba(229,72,77,.14)}
.tag.wrn{border-color:rgba(216,167,46,.55);color:var(--warn);background:rgba(216,167,46,.14)}
.tag.acc{border-color:rgba(245,165,36,.55);color:var(--acc);background:rgba(245,165,36,.14)}

/* ── таблицы ── */
table{width:100%;border-collapse:collapse}
th{text-align:left;font:600 12px/1.45 var(--ui);color:var(--dim);padding:0 12px 9px;white-space:nowrap}
td{padding:10px 12px;border-top:var(--line);vertical-align:top}
td.n,th.n{white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(245,165,36,.05)}
tr.clk{cursor:pointer}
tr.clk:hover td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
@media (min-width:901px){.resp td:first-child{min-width:150px}.resp td{white-space:nowrap}.resp td>div{overflow:hidden;text-overflow:ellipsis}}

/* ── табло KPI ── */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px}
.kpi .k{position:relative;overflow:hidden;background:var(--panel);border:var(--line);border-radius:var(--r-panel);padding:var(--s4)}
.kpi .k .lbl{font:500 12px/1.45 var(--ui);color:var(--dim);margin-bottom:8px}
.kpi .k .val{font:650 25px/1.08 var(--mono);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k .note,.kpi .k .nt{font:12px/1.4 var(--ui);color:var(--muted);margin-top:6px}
.kpi .k::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(255,255,255,.1)}
.kpi .k-ok::before{background:var(--ok);box-shadow:0 0 12px rgba(63,185,128,.5)}
.kpi .k-warn::before{background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 6px)}
.kpi .k-danger::before{background:repeating-linear-gradient(135deg,var(--danger) 0 3px,transparent 3px 6px)}
.kpi .k-danger{box-shadow:inset 0 0 0 1px rgba(229,72,77,.28)}

/* ── формы ── */
.f{margin-bottom:12px}
.f label{display:block;font:500 12px/1.45 var(--ui);color:var(--dim);margin-bottom:6px}
.f .err{color:var(--danger);font-size:12px;margin-top:5px;display:none}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--danger);box-shadow:0 0 0 3px rgba(229,72,77,.14)}
.f.bad .err{display:block}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}

/* ── модальные ── */
#modalWrap{position:fixed;inset:0;background:rgba(4,12,18,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:100;overflow:auto;backdrop-filter:blur(3px);animation:fade .16s both}
@keyframes fade{from{opacity:0}}
#modalWrap[hidden]{display:none}
.modal{background:var(--panel);border:var(--line);border-radius:var(--r-panel);width:100%;max-width:640px;margin:auto;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.modal header{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:var(--line)}
.modal header h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.modal .body{padding:16px 18px;max-height:calc(100vh - 210px);overflow:auto}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:13px 18px;border-top:var(--line);flex-wrap:wrap;background:rgba(9,24,34,.4);border-radius:0 0 16px 16px}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:5px;line-height:0;border-radius:6px}
.x:hover{color:var(--text);background:var(--tint)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);opacity:0;visibility:hidden;background:var(--panel3);border:var(--line);border-radius:7px;padding:11px 15px;z-index:200;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(245,165,36,.14)}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ── Гантт-календарь ── */
.gantt{--cw:34px;--nm:196px;position:relative;overflow:auto;border:var(--line);border-radius:8px;background:var(--panel);max-height:calc(100vh - 200px);min-height:280px;box-shadow:0 1px 0 var(--tint) inset,0 18px 40px -28px rgba(0,0,0,.8)}
.gwrap{position:relative;min-width:calc(var(--nm) + var(--cw)*var(--n))}
.gover{position:absolute;top:0;bottom:0;left:var(--nm);right:0;pointer-events:none;z-index:0}
.gover i{position:absolute;top:0;bottom:0;width:var(--cw);background:rgba(255,255,255,.035)}
.gtop{position:absolute;top:0;bottom:0;left:var(--nm);right:0;pointer-events:none;z-index:0}
.gtop i{position:absolute;top:0;bottom:0;width:2px;margin-left:calc(var(--cw)/2 - 1px);background:var(--acc);box-shadow:none;opacity:.9}
.grow{position:relative;z-index:2;display:flex;border-top:var(--line)}
.grow:hover .gname{background:var(--panel2)}
.gname{position:sticky;left:0;z-index:5;flex:0 0 var(--nm);width:var(--nm);padding:8px 12px;background:var(--panel);border-right:var(--line)}
.gname .un{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname .um{display:flex;align-items:center;gap:7px;margin-top:4px}
.gname .um b{font:600 10.5px var(--mono);color:var(--muted);flex:none}
.gtrack{position:relative;flex:1;height:46px;cursor:copy;background-color:transparent;
  background-image:repeating-linear-gradient(90deg,var(--tint) 0 1px,transparent 1px var(--cw))}
.ghead{border-top:0;position:sticky;top:0;z-index:8;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.ghead .gname{background:transparent;border-bottom:var(--line)}
.ghead .gtrack{height:38px;cursor:default;border-bottom:var(--line);background:none}
.gd{position:absolute;top:5px;width:var(--cw);text-align:center;font:600 11px/1.15 var(--mono);color:var(--muted)}
.gd s{display:block;text-decoration:none;font:500 11px/1.5 var(--ui);color:var(--dim)}
.gd.we{color:var(--dim)}
.gd.td{color:var(--acc)}
.gbar{position:absolute;top:8px;height:30px;border-radius:5px;display:flex;align-items:center;padding:0 10px;gap:6px;min-width:0;
  font-size:11.5px;color:var(--text);font-weight:600;overflow:hidden;white-space:nowrap;cursor:pointer;
  background:var(--panel3);box-shadow:inset 0 0 0 1px var(--tint2),inset 3px 0 0 0 var(--acc);transition:background .12s,box-shadow .12s}
.gbar:hover{background:#2E363F;box-shadow:inset 0 0 0 1px rgba(245,165,36,.45),inset 3px 0 0 0 var(--acc);z-index:5}
.gbar.past{background:var(--tint);color:var(--muted);box-shadow:inset 0 0 0 1px var(--tint),inset 3px 0 0 0 var(--steel)}
.gbar.mnt{background:repeating-linear-gradient(135deg,rgba(216,167,46,.7) 0 5px,var(--panel2) 5px 10px);color:var(--text);
  box-shadow:inset 0 0 0 1px rgba(216,167,46,.55);font-weight:600}
.gbar.mnt span{background:var(--panel2);padding:1px 5px;border-radius:var(--r-mark)}
.gbar.clash{background:rgba(229,72,77,.18);color:var(--text);box-shadow:inset 0 0 0 1px rgba(229,72,77,.65),inset 3px 0 0 0 var(--danger)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:7px}
.bar{height:5px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;border-radius:4px}

.empty{text-align:center;padding:56px 20px;color:var(--muted);max-width:540px;margin:0 auto}
.empty h3{font-size:17px;margin:16px 0 8px;color:var(--text);letter-spacing:-.01em}
.empty p{margin:0 0 18px;font-size:13.5px;text-wrap:pretty}
.seg{display:inline-flex;background:var(--inset);border:var(--line);border-radius:7px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:rgba(245,165,36,.15);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(245,165,36,.25)}
.hd{display:flex;align-items:center;gap:12px;margin:26px 0 11px;flex-wrap:wrap}
/* НАДЗАГОЛОВОК СТАЛ ЗАГОЛОВКОМ. 11px капсом с трекингом .06em - это подпись, а не название
   раздела; и капс по-русски читается заметно хуже латиницы. Сканер на соседнем демо кричит
   капсом во всём, park должен говорить - это самая заметная из пяти осей расхождения. */
.hd h2{font:600 15px/1.4 var(--ui);letter-spacing:-.01em;color:var(--text);margin:0;flex:none}
.hd .dim{font:11px var(--mono)}
.hd::after{content:'';flex:1;min-width:20px;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 3px,transparent 3px 7px)}
.note{position:relative;padding:10px 13px 10px 14px;background:rgba(245,165,36,.06);border-radius:6px;font-size:12.5px;color:var(--muted);overflow:hidden}
.note::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.note.dgr{background:rgba(229,72,77,.08);color:var(--text)}
.note.dgr::before{background:repeating-linear-gradient(135deg,var(--danger) 0 3px,transparent 3px 6px)}
.note.wrn{background:rgba(216,167,46,.08)}
.note.wrn::before{background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 6px)}
.note b{color:var(--text)}
.gbar em{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:auto;letter-spacing:-.02em}
.gbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gbar em{flex:none}
.kpi .val i{font-style:normal;opacity:.42;font-size:.6em;margin-left:.2em;vertical-align:.08em;letter-spacing:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.navb:focus-visible,.btn:focus-visible{outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,#view>*{animation:none !important;transition:none !important}}
#print{display:none}

@media (max-width:900px){
  /* ponytail: рельс остаётся слева на всех ширинах — не превращаем его в верхнюю полосу с горизонтальным скроллом */
  :root{--rail:56px}
  #nav{padding:10px 0 14px}
  .navb{width:42px;height:40px}
  #top{padding:11px 13px;gap:10px}
  #top h1{font-size:16px}
  #view{padding:15px 13px 100px}
  #search{width:100%}
  .searchwrap{flex:1 1 100%;order:3}
  .kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi .k .val{font-size:21px}
  .gantt{--nm:132px;--cw:30px;max-height:none}
  .modal .body{max-height:none}
  #modalWrap{padding:10px}
  table.resp thead{display:none}
  table.resp tr{display:block;border-top:var(--line);padding:9px 0}
  table.resp tr:first-child{border-top:0}
  table.resp td{display:flex;justify-content:space-between;gap:14px;border:0;padding:3px 2px}
  table.resp td::before{content:attr(data-l);color:var(--dim);font:500 12px/1.45 var(--ui);flex:none}
  table.resp td.n{text-align:right}
  tr.clk:hover td:first-child{box-shadow:none}
}
@media print{
  #app,#toast,#modalWrap{display:none !important}
  #print{display:block}
  html,body{background:#fff;color:#000;font-size:11pt}
  @page{size:A4;margin:14mm}
  .doc{max-width:180mm;margin:0 auto}
  .doc h1{font-size:15pt;margin:0 0 2mm}
  .doc table{border-collapse:collapse;width:100%;margin:4mm 0}
  .doc th,.doc td{border:1px solid #000;padding:2mm 2.5mm;font-size:10pt;color:#000;text-transform:none;letter-spacing:0}
  .doc th{background:#eee;font-size:10pt}
  .doc .sig{margin-top:10mm;display:flex;gap:16mm}
  .doc .sig div{flex:1;border-top:1px solid #000;padding-top:1.5mm;font-size:9pt}
  .doc .meta{font-size:10pt;margin:1mm 0}
  .doc hr{border:0;border-top:2px solid #000;margin:3mm 0}
  .pb{page-break-after:always}
}
/* ═══ ПОЛИТИКА АКЦЕНТА ════════════════════════════════════════════════════════
   Янтарь делал семь работ одновременно - CTA, активная вкладка, серия столбиков, рампа
   теплокарты, брусок брони, ховер строки и микрополоса загрузки. Семь работ = ноль сигнала.
   Разрешён ТОЛЬКО на: заливке главной кнопки, активном состоянии навигации/сегмента и
   линии «сегодня». Данные рисует плоская сталь. */
tbody tr:hover{background:rgba(255,255,255,.035)}
html.light tbody tr:hover{background:rgba(0,0,0,.035)}

/* БОКОВЫЕ ПОЛОСКИ УБРАНЫ. На 17 карточках подряд цветная полоска слева - это уже обои,
   а не сигнал: она стояла и на каждом KPI, и на каждом алерте. */
.kpi .k::before,.note::before{display:none}
.note{padding-left:var(--s3)}

/* НАДЗАГОЛОВКИ БЕЗ КАПСА. Капс по-русски читается заметно хуже - «КОМПРЕССОР 5 М³/МИН»
   тому доказательство - и остаётся только на микроподписях в 11px. */
.caps{text-transform:none;letter-spacing:0;font:600 12px/1.45 var(--ui);color:var(--dim)}

/* РАДИУС: одна политика на весь файл, переопределяет всё, что накопилось раньше */
.card,.kpi,.modal>div,.seg,.btn,input,select,textarea,.f input,.f select,.f textarea{border-radius:var(--r-panel)}
.chip,.badge,.tag,table.heat td i,.lg{border-radius:var(--r-mark)}
.btn{min-height:38px}
.dot,.avatar{border-radius:999px}

/* ГЛУБИНА ТОНОМ, А НЕ ЛИНИЕЙ - три ступени поверхности, границ почти нет.
   Референс: тональные почти-чёрные поверхности, глубина тоном, а не тенью. */
.card,.kpi{background:var(--panel);border:1px solid transparent;box-shadow:none}
html.light .card,html.light .kpi{border-color:var(--lc)}


/* ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ. Светлой темы не было вообще - только @media print, где акцент
   вычищался в чёрный, то есть бренд исчезал ровно на том листе, который клиент уносит. */
.thm{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:var(--line);
  border-radius:var(--r-panel);padding:3px;flex:none}
.thm button{border:0;background:transparent;color:var(--dim);padding:5px 10px;border-radius:var(--r-mark);
  cursor:pointer;font:500 12px/1 var(--ui)}
.thm button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);font-weight:600}

/* ═══ A+B · ДОСКА И ПРИБОРКА ══════════════════════════════════════════════════
   Структура взята из направления A, ГОЛОС - нет. Мокап A нарисован моноширинным и
   капсом на нейтральном чёрном с сигнальным жёлтым - это ровно пять признаков
   складского сканера, который стоит на соседнем демо. Здесь та же доска говорит
   на Golos, обычным регистром, по тёплому графиту: моноширинный оставлен цифрам. */
.foot4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--lc);
  border:var(--line);border-radius:var(--r-panel);overflow:hidden;margin-top:var(--s4)}
.foot4>div{background:var(--panel);padding:var(--s3) var(--s4)}
.foot4 s{display:block;text-decoration:none;font:500 12px/1.45 var(--ui);color:var(--dim);margin-bottom:2px}
.foot4 b{font:600 19px/1.25 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.foot4 b.dgr{color:var(--danger)}
@media(max-width:720px){.foot4{grid-template-columns:repeat(2,1fr)}}

.clusection{margin-top:var(--s5)}
.clu{border:var(--line);border-radius:var(--r-panel);background:var(--panel);overflow:hidden}
/* ОДНО ЧИСЛО ВО ВЕСЬ БЛОК - это и есть ДНК приборки: читается за полсекунды, всё
   остальное вторично и набрано мельче. 25px - верхняя ступень шкалы, здесь она
   единственный раз выходит за неё, потому что это главный прибор экрана. */
.clu__main{padding:var(--s5) var(--s4) var(--s4);text-align:center}
.clu__big{font:600 44px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--acc)}
.clu__big s{text-decoration:none;font:500 15px/1 var(--ui);color:var(--dim);margin-left:8px}
.clu__sub{font:500 13px/1.5 var(--ui);color:var(--dim);margin-top:var(--s2)}
.clu__arc{height:8px;margin:var(--s4) auto 0;max-width:520px;background:var(--inset);
  border-radius:999px;overflow:hidden}
.clu__arc i{display:block;height:100%;background:var(--steel);border-radius:999px;
  transition:width .25s cubic-bezier(.2,.8,.2,1)}
.clu__scale{display:flex;justify-content:space-between;max-width:520px;margin:6px auto 0;
  font:500 11px/1.4 var(--ui);color:var(--dim)}
.clu__gau{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--lc);
  border-top:var(--line)}
.clu__gau>div{background:var(--panel);padding:var(--s3) var(--s4)}
.clu__gau s{display:block;text-decoration:none;font:500 12px/1.45 var(--ui);color:var(--dim);margin-bottom:2px}
.clu__gau b{font:600 17px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.clu__gau b.dgr{color:var(--danger)}
@media(max-width:720px){.clu__gau{grid-template-columns:repeat(2,1fr)}.clu__big{font-size:34px}}
.clu__warn{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:var(--s3) var(--s4);border-top:var(--line)}
/* СТАТУС НИКОГДА НЕ ОДНИМ ЦВЕТОМ - иконка и текст рядом, иначе дальтоник читает пустоту */
.cw{display:inline-flex;align-items:center;gap:6px;font:500 13px/1.4 var(--ui)}
.cw svg{flex:none}
.cw--ok{color:var(--dim)}
.cw--soon{color:var(--warn)}
.cw--due{color:var(--danger)}
.clu__warn .btn{margin-left:auto}

/* ВЫБРАННАЯ ДОРОЖКА. Янтарь по политике акцента разрешён на активном состоянии - это оно. */
.grow.is-sel .gname{box-shadow:inset 3px 0 0 0 var(--acc)}
.grow.is-sel{background:var(--tint)}
.gname .un a{cursor:pointer}
@media (prefers-reduced-motion:reduce){.clu__arc i{transition:none}}

/* ДОСКА ЧИТАЕТСЯ, А НЕ УГАДЫВАЕТСЯ. Брусок брони стоял на var(--panel3) с янтарной
   кромкой: на тёмном фоне это почти сама панель, и дорожка выглядела пустой даже там,
   где машина работает. Янтарь при этом делал седьмую работу подряд, вопреки политике.
   Теперь занятость - статус: работает / завершено / ремонт, каждый со своим тоном и
   подписью, а янтарь остаётся кнопке, активной дорожке и линии «сегодня». */
.gbar{background:color-mix(in oklab,var(--ok) 26%,var(--panel));
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ok) 42%,transparent),
             inset 3px 0 0 0 var(--ok);border-radius:var(--r-mark)}
.gbar:hover{background:color-mix(in oklab,var(--ok) 38%,var(--panel))}
.gbar.past{background:var(--inset);color:var(--muted);
  box-shadow:inset 0 0 0 1px var(--tint2),inset 3px 0 0 0 var(--steel)}
.gbar.clash{box-shadow:inset 0 0 0 1px var(--danger),inset 3px 0 0 0 var(--danger)}
/* микрополоса загрузки - сталь, не янтарь: это данные, а не действие */
.um i,.um b+div>i,.gname .um i{background:var(--steel)!important}

/* ── графики: марки данных, а не украшения ─────────────────────────────────── */
:root{--cost:#3A3D31}          /* расходы: тёмный нейтральный, читается как «съедено» */
html.light{--cost:#C4CBD1}
.chart .gl{stroke:var(--lc)}
.chart .gz{stroke:var(--dim);stroke-width:1}
.chart .ax.pt{fill:var(--dim);font-size:11px}
.lgn{color:var(--dim);margin-left:16px;font-size:12px}
.chart .bl{fill:var(--text);font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums}
.chart .bm{fill:var(--dim);font:500 11px/1 var(--ui)}
.chnote{color:var(--dim);font-size:12px;padding:2px 2px 6px}
/* ЗАЛИВКА СТОЛБИКА ПЛОСКАЯ. Была linear-gradient(180deg,#F5A524,rgba(245,165,36,.3)) -
   низ растворялся ровно там, где глаз меряет высоту, то есть градиент стоял против
   единственной задачи столбика. */
/* ── графики (наследие) ──────────────────────────────────────────────────────────────
   preserveAspectRatio="none" on the SVG means the viewBox stretches to whatever width the card
   has, so a fixed aspect-ratio here is what stops it squashing to a stripe on a wide screen. */
.chart{padding:var(--s4) var(--s4) var(--s2)}
.chart svg{display:block;width:100%;height:auto;aspect-ratio:1000/250;overflow:visible}
.chart svg text{font-family:var(--ui);letter-spacing:0}
.chart .ax{fill:var(--dim);font-size:12px}
.chart .dnum{fill:var(--text);font-size:30px;font-weight:600;font-family:var(--mono)}
/* полоса-цель во всю высоту: попасть в неё курсором легче, чем в столбик шириной 8px */
.hz{cursor:crosshair}
.hz:hover{fill:var(--tint)}
.crosshair{opacity:0;transition:opacity .12s ease}
.chart svg:hover .crosshair{opacity:1}
.lgs{display:flex;align-items:center;color:var(--dim);font-size:12.5px}
.lg{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 6px 0 16px;
  vertical-align:-1px}
.lg--dot{width:9px;height:9px;border-radius:50%}
.lg--ramp{width:74px;height:9px;border-radius:5px;margin:0 8px;
  background:linear-gradient(90deg,var(--tint),rgba(245,165,36,.35),#F5A524)}

/* ДОНАТ. Раньше это был flex: донат 260px слева, легенда растягивалась на весь остаток, и на
   широком экране между названием типа и суммой открывалась пустая полоса в 700px - карточка
   читалась как наполовину пустая. Теперь колонки поменялись ролями: легенда занимает гибкую
   колонку слева и ЗАПОЛНЯЕТ её долевой полосой, донат стоит фиксированной колонкой справа и
   крупнее. Полоса не декор - длину глаз сравнивает точнее, чем угол сектора, поэтому «19% vs
   18%» в списке видно, а в кольце нет; кольцо отвечает за целое, список за порядок. */
.chart--mix{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s6);
  align-items:center;padding-bottom:var(--s4)}
.chart--mix svg{width:300px;aspect-ratio:1;justify-self:end}
.chart--mix .sl{transition:opacity .16s ease}
.chart--mix svg:hover .sl{opacity:.45}
.chart--mix svg .sl:hover{opacity:1}
.lgd{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 0;
  border-bottom:var(--line)}
.lrow:last-child{border-bottom:0}
.lrow i{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.lrow .lt{flex:0 0 150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* дорожка забирает ВЕСЬ остаток строки, а не фиксированные 380px: с фиксированной шириной
   между названием и полосой открывалась та же дыра, из-за которой карточка и выглядела
   пустой - просто уехавшая на 150px правее. Растущая дорожка дыр не оставляет вообще. */
.lbar{flex:1 1 auto;min-width:56px;height:6px;border-radius:3px;background:var(--tint)}
.lbar b{display:block;height:100%;border-radius:3px}
.lrow>b{flex:0 0 44px;text-align:right}
.lrow .dim{flex:0 0 118px;text-align:right;font-size:12px}
@media(max-width:820px){
  .chart--mix{grid-template-columns:1fr;gap:var(--s4)}
  .chart--mix svg{justify-self:center;width:min(100%,260px)}
  .lrow .lt{flex:0 0 92px}
  .lrow .dim{flex:0 0 96px}
}

/* теплокарта: одна ячейка = единица за период. Сетка, а не 300 отдельных SVG. */
.chart--heat{overflow-x:auto}
/* table-layout:fixed - иначе колонки с подписью месяца становятся шире соседних, и решётка
   выглядит рваной: ширину задаёт содержимое заголовка, а не данные */
table.heat{border-collapse:separate;border-spacing:2px;width:100%;min-width:520px;
  table-layout:fixed}
table.heat th:first-child,table.heat td:first-child{width:168px}
table.heat th{font-weight:400;color:var(--dim);font-size:11px;text-align:center;padding:0}
table.heat tbody th{text-align:left;white-space:nowrap;padding-right:10px;font-size:12px;
  max-width:170px;overflow:hidden;text-overflow:ellipsis}
table.heat td{padding:0}
table.heat td i{display:block;height:20px;border-radius:3px;min-width:9px}
table.heat td i:hover{outline:2px solid var(--text);outline-offset:-1px}

/* одна подсказка на все графики: 300 ячеек с нативным title - это 300 узлов и задержка
   браузера в секунду перед показом */
#tip{position:fixed;z-index:90;pointer-events:none;opacity:0;transform:translate(-50%,-140%);
  background:var(--panel2);border:var(--line);border-radius:var(--r-panel);padding:7px 10px;font-size:12.5px;
  color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.55);white-space:nowrap;
  transition:opacity .1s ease}
#tip.on{opacity:1}

/* теплокарта заменила полосу загрузки: та показывала парк одним числом за период, а вопрос
   владельца - какая ИМЕННО единица простаивает. */
@media (prefers-reduced-motion:reduce){
  .crosshair,.chart--mix .sl,#tip{transition:none}
}
</style>

<body>
<div id="app">
  <nav id="nav"></nav>
  <main>
    <header id="top">
      <div class="tl"><h1 id="viewTitle">—</h1><span class="sub" id="viewSub"></span></div>
      <span class="sp"></span>
      <span class="searchwrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="search" placeholder="Поиск  /"></span>
      <span class="thm" role="group" aria-label="Тема оформления"><button type="button" data-thm="dark" aria-pressed="true">Тёмная</button><button type="button" data-thm="light" aria-pressed="false">Светлая</button></span>
      <span id="actions" style="display:flex;gap:8px;flex-wrap:wrap"></span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modalWrap" hidden></div>
<div id="toast"></div>
<div id="print"></div>
<script>
"use strict";
/* ═══════════ 0. Утилиты ═══════════ */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* — числа — */
function fmt(n,d){ // разряды пробелами
  if(n==null||!isFinite(n)) return '—';
  const dec = d==null ? (Math.abs(n%1)>0.004?2:0) : d;
  const s=Math.abs(n).toFixed(dec).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
  return (n<0?'−':'')+s.join(',');
}
const money=(n,d)=>fmt(n,d)+'\u2009₽';
function parseAmount(raw){ // «1 234,56» «1234.56» «1 234 567»
  if(raw==null) return NaN;
  let s=String(raw).trim().replace(/[\s\u00a0\u2009']/g,'').replace(/₽|руб\.?/gi,'');
  if(!s) return NaN;
  const neg=/^-/.test(s); s=s.replace(/^[+-]/,'');
  if(!/^[\d.,]+$/.test(s)) return NaN;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  const sep=Math.max(lc,ld);
  let int,frac='';
  if(sep>=0){
    const tail=s.slice(sep+1);
    if(/^\d{3}$/.test(tail) && (s.match(/[.,]/g)||[]).length>1){ int=s.replace(/[.,]/g,''); }
    else if(/^\d{1,2}$/.test(tail)){ int=s.slice(0,sep).replace(/[.,]/g,''); frac=tail; }
    else { int=s.replace(/[.,]/g,''); }
  } else int=s;
  if(!/^\d+$/.test(int)||(frac&&!/^\d+$/.test(frac))) return NaN;
  const v=parseFloat(int+(frac?'.'+frac:''));
  return neg?-v:v;
}

const W1=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];

const WH=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
function tri(n,fem){
  const o=[],h=Math.floor(n/100),t=Math.floor(n%100/10),u=n%10;
  if(h)o.push(WH[h]);
  if(t===1)o.push(WT[u]); else {if(t)o.push(WD[t]); if(u)o.push((fem?W1F:W1)[u]);}
  return o.join(' ');
}
function intWords(n,fem){
  n=Math.floor(Math.abs(n));
  if(n===0)return 'ноль';
  const sc=[[1e9,['миллиард','миллиарда','миллиардов'],false],[1e6,['миллион','миллиона','миллионов'],false],[1e3,['тысяча','тысячи','тысяч'],true]];
  const out=[];let rest=n;
  for(const [div,forms,f] of sc){const g=Math.floor(rest/div);rest-=g*div;if(g){out.push(tri(g,f));out.push(plural(g,forms));}}
  if(rest)out.push(tri(rest,fem));
  return out.filter(Boolean).join(' ');
}
function moneyWords(v){
  const neg=v<0; v=Math.abs(r2(v));
  const rub=Math.floor(v+1e-9), kop=Math.round(r2(v-rub)*100);
  let s=intWords(rub,false)+' '+plural(rub,['рубль','рубля','рублей'])+' '+String(kop).padStart(2,'0')+' '+plural(kop,['копейка','копейки','копеек']);
  s=s[0].toUpperCase()+s.slice(1);
  return (neg?'Минус ':'')+s;
}

function innValid(v){
  const s=String(v||'').trim();
  if(!/^\d{10}$/.test(s)&&!/^\d{12}$/.test(s))return false;
  const d=s.split('').map(Number);
  const cs=(a,w)=>w.reduce((s,k,i)=>s+k*a[i],0)%11%10;
  if(d.length===10)return cs(d,[2,4,10,3,5,9,4,6,8])===d[9];
  return cs(d,[7,2,4,10,3,5,9,4,6,8])===d[10] && cs(d,[3,7,2,4,10,3,5,9,4,6,8])===d[11];
}

const I8=new Set(['cal','park','doc','clock','money','chart','users','db'])
const ico=(k,sz)=>'<svg width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+

/* ═══════════ 1. Хранилище, версия, миграция ═══════════ */
const KEY='arendapark';
/* ВЕРСИЯ ДЕМО-ДАННЫХ, отдельная от версии формата. Формат не менялся - менялся сам набор:
   истории стало два года вместо девяти месяцев. Без этой версии человек, открывавший демо
   раньше, навсегда остаётся со старым набором, потому что засев срабатывает только когда в
   хранилище пусто. Именно поэтому «9 месяцев» и «С начала данных» продолжали показывать
   одно и то же уже после того, как данные удлинили: у браузера лежал прежний засев.
   Пересевается ТОЛЬКО демо-набор (db.demo). Данные, введённые руками, не трогаются никогда -
   иначе обновление демо стирало бы чужую работу. */
const DEMO_VER=2;
const BLANK=()=>({version:1,demo:false,demoVer:0,units:[],clients:[],contracts:[],shifts:[],maint:[],payments:[],ui:{}});
let db=BLANK();

function migrate(raw){
  // приводим любую сохранённую структуру к version:1
  if(!raw||typeof raw!=='object')return BLANK();
  let d=raw;
  if(d.version==null){ // v0: без номера версии — считаем ранним черновиком
    d=Object.assign(BLANK(),d,{version:1});
  }
  if(d.version===1){/* актуальная */}
  else if(d.version>1){ throw new Error('Файл создан более новой версией программы (version '+d.version+').'); }
  const b=BLANK();
  for(const k of ['units','clients','contracts','shifts','maint','payments'])
    b[k]=Array.isArray(d[k])?d[k]:[];
  b.demo=!!d.demo; b.demoVer=+d.demoVer||0; b.ui=(d.ui&&typeof d.ui==='object')?d.ui:{};
  // добора полей по умолчанию (форвард-совместимость)
  b.units.forEach(u=>{u.archived=!!u.archived;u.toInterval=u.toInterval||250;u.meter0=u.meter0||0;});
  b.clients.forEach(c=>{c.archived=!!c.archived;c.defer=c.defer==null?0:c.defer;});
  b.contracts.forEach(c=>{c.status=c.status||'active';c.deposit=c.deposit||0;c.minShift=c.minShift||0;c.otAfter=c.otAfter||0;c.otMult=c.otMult||1;c.depWithheld=c.depWithheld||0;});
  return b;
}
function load(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)||'null'); }
  catch(e){ console.warn('Повреждённое состояние, начинаем заново',e); raw=null; }
  try{ db=migrate(raw); }catch(e){ db=BLANK(); alert(e.message); }
}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ toast('Не удалось сохранить: '+e.message); }
},60); }
function commit(msg){ save(); render(); if(msg)toast(msg); }

/* — валидация импорта — */
function validateDump(o){
  const E=[];
  if(!o||typeof o!=='object'||Array.isArray(o))return['Файл не содержит объект с данными.'];
  if(typeof o.version!=='number')E.push('Нет числового поля "version" — это не файл базы арендного парка.');
  else if(o.version>1)E.push('Версия файла '+o.version+' новее поддерживаемой (1).');
  const need={units:['id','name'],clients:['id','name'],contracts:['id','clientId','unitId','from','to'],shifts:['id','contractId','date'],maint:['id','unitId','date'],payments:['id','date','amount']};
  for(const k in need){
    if(o[k]==null){E.push('Отсутствует раздел «'+k+'».');continue;}
    if(!Array.isArray(o[k])){E.push('Раздел «'+k+'» должен быть списком.');continue;}
    o[k].forEach((it,i)=>{
      if(!it||typeof it!=='object'){E.push(k+'['+i+']: не объект.');return;}
      need[k].forEach(f=>{if(it[f]==null||it[f]==='')E.push(k+'['+i+']: нет поля «'+f+'».');});
    });
  }
  if(E.length)return E.slice(0,12);
  const ids=k=>new Set(o[k].map(x=>x.id));
  const U=ids('units'),C=ids('clients'),K=ids('contracts');
  o.contracts.forEach((c,i)=>{
    if(!U.has(c.unitId))E.push('Договор №'+(i+1)+': техника '+c.unitId+' не найдена в файле.');
    if(!C.has(c.clientId))E.push('Договор №'+(i+1)+': клиент '+c.clientId+' не найден в файле.');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(c.from||'')||!/^\d{4}-\d{2}-\d{2}$/.test(c.to||''))E.push('Договор №'+(i+1)+': некорректные даты.');
    else if(c.to<c.from)E.push('Договор №'+(i+1)+': дата окончания раньше начала.');
  });
  o.shifts.forEach((s,i)=>{if(!K.has(s.contractId))E.push('Смена №'+(i+1)+': договор не найден.');});
  o.maint.forEach((m,i)=>{if(!U.has(m.unitId))E.push('Ремонт №'+(i+1)+': техника не найдена.');});
  return E.slice(0,12);
}

/* ═══════════ 2. Тост / отмена удаления ═══════════ */
const undoStack=[];
let toastT=null;
function toast(html,undoFn){
  const t=$('#toast');
  t.innerHTML='<span>'+html+'</span>'+(undoFn?'<button class="btn sm" id="undoBtn">'+ico('undo',13)+' Отменить</button>':'');
  t.classList.add('on');
  if(undoFn)$('#undoBtn').onclick=()=>{undoFn();t.classList.remove('on');};
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),undoFn?9000:3500);
}
function removeWithUndo(coll,items,label){
  const arr=db[coll], snap=items.map(it=>({it,i:arr.indexOf(it)}));
  snap.sort((a,b)=>a.i-b.i);
  items.forEach(it=>{const i=arr.indexOf(it);if(i>=0)arr.splice(i,1);});
  const restore=()=>{snap.forEach(({it,i})=>arr.splice(Math.min(i,arr.length),0,it));commit('Удаление отменено');};
  undoStack.push(restore);
  save();render();
  toast(label,()=>{const f=undoStack.pop();if(f)f();});
}
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    const f=undoStack.pop();
    if(f)f(); else toast('Отменять нечего');
  }
});

let modalStack=[];
function modal({title,body,footer,onOpen,wide}){
  const w=$('#modalWrap');
  const m=document.createElement('div');
  m.className='modal'; if(wide)m.style.maxWidth='860px';
  m.innerHTML='<header><h2>'+esc(title)+'</h2><span class="spacer" style="flex:1"></span><button class="x" data-close>'+ico('x',18)+'</button></header><div class="body">'+body+'</div>'+(footer?'<footer>'+footer+'</footer>':'');

const byId=(coll,id)=>db[coll].find(x=>x.id===id)||null;
const unit=id=>byId('units',id), client=id=>byId('clients',id), contract=id=>byId('contracts',id);

const TYPES=['Экскаватор','Погрузчик','Бульдозер','Автокран','Самосвал','Компрессор','Генератор','Виброплита','Бетононасос','Ямобур'];
const RATE={hour:'час',shift:'смена',day:'сутки'};

/* ═══════════ 5. Расчётное ядро ═══════════ */
// Начисление по одной смене с учётом минимальной смены и переработки
function shiftAmount(c,s){
  const h=+s.hours||0;
  if(c.rateMode==='hour'){
    const billed=Math.max(h,+c.minShift||0);
    const norm=+c.otAfter||0;
    if(norm>0&&billed>norm) return r2(norm*c.rate+(billed-norm)*c.rate*(+c.otMult||1));
    return r2(billed*c.rate);
  }
  if(c.rateMode==='shift'){
    const norm=(+c.otAfter||8);
    let a=+c.rate;
    if(h>norm) a+=(h-norm)*(c.rate/norm)*(+c.otMult||1);
    return r2(a);
  }
  // day: одна запись = сутки
  const norm=(+c.otAfter||24);
  let a=+c.rate;
  if(h>norm) a+=(h-norm)*(c.rate/norm)*(+c.otMult||1);
  return r2(a);
}
const cShifts=cid=>db.shifts.filter(s=>s.contractId===cid);
function shiftBreak(c,s){ // расшифровка для акта
  const h=+s.hours||0;
  if(c.rateMode==='hour'){
    const billed=Math.max(h,+c.minShift||0), norm=+c.otAfter||0;
    const ot=norm>0?Math.max(0,billed-norm):0;
    return {base:billed-ot,ot:ot,unit:'ч',minApplied:billed>h};
  }
  const norm=c.rateMode==='shift'?(+c.otAfter||8):(+c.otAfter||24);
  return {base:1,ot:Math.max(0,h-norm),unit:c.rateMode==='shift'?'смена':'сутки',minApplied:false};
}
function contractAccrued(c,upto){
  let sum=0;
  for(const s of cShifts(c.id)) if(!upto||s.date<=upto) sum+=shiftAmount(c,s);
  return r2(sum);
}
const contractHours=cid=>r2(cShifts(cid).reduce((a,s)=>a+(+s.hours||0),0));
const contractPaid=c=>r2(db.payments.filter(p=>p.contractId===c.id&&p.kind==='аренда').reduce((a,p)=>a+p.amount,0));
const contractDebt=c=>r2(contractAccrued(c)-contractPaid(c));
function contractDue(c){ const cl=client(c.clientId); return addDays(c.to,cl?(+cl.defer||0):0); }
function contractOverdue(c){ const d=contractDebt(c); return d>0.004&&today()>contractDue(c)?d:0; }
const depositPaid=c=>r2(db.payments.filter(p=>p.contractId===c.id&&p.kind==='залог').reduce((a,p)=>a+p.amount,0)
                       -db.payments.filter(p=>p.contractId===c.id&&p.kind==='возврат залога').reduce((a,p)=>a+p.amount,0));

// Занятость / конфликты
const unitContracts=uid=>db.contracts.filter(c=>c.unitId===uid);
function conflicts(uid,from,to,exceptId){
  return db.contracts.filter(c=>c.unitId===uid&&c.id!==exceptId&&c.status!=='cancelled'&&overlaps(c.from,c.to,from,to));
}
function maintDays(uid,from,to){ // множество дней простоя по ремонтам
  const set=new Set();
  db.maint.filter(m=>m.unitId===uid&&(+m.down||0)>0).forEach(m=>{
    eachDay(m.date,addDays(m.date,(+m.down||0)-1),d=>{if((!from||d>=from)&&(!to||d<=to))set.add(d);});
  });
  return set;
}
function rentDays(uid,from,to){
  const set=new Set();
  unitContracts(uid).filter(c=>c.status!=='cancelled').forEach(c=>{
    const a=c.from>from?c.from:from, b=c.to<to?c.to:to;
    if(a<=b)eachDay(a,b,d=>set.add(d));
  });
  return set;
}
function utilization(uid,from,to){
  const total=dayCount(from,to);
  const md=maintDays(uid,from,to), rd=rentDays(uid,from,to);
  let rent=0; rd.forEach(d=>{if(!md.has(d))rent++;});
  const avail=Math.max(0,total-md.size);
  return {total,repair:md.size,rent,avail,idle:Math.max(0,avail-rent),k:avail?rent/avail:0};
}
// Наработка (моточасы) единицы
function unitHours(uid,upto){
  const cids=new Set(unitContracts(uid).map(c=>c.id));
  return r2(db.shifts.filter(s=>cids.has(s.contractId)&&(!upto||s.date<=upto)).reduce((a,s)=>a+(+s.hours||0),0));
}
const unitMeter=uid=>r2((unit(uid)?+unit(uid).meter0||0:0)+unitHours(uid));
function unitRevenue(uid,from,to){
  let sum=0;
  unitContracts(uid).forEach(c=>{
    cShifts(c.id).forEach(s=>{ if((!from||s.date>=from)&&(!to||s.date<=to)) sum+=shiftAmount(c,s); });
  });
  return r2(sum);
}
const unitDayRate=u=>u.rateDay||(u.rateShift?u.rateShift*1.4:(u.rateHour?u.rateHour*11:0));
// Экономика единицы за период
function unitEcon(uid,from,to){
  const u=unit(uid); if(!u)return null;
  const rev=unitRevenue(uid,from,to);
  const ms=db.maint.filter(m=>m.unitId===uid&&m.date>=from&&m.date<=to);
  const service=r2(ms.filter(m=>m.kind==='ТО').reduce((a,m)=>a+(+m.cost||0),0));
  const repair=r2(ms.filter(m=>m.kind!=='ТО').reduce((a,m)=>a+(+m.cost||0),0));
  const ut=utilization(uid,from,to);
  const dayRate=unitDayRate(u);
  const downLoss=r2(ut.repair*dayRate);         // упущенная выручка за дни ремонта
  const net=r2(rev-service-repair-downLoss);
  return {u,rev,service,repair,downLoss,net,ut,dayRate,
          days:dayCount(from,to),from,to,
          maint:ms.slice().sort((a,b)=>a.date<b.date?1:-1)};
}
function unitLifetime(uid){
  const u=unit(uid); const from=u.purchase||'2000-01-01', to=today();
  const e=unitEcon(uid,from,to);
  e.payback=u.cost?e.net/u.cost*100:0;
  return e;
}
// Дебиторка клиента
function clientMoney(cid){
  const cs=db.contracts.filter(c=>c.clientId===cid);
  let accr=0,paid=0,over=0,dep=0;
  cs.forEach(c=>{accr+=contractAccrued(c);paid+=contractPaid(c);over+=contractOverdue(c);dep+=depositPaid(c);});
  const other=r2(db.payments.filter(p=>p.clientId===cid&&!p.contractId&&p.kind==='аренда').reduce((a,p)=>a+p.amount,0));
  return {accr:r2(accr),paid:r2(paid+other),debt:r2(accr-paid-other),overdue:r2(over),deposits:r2(dep),contracts:cs};
}
// Плановое ТО по моточасам
function toStatus(uid){
  const u=unit(uid); const iv=+u.toInterval||250;
  const m=unitMeter(uid);
  const done=db.maint.filter(x=>x.unitId===uid&&x.kind==='ТО'&&x.meter!=null).map(x=>+x.meter);
  const last=done.length?Math.max.apply(null,done):(+u.meter0||0);
  const next=last+iv;
  const left=r2(next-m);
  // средняя наработка в день по последним 45 дням
  const cids=new Set(unitContracts(uid).map(c=>c.id));
  const since=addDays(today(),-45);
  const recent=db.shifts.filter(s=>cids.has(s.contractId)&&s.date>=since).reduce((a,s)=>a+(+s.hours||0),0);
  const perDay=recent/45;
  const etaDays=perDay>0.05?Math.max(0,Math.round(left/perDay)):null;
  const etaDate=etaDays!=null?addDays(today(),etaDays):null;
  const warnAt=Math.max(20,Math.round(iv*0.12));   // предупреждаем за N моточасов
  const affected=etaDate?unitContracts(uid).filter(c=>c.status==='active'&&c.to>=today()&&overlaps(c.from,c.to,etaDate,addDays(etaDate,2))):[];
  return {meter:m,last,next,left,iv,perDay:r2(perDay),etaDays,etaDate,warnAt,due:left<=0,soon:left>0&&left<=warnAt,affected};
}

function issues(){

    else if(t.soon)out.push({lvl:'wrn',t:'ТО подходит',d:u.name+': осталось '+fmt(t.left,1)+' м/ч'+(t.etaDate?' (ожидаемо '+dmy(t.etaDate)+')':'')+(t.affected.length?', затронет '+t.affected.length+' '+plural(t.affected.length,['бронь','брони','броней']):''),go:()=>openUnit(u.id)});

  return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeInn10(rnd){ // корректный ИНН — контрольная цифра считается
  const d=[];for(let i=0;i<9;i++)d.push(i===0?1+Math.floor(rnd()*8):Math.floor(rnd()*10));
  const w=[2,4,10,3,5,9,4,6,8];
  d.push(w.reduce((s,k,i)=>s+k*d[i],0)%11%10);
  return d.join('');
}
function genDemo(){

  const FORM=['ООО','ООО','ООО','АО','ИП','ООО'];

  // 1) капитальный ремонт автокрана — техника выбыла надолго
  {const g=longestGap(CRANE)||[addDays(START,130),END];
   addM('u'+(CRANE+1),g[0],'Ремонт','Капитальный ремонт гидравлики, замена секции стрелы (ожидание запчастей)',1250000,Math.min(dayCount(g[0],g[1]),46),null);}
  // 2) ремонт экскаватора
  {const g=longestGap(1)||[addDays(START,60),addDays(START,70)];
   addM('u2',g[0],'Ремонт','Замена гидронасоса и рукавов высокого давления',268000,Math.min(dayCount(g[0],g[1]),9),null);}
  // 3) ремонт самосвала
  {const g=longestGap(5)||[addDays(START,90),addDays(START,96)];
   addM('u6',g[0],'Ремонт','Ремонт КПП, замена сцепления',154000,Math.min(dayCount(g[0],g[1]),6),null);}
  // дорогое ТО простаивающего бетононасоса — регламент не зависит от загрузки
  {const u=d.units[IDLE];
   addM(u.id,addDays(START,42),'ТО','Регламентное ТО бетононасоса: промывка, замена поршней',95000,0,null);
   addM(u.id,addDays(START,196),'ТО','Регламентное ТО бетононасоса: гидроаккумулятор, сальники',95000,0,null);}

  /* — платежи, закрытие договоров, залоги — */
  // клиент с просрочкой — у кого больше всего давних договоров с начислениями
  const accrOf=c=>r2(d.shifts.filter(s=>s.contractId===c.id).reduce((a,s)=>a+shiftAmount(c,s),0));
  const cand=cid=>d.contracts.filter(c=>c.clientId===cid&&c.to<addDays(END,-45)&&accrOf(c)>0);
  const OVER=d.clients.slice().sort((a,b)=>cand(b.id).length-cand(a.id).length)[0].id;
  const overCs=cand(OVER);
  const overUnpaid=overCs[overCs.length-1]||null;                 // не платит и не закрыт
  const overHold=overCs.length>1?overCs[0]:null;                  // закрыт с удержанием залога
  let pi=1;
  const addP=(cid,kid,date,amount,kind)=>d.payments.push({id:'p'+(pi++),clientId:cid,contractId:kid,date,amount:r2(amount),kind});
  const openLeft=[];                                 // договоры, которые оставим не закрытыми
  d.contracts.forEach((c,idx)=>{
    const cl=d.clients.find(x=>x.id===c.clientId);
    const accr=r2(d.shifts.filter(s=>s.contractId===c.id).reduce((a,s)=>a+shiftAmount(c,s),0));
    if(c.deposit>0)addP(c.clientId,c.id,c.from,c.deposit,'залог');
    const expired=c.to<addDays(END,-2);
    if(!expired)  { if(accr>0&&rnd()<0.4)addP(c.clientId,c.id,addDays(c.from,ri(3,9)),r2(accr*0.5),'аренда'); return; }
    if(c===noShiftContract){ openLeft.push(c); return; }            // намеренно: аренда без внесённой наработки
    if(c===overUnpaid){ openLeft.push(c); return; }
    if(c===overHold){
      if(!c.deposit){c.deposit=Math.round(c.rate*4/1000)*1000;addP(c.clientId,c.id,c.from,c.deposit,'залог');}
      if(accr>0)addP(c.clientId,c.id,addDays(c.to,1),accr,'аренда');
      const hold=Math.round(c.deposit*0.6/1000)*1000;
      c.status='closed'; c.closedAt=addDays(c.to,3); c.depWithheld=hold;
      c.note='Удержано из залога: повреждение ковша, простой на диагностике.';
      if(c.deposit-hold>0)addP(c.clientId,c.id,c.closedAt,c.deposit-hold,'возврат залога');
      return;
    }
    if(idx%17===5){ openLeft.push(c); if(accr>0)addP(c.clientId,c.id,addDays(c.to,2),accr,'аренда'); return; }  // оплачен, но не закрыт
    const payDate=addDays(c.to,ri(1,Math.max(1,+cl.defer||3)));
    if(accr>0)addP(c.clientId,c.id,payDate>END?END:payDate,accr,'аренда');
    c.status='closed'; c.closedAt=payDate>END?END:payDate;
    if(c.deposit>0){ addP(c.clientId,c.id,c.closedAt,c.deposit,'возврат залога'); c.depWithheld=0; }
  });
  return d;
}

const WDS=['пн','вт','ср','чт','пт','сб','вс'];
function dayRuns(set){
  const arr=[...set].sort(), out=[];
  arr.forEach(d=>{const l=out[out.length-1]; if(l&&addDays(l[1],1)===d)l[1]=d; else out.push([d,d]);});
  return out;
}
/* ── B · ПРИБОРНАЯ ПАНЕЛЬ ВЫБРАННОЙ ЕДИНИЦЫ ────────────────────────────────
   ДНК приборки самой машины: одно число во весь блок, шкала под ним, три вторичных
   прибора и строка предупреждений. Клик по дорожке доски меняет её - доска отвечает
   «где всё стоит», приборка «а что с этой». Всё считается теми же unitEcon/toStatus,
   которыми живут остальные экраны, поэтому разойтись в цифрах они не могут. */
let selUnit=null;
function cluster(from,to){
  const live=db.units.filter(u=>!u.archived);
  if(!live.length) return '';
  if(!selUnit||!live.some(u=>u.id===selUnit)) selUnit=live[0].id;
  const u=unit(selUnit), e=unitEcon(selUnit,from,to), ts=toStatus(selUnit);
  const hrs=unitHoursIn(selUnit,from,to);
  const k=Math.max(0,Math.min(1,e.ut.k));
  /* шкала - доля периода, которую машина отработала; она же объясняет число над ней */
  const warn=[];
  if(ts.due) warn.push({t:'ТО просрочено на '+Math.abs(ts.left)+' м/ч',lvl:'due'});
  else if(ts.soon) warn.push({t:'ТО через '+ts.left+' м/ч'+(ts.etaDate?' — ориентировочно '+dmy(ts.etaDate):''),lvl:'soon'});
  else warn.push({t:'ТО через '+ts.left+' м/ч',lvl:'ok'});
  if(u.insTo) warn.push({t:'страховка до '+dmy(u.insTo),lvl:u.insTo<today()?'due':'ok'});
  return '<div class="hd"><h2>Приборная панель</h2><span class="lgn">'+esc(u.name)+' · выбирается кликом по дорожке</span></div>'+
  '<div class="clu">'+
    '<div class="clu__main">'+
      '<div class="clu__big"><b>'+fmt(hrs,1)+'</b><s>м/ч</s></div>'+
      '<div class="clu__sub">наработка за период · '+esc(u.type||'—')+'</div>'+
      '<div class="clu__arc" role="img" aria-label="Загрузка '+Math.round(k*100)+' процентов"><i style="width:'+(k*100).toFixed(1)+'%"></i></div>'+
      '<div class="clu__scale"><span>0%</span><span>загрузка '+Math.round(k*100)+'%</span><span>100%</span></div>'+
    '</div>'+
    '<div class="clu__gau">'+
      '<div><s>Выручка за период</s><b>'+money(e.rev,0)+'</b></div>'+
      '<div><s>Результат</s><b class="'+(e.net<0?'dgr':'')+'">'+money(e.net,0)+'</b></div>'+
      '<div><s>Расходы</s><b>'+money(e.service+e.repair,0)+'</b></div>'+
      '<div><s>Простой</s><b>'+e.ut.idle+' дн.</b></div>'+
    '</div>'+
    '<div class="clu__warn">'+warn.map(w=>'<span class="cw cw--'+w.lvl+'">'+
       ico(w.lvl==='ok'?'check':'warn',13)+esc(w.t)+'</span>').join('')+
      '<a class="btn sm" href="#" data-open-unit="'+u.id+'">Карточка единицы</a>'+
    '</div>'+
  '</div>';
}

/* ПОДВАЛ ДОСКИ - четыре числа под ней, как в направлении A. Это не замена аналитике:
   это те же величины, что диспетчер держит в голове, посчитанные за ВИДИМЫЙ месяц, а не
   за произвольный период, поэтому они всегда согласованы с тем, что нарисовано выше. */
function footStrip(list,from,to){
  if(!list.length) return '';
  let rev=0,net=0,rent=0,avail=0,idle=0;
  list.forEach(u=>{const e=unitEcon(u.id,from,to); if(!e)return;
    rev+=e.rev; net+=e.net; rent+=e.ut.rent; avail+=e.ut.avail; idle+=e.ut.idle;});
  const k=avail?rent/avail:0;
  return '<div class="foot4">'+
    '<div><s>Загрузка</s><b>'+Math.round(k*100)+'%</b></div>'+
    '<div><s>Выручка</s><b>'+money(r2(rev),0)+'</b></div>'+
    '<div><s>Результат</s><b class="'+(net<0?'dgr':'')+'">'+money(r2(net),0)+'</b></div>'+
    '<div><s>Простой</s><b>'+idle+' дн.</b></div></div>';
}

       every 34px while r.width/n works out to 36.5, and a click on the last day of the
       month landed two days earlier. It was correct on a phone only because the track
       overflows there. Read the real column width from the custom property the bars
       themselves are positioned with, and the click can no longer disagree with the
       picture. */
    const cw=parseFloat(getComputedStyle(tr).getPropertyValue('--cw'))||(r.width/n);
    const i=clamp(Math.floor((ev.clientX-r.left)/cw),0,n-1);
    contractForm(null,{unitId:tr.dataset.track,from:days[i],to:addDays(days[i],6)});
  });
}

function numField(name,label,val,hint){return F(name,label,'<input inputmode="decimal" class="num" value="'+esc(val==null?'':fmt(val))+'">',hint)}
function readNum(m,name,{min,max,req,int,label}={}){
  const raw=V(m,name);
  if(raw===''){ if(req){fieldErr(m,name,'Заполните поле');return null;} return 0; }
  const v=parseAmount(raw);
  if(!isFinite(v)){fieldErr(m,name,'Не похоже на число. Примеры: 1 234,56 · 1234.56 · 1 234 567');return null;}
  if(int&&Math.abs(v%1)>1e-9){fieldErr(m,name,'Нужно целое число');return null;}
  if(min!=null&&v<min){fieldErr(m,name,'Не меньше '+fmt(min));return null;}
  if(max!=null&&v>max){fieldErr(m,name,'Не больше '+fmt(max));return null;}
  return r2(v);
}
function readDate(m,name,{req=true}={}){
  const v=V(m,name);
  if(!v){if(req){fieldErr(m,name,'Укажите дату');return null;}return ''}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(D(v))){fieldErr(m,name,'Некорректная дата');return null;}
  return v;
}

function freeFrom(uid_,after,len){
  let d=after;
  for(let i=0;i<800;i++){
    if(!conflicts(uid_,d,addDays(d,len-1)).length)return d;
    d=addDays(d,1);
  }
  return after;
}

/* — закрытие договора с залогом — */
function closeForm(id){
  const c=contract(id); if(!c)return;
  const accr=contractAccrued(c), paid=contractPaid(c), debt=r2(accr-paid), dep=depositPaid(c);
  const body='<table style="margin-bottom:14px"><tbody>'+
    '<tr><td>Начислено по наработке ('+cShifts(c.id).length+' '+plural(cShifts(c.id).length,['смена','смены','смен'])+', '+fmt(contractHours(c.id),1)+' ч)</td><td class="n num">'+money(accr)+'</td></tr>'+
    '<tr><td>Оплачено</td><td class="n num">'+money(paid)+'</td></tr>'+
    '<tr><td><b>Долг по аренде</b></td><td class="n num '+(debt>0.004?'danger':'ok')+'"><b>'+money(debt)+'</b></td></tr>'+

    numField('hold','Удержать из залога, ₽',Math.min(dep,Math.max(0,debt)),'Не больше внесённого залога — '+money(dep))+
    F('why','Основание удержания','<textarea rows="2" placeholder="Повреждение, недоплата, перепробег…">'+esc(c.note||'')+'</textarea>')+
    '<div id="res" class="note"></div>';
  const m=modal({title:'Закрытие договора '+(c.no||''),body,onOpen:mm=>{
    const upd=()=>{
      const h=clamp(parseAmount(V(mm,'hold'))||0,0,dep);
      const back=r2(dep-h), rest=r2(debt-h);
      $('#res',mm).innerHTML='Вернуть клиенту: <b class="num">'+money(back)+'</b>'+
        (rest>0.004?' · останется долг <b class="num danger">'+money(rest)+'</b>':(rest<-0.004?' · переплата <b class="num ok">'+money(-rest)+'</b>':' · расчёты закрыты полностью'));
    };
    $('[data-f="hold"] input',mm).oninput=upd; upd();
  },footer:'<span style="flex:1"></span><button class="btn" data-close>Отмена</button><button class="btn term" id="ok">Закрыть договор</button>'});
  $('#ok',m).onclick=()=>{
    clearErrs(m);
    const hold=readNum(m,'hold',{min:0,max:dep}); if(hold===null)return;
    if(hold>0&&!V(m,'why'))return fieldErr(m,'why','Укажите основание удержания — оно попадёт в акт');
    c.status='closed'; c.closedAt=today(); c.depWithheld=hold; c.note=V(m,'why');

/* — удаление со ссылочной защитой — */
function refsOf(coll,o){
  const r=[];

    const mm=db.maint.filter(x=>x.unitId===o.id); if(mm.length)r.push(mm.length+' '+plural(mm.length,['запись обслуживания','записи обслуживания','записей обслуживания']));
  }

    const k=db.contracts.filter(c=>c.clientId===o.id); if(k.length)r.push(k.length+' '+plural(k.length,['договор','договора','договоров']));
    const p=db.payments.filter(x=>x.clientId===o.id); if(p.length)r.push(p.length+' '+plural(p.length,['платёж','платежа','платежей']));

      (canArchive?'<p class="muted">Вместо удаления — архивирование: запись исчезнет из списков выбора и календаря, но все прошлые расчёты, акты и платежи останутся верными.</p>':'<p class="muted">Сначала удалите зависимые записи '+(coll==='contracts'?'(смены и платежи по договору)':'')+'.</p>'),

/* ═══════════ 10. Период и общие блоки ═══════════ */
const PRESETS=[['m','Текущий месяц'],['m3','3 месяца'],['m6','6 месяцев'],['m9','9 месяцев'],['y1','Год'],['all','С начала данных'],['c','Свой период']];
/* OPENS ON NINE MONTHS, not three. The whole argument of this product is "two of your
   twelve machines are not paying for themselves" - and on a three-month window only one
   unit went red and the кран, the single best story in the data, showed a flat zero. The
   default has to be the window where the point is visible without a click. */
let preset='m9';
function applyPreset(p){
  preset=p;
  const t=today();
  if(p==='m'){periodFrom=monthStart(t);periodTo=monthEnd(t)>t?t:monthEnd(t);}
  if(p==='m3'){periodFrom=monthStart(addDays(t,-89));periodTo=t;}
  if(p==='m6'){periodFrom=monthStart(addDays(t,-181));periodTo=t;}
  if(p==='m9'){periodFrom=monthStart(addDays(t,-273));periodTo=t;}
  if(p==='y1'){periodFrom=monthStart(addDays(t,-364));periodTo=t;}
  if(p==='all'){
    const all=db.shifts.map(s=>s.date).concat(db.contracts.map(c=>c.from),db.maint.map(m=>m.date));
    periodFrom=all.length?all.reduce((a,b)=>a<b?a:b):monthStart(t); periodTo=t;
  }
}
const periodBar=()=>'<div class="row" style="align-items:flex-end;gap:10px;margin-bottom:14px">'+
  '<div style="flex:0 0 auto"><div class="seg" id="pset">'+PRESETS.map(([k,t])=>'<button data-p="'+k+'" aria-pressed="'+(preset===k)+'">'+t+'</button>').join('')+'</div></div>'+
  '<div style="flex:0 0 auto;display:flex;gap:8px;align-items:center"><input type="date" id="pf" value="'+periodFrom+'" style="width:150px"><span class="dim">—</span><input type="date" id="pt" value="'+periodTo+'" style="width:150px"></div>'+
  '<div class="dim" style="flex:1;min-width:120px;text-align:right;font-size:12px">'+dayCount(periodFrom,periodTo)+' '+plural(dayCount(periodFrom,periodTo),['день','дня','дней'])+' в периоде</div></div>';
function bindPeriod(){
  $$('#pset [data-p]').forEach(b=>b.onclick=()=>{if(b.dataset.p==='c'){preset='c';}else applyPreset(b.dataset.p);render()});
  const f=$('#pf'),t=$('#pt');
  if(f)f.onchange=()=>{if(f.value){periodFrom=f.value;preset='c';if(periodTo<periodFrom)periodTo=periodFrom;render()}};
  if(t)t.onchange=()=>{if(t.value){periodTo=t.value;preset='c';if(periodTo<periodFrom)periodFrom=periodTo;render()}};
