const m0=n=>money(n,0);
const mB=n=>Math.abs(n)>=1e7?fmt(n/1e6,1)+'\u2009млн\u2009₽':money(n,0);
const kpi=arr=>'<div class="kpi">'+arr.map(([l,v,n,c])=>'<div class="k'+(c?' k-'+c:'')+'"><div class="lbl">'+l+'</div><div class="val'+(c?' '+c:'')+'">'+v+'</div>'+(n?'<div class="nt">'+n+'</div>':'')+'</div>').join('')+'</div>';
/* по умолчанию сталь, а не янтарь: полоса показывает величину, а не зовёт нажать */
const bar=(k,c)=>'<div class="bar"><i style="width:'+clamp(k*100,0,100)+'%;background:'+(c||'var(--steel)')+'"></i></div>';

/* ═══════════ график: выручка, результат и загрузка по периоду ═══════════
   Hand-rolled SVG on purpose. A chart library is 60-200KB for one picture in a file whose whole
   selling point is that it is one file you can open from a memory stick - and the picture is
   twelve rectangles and a polyline. ponytail: no dependency, no build step.

   Buckets adapt to the period, because the same chart has to answer "how was this month" and
   "how were these two years": under ~70 days it splits by week, otherwise by month. Without
   that, «Текущий месяц» drew a single bar and said nothing.

   Everything is derived from the SAME unitEcon() the KPI cards use, so the bars always add up
   to the numbers above them. A chart computed a second way is a chart that eventually
   contradicts the figure next to it. */
const MON3=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function trendBuckets(from,to){
  const out=[], days=dayCount(from,to);
  if(days<=16){                                  // дни - иначе первые числа месяца дают один столбец
    eachDay(from,to,d=>out.push({from:d,to:d,full:true,label:dmy(d).slice(0,5)}));
  }else if(days<=70){                            // недели
    let a=from;
    while(a<=to){ const b=minStr(addDays(a,6),to);
      out.push({from:a,to:b,full:dayCount(a,b)===7,label:dmy(a).slice(0,5)}); a=addDays(b,1); }
  }else{                                         // месяцы
    let a=monthStart(from);
    while(a<=to){
      const next=monthStart(addDays(monthEnd(a),1));
      const b=minStr(monthEnd(a),to), s=maxStr(a,from);
      /* ПОЛНЫЙ ЛИ ЭТО МЕСЯЦ. Период 98 дней даёт корзины май/июн/июл/авг, и последняя - это
         6 дней из 31. Раньше её столбик стоял рядом с полными месяцами без единой пометки, и
         график заявлял, что август обвалился. Он не обвалился, он ещё идёт. */
      if(s<=b) out.push({from:s,to:b,full:(s===a&&b===monthEnd(a)),
        days:dayCount(s,b), span:dayCount(a,monthEnd(a)),
        label:MON3[+a.slice(5,7)-1]+(a.slice(5,7)==='01'||out.length===0?' '+a.slice(2,4):'')});
      a=next;
    }
  }
  return out;
}
/* monthEnd already exists at the top of the file - redeclaring it threw at PARSE time, which
   took the entire script down: no console error, every function undefined, the page rendered a
   bare «—». Worth remembering that a duplicate const in one big inline script is not a local
   mistake, it is a blank app. */
const minStr=(a,b)=>a<b?a:b, maxStr=(a,b)=>a>b?a:b;

function trendChart(from,to){
  const units=db.units.filter(u=>!u.archived);
  const buckets=trendBuckets(from,to);
  if(buckets.length<2) return '';
  /* ОДИН проход по данным на все три графика. unitEcon по единице на корзину - это 12x25
     вызовов; считать их отдельно для динамики, для теплокарты и для доната значило бы
     умножить работу на три и, что хуже, дать трём картинкам разойтись в цифрах. */
  const M=units.map(u=>buckets.map(b=>unitEcon(u.id,b.from,b.to)));
  const bk=buckets.map((b,j)=>{
    let rev=0,net=0,rent=0,avail=0;
    units.forEach((u,i)=>{const e=M[i][j];rev+=e.rev;net+=e.net;rent+=e.ut.rent;avail+=e.ut.avail;});
    return {...b,rev:r2(rev),net:r2(net),util:avail?rent/avail:0};
  });
  return chartTrend(bk)+chartMix(units,M)+chartHeat(units,buckets,M);
}

/* ── 1. динамика: выручка столбцами, результат линией ───────────────────────
   Одна ось: обе величины в рублях. Две шкалы на одной картинке - самая частая ошибка в
   графиках и способ показать любую корреляцию, какую захочется. */
function chartTrend(bk){
  const W=1000,H=300,L=76,R=16,T=30,B=34, iw=W-L-R, ih=H-T-B;
  /* СТОЛБИК = ВЫРУЧКА, а нижний тёмный сегмент = расходы. Раньше поверх столбиков шла
     зелёная линия результата, и она была бесполезна: выручка 2 395 206 против результата
     2 339 706 - это 97,7%, поэтому линия липла к вершинам, а в июне маркер садился ровно на
     кромку. Интересна РАЗНИЦА (расходы 55 500), и теперь её видно как сегмент у основания.
     Верх окрашен статусом: зелёный - заработали, красный - ушли в минус. */
  const lo=Math.min(0,Math.min.apply(null,bk.map(b=>Math.min(b.net,b.rev)))); 
  const hi=Math.max.apply(null,bk.map(b=>Math.max(b.rev,b.net)).concat([1]));
  const N=niceTicks(lo,hi,4), span=(N.hi-N.lo)||1, y=v=>T+ih-(v-N.lo)/span*ih;
  /* ШИРИНА СТОЛБИКА ОГРАНИЧЕНА. Четыре корзины на 900px дали столбики по 213px - это уже
     не марка данных, а заливка. Ширина упирается в 84px и столбик встаёт по центру своей
     дорожки, поэтому число корзин меняет их количество, а не их массу. */
  const bw=iw/bk.length, w=Math.min(84,bw*0.62), rad=2;
  const y0=y(0);
  const grid=N.ticks.map(v=>{const yy=y(v), zero=Math.abs(v)<1e-9;
    return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" class="'+(zero?'gz':'gl')+'"/>'+
           '<text x="'+(L-12)+'" y="'+(yy+4)+'" text-anchor="end" class="ax">'+short(v)+'</text>';}).join('');
  const cx=i=>L+i*bw+bw/2;
  const bars=bk.map((b,i)=>{
    const x=L+i*bw+(bw-w)/2;
    const cost=Math.max(0,b.rev-b.net);
    const partial=b.full===false;
    /* СТОПКА СНИЗУ ВВЕРХ: расходы стоят на нуле, результат лежит на них, вершина = выручка.
       Первый заход клался наоборот и читался как «расходы съели всё»: расходы здесь 55 500
       против выручки 2 395 206 - 2,3% - а серым была залита почти вся высота. */
    const yCost=y(cost), yTop=y(Math.max(b.rev,0));
    let s='';
    if(cost>0.004) s+='<rect x="'+x+'" y="'+yCost+'" width="'+w+'" height="'+Math.max(1,y0-yCost)+'" fill="var(--cost)"/>';
    s+='<rect x="'+x+'" y="'+yTop+'" width="'+w+'" height="'+Math.max(1,yCost-yTop)+'" rx="'+rad+'" fill="var(--ok)"/>';
    if(b.net<0) s='<rect x="'+x+'" y="'+y0+'" width="'+w+'" height="'+Math.max(1,y(b.net)-y0)+'" fill="var(--danger)"/>';
    /* ЦИФРА НА СТОЛБИКЕ. Его замечание было «недостаточно деталей»: чтобы прочесть значение,
       приходилось водить глазом от вершины к оси. Сумма и маржа стоят прямо над столбиком. */
    const mg=b.rev>0.004?Math.round(b.net/b.rev*100):0;
    s+='<text x="'+(x+w/2)+'" y="'+(yTop-10)+'" text-anchor="middle" class="bl">'+short(b.rev)+'</text>'+
       '<text x="'+(x+w/2)+'" y="'+(yTop-25)+'" text-anchor="middle" class="bm">'+mg+'%</text>';
    /* НЕПОЛНЫЙ ПЕРИОД штрихуется и подписывается - иначе он сравнивается как полный */
    if(partial) s+='<rect x="'+x+'" y="'+yTop+'" width="'+w+'" height="'+Math.max(1,y0-yTop)+'" fill="url(#hatch)"/>'+
      '<text x="'+(x+w/2)+'" y="'+(yTop-40)+'" text-anchor="middle" class="ax pt">неполный</text>';
    return s;}).join('');
  const step=Math.ceil(bk.length/12);
  const labs=bk.map((b,i)=>i%step?'':'<text x="'+cx(i)+'" y="'+(H-10)+'" text-anchor="middle" class="ax">'+esc(b.label)+(b.full===false?' *':'')+'</text>').join('');
  const hit=bk.map((b,i)=>{const m=b.rev>0.004?Math.round(b.net/b.rev*100):0;
    return '<rect class="hz" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+ih+'" fill="transparent"'+
    ' data-tip="'+esc(b.label+(b.full===false?' · неполный период'+(b.days?' ('+b.days+' из '+b.span+' дн.)':''):'')+
      ' · выручка '+money(b.rev)+' · расходы '+money(Math.max(0,b.rev-b.net))+' · результат '+money(b.net)+' ('+m+'%)')+'"/>';}).join('');
  const anyPartial=bk.some(b=>b.full===false);
  return '<div class="hd"><h2>Динамика за период</h2><span class="lgs">'+
      '<i class="lg" style="background:var(--ok)"></i>результат'+
      '<i class="lg" style="background:var(--cost)"></i>расходы'+
      '<span class="lgn">высота столбика — выручка</span></span></div>'+
    '<div class="card chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Выручка, расходы и результат по периодам">'+
    '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
      '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--panel)" stroke-width="3"/></pattern></defs>'+
    grid+bars+labs+'<g class="crosshair"><line y1="'+T+'" y2="'+(T+ih)+'" stroke="var(--dim)" stroke-width="1"/></g>'+hit+'</svg>'+
    (anyPartial?'<div class="chnote">* период ещё не закончился — столбик заштрихован и не сравним с полными месяцами</div>':'')+
    '</div>';
}

/* ── 2. структура выручки по типам: донат ───────────────────────────────────
   Донат отвечает ровно на один вопрос - "из чего сложилась выручка" - и только пока долей
   немного. Типов техники девять; девять секторов не читаются, поэтому пять крупнейших плюс
   «прочее». Точные числа всё равно живут в таблице ниже, донат даёт пропорцию за один взгляд. */
const SER=['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9'];
function chartMix(units,M){
  const by={};
  units.forEach((u,i)=>{ by[u.type]=(by[u.type]||0)+M[i].reduce((a,e)=>a+e.rev,0); });
  let arr=Object.keys(by).map(t=>({t,v:r2(by[t])})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  if(!arr.length) return '';
  if(arr.length>6){ const rest=arr.slice(5).reduce((a,x)=>a+x.v,0); arr=arr.slice(0,5).concat([{t:'Прочее',v:r2(rest)}]); }
  const tot=arr.reduce((a,x)=>a+x.v,0)||1;
  const S=300, c=S/2, rO=140, rI=88;
  const pol=(r,a)=>[c+r*Math.cos(a),c+r*Math.sin(a)];
  let a0=-Math.PI/2, segs='';
  arr.forEach((x,i)=>{
    const frac=x.v/tot, sweep=frac*Math.PI*2;
    const pad=Math.min(0.030,sweep*0.10);          // 2px-зазор между долями
    const s=a0+pad/2, e=a0+sweep-pad/2, big=(e-s)>Math.PI?1:0;
    if(e>s){ const[x1,y1]=pol(rO,s),[x2,y2]=pol(rO,e),[x3,y3]=pol(rI,e),[x4,y4]=pol(rI,s);
      segs+='<path class="sl" d="M'+x1+' '+y1+'A'+rO+' '+rO+' 0 '+big+' 1 '+x2+' '+y2+'L'+x3+' '+y3+'A'+rI+' '+rI+' 0 '+big+' 0 '+x4+' '+y4+'Z" fill="'+SER[i]+'"'+
        ' data-tip="'+esc(x.t+' · '+money(x.v)+' · '+Math.round(frac*100)+'%')+'"/>'; }
    a0+=sweep;
  });
  const legend=arr.map((x,i)=>{ const p=x.v/tot;
    return '<div class="lrow"><i style="background:'+SER[i]+'"></i>'+
    '<span class="lt">'+esc(x.t)+'</span>'+
    '<span class="lbar"><b style="width:'+(p*100).toFixed(1)+'%;background:'+SER[i]+'"></b></span>'+
    '<b class="num">'+Math.round(p*100)+'%</b>'+
    '<span class="num dim">'+money(x.v)+'</span></div>'; }).join('');
  /* легенда стоит в разметке ПЕРВОЙ: читается слева направо - от списка к итогу в кольце */
  return '<div class="hd"><h2>Из чего сложилась выручка</h2></div>'+
    '<div class="card chart chart--mix">'+
      '<div class="lgd">'+legend+'</div>'+
      '<svg viewBox="0 0 '+S+' '+S+'" role="img" aria-label="Выручка по типам техники">'+segs+
      '<text x="'+c+'" y="'+(c-2)+'" text-anchor="middle" class="dnum">'+short(tot)+'</text>'+
      '<text x="'+c+'" y="'+(c+20)+'" text-anchor="middle" class="ax">всего выручки</text></svg>'+
      '</div>';
}

/* ── 3. теплокарта загрузки: единица x период ───────────────────────────────
   Та единственная картинка, которая отвечает на вопрос владельца «какая машина простаивает»
   без чтения таблицы. Шкала одноцветная и от тёмного к яркому: последовательные данные не
   раскрашивают радугой - у радуги нет порядка, и глаз читает её как категории. */
function chartHeat(units,buckets,M){
  if(buckets.length<3) return '';
  const step=Math.ceil(buckets.length/12);
  const cell=u=>{const k=clamp(u,0,1);
    return k<0.02?'var(--tint)':'rgba(245,165,36,'+(0.14+0.86*k).toFixed(3)+')';};
  const rows=units.map((u,i)=>'<tr><th scope="row">'+esc(u.name)+'</th>'+
    buckets.map((b,j)=>{const e=M[i][j], k=e.ut.avail?e.ut.rent/e.ut.avail:0;
      return '<td><i style="background:'+cell(k)+'" data-tip="'+esc(u.name+' · '+b.label+' · загрузка '+Math.round(k*100)+'%')+'"></i></td>';}).join('')+'</tr>').join('');
  const head=buckets.map((b,j)=>'<th>'+(j%step?'':esc(b.label))+'</th>').join('');
  return '<div class="hd"><h2>Загрузка: единица × период</h2><span class="lgs">'+
      'меньше<i class="lg lg--ramp"></i>больше</span></div>'+
    '<div class="card chart chart--heat"><table class="heat"><thead><tr><th></th>'+head+'</tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
/* ОСЬ, КОТОРУЮ МОЖНО ПОКАЗАТЬ. Тиков-функции в файле не было вообще - деления считались как
   max*k/4, поэтому ось читалась 0 / 351 тыс / 701 тыс / 1,1 млн / 1,4 млн. Никто не выпускает
   «701 тыс». Шаг округляется вверх до 1/2/2.5/5/10 x 10^n, то есть до числа, которое человек
   и так держит в голове, и ось становится 0 / 400 тыс / 800 тыс / 1,2 млн. */
function niceTicks(lo,hi,want){
  want=want||4;
  if(!(hi>lo)) hi=lo+1;
  const raw=(hi-lo)/want, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  const start=Math.floor(lo/step)*step, end=Math.ceil(hi/step)*step, out=[];
  for(let v=start;v<=end+step*1e-9;v+=step) out.push(Math.abs(v)<step*1e-9?0:v);
  return {ticks:out, lo:start, hi:end};
}
const short=v=>Math.abs(v)>=1e6?fmt(v/1e6,1)+' млн':(Math.abs(v)>=1e3?Math.round(v/1e3)+' тыс':String(Math.round(v)));

/* Одна подсказка на все графики, через делегирование на document - потому что графики
   перерисовываются целиком при каждой смене периода, и обработчики, навешенные на элементы,
   пришлось бы вешать заново каждый раз (а старые - снимать, иначе они копятся).
   Нативный title тут не годится: у теплокарты 300 ячеек, и браузер показывает его с
   секундной задержкой - для «навёл и увидел» это мёртвая пауза. */
(function tips(){
  let el=null;
  const tip=()=>el||(el=document.body.appendChild(Object.assign(document.createElement('div'),{id:'tip'})));
  const hide=()=>{ if(el)el.classList.remove('on');
    document.querySelectorAll('.crosshair line').forEach(l=>l.removeAttribute('x1')); };
  document.addEventListener('mousemove',e=>{
    const t=e.target.closest?e.target.closest('[data-tip]'):null;
    if(!t){hide();return;}
    const d=tip(); d.textContent=t.getAttribute('data-tip'); d.classList.add('on');
    /* держим подсказку в окне: у крайних столбиков она иначе уезжает за край */
    const w=d.offsetWidth||0;
    d.style.left=clamp(e.clientX,w/2+8,innerWidth-w/2-8)+'px';
    d.style.top=Math.max(e.clientY,52)+'px';
    /* вертикаль встаёт по центру наведённой полосы, а не под курсором - так она совпадает
       со столбиком, о котором говорит подсказка */
    const svg=t.ownerSVGElement, ch=svg&&svg.querySelector('.crosshair line');
    if(ch&&t.classList.contains('hz')){
      const x=+t.getAttribute('x')+ +t.getAttribute('width')/2;
      ch.setAttribute('x1',x); ch.setAttribute('x2',x);
    }
  },{passive:true});
  document.addEventListener('mouseleave',hide,true);
  addEventListener('scroll',hide,{passive:true});
})();

/* — почему единица убыточна: текст строится из расчёта — */
function whyBad(e){
  const r=[];
  const rep=e.maint.filter(m=>m.kind!=='ТО'), to=e.maint.filter(m=>m.kind==='ТО');
  if(rep.length&&(e.repair>e.rev*0.25||e.repair>0&&e.net<0))
    r.push('Ремонты: '+rep.map(m=>dmy(m.date)+' — '+money(m.cost)+(m.down?' и '+m.down+' '+plural(m.down,['день','дня','дней'])+' простоя':'')).join('; ')+'.');
  if(e.ut.repair>0)
    r.push('Простой в ремонте '+e.ut.repair+' '+plural(e.ut.repair,['день','дня','дней'])+' — упущенная выручка '+money(e.downLoss)+' по суточной ставке '+money(e.dayRate)+'.');
  if(e.ut.k<0.5)
    r.push('Загрузка '+Math.round(e.ut.k*100)+'%: в аренде '+e.ut.rent+' из '+e.ut.avail+' доступных дней, свободными простояли '+e.ut.idle+'.');
  if(to.length&&e.service>e.rev*0.3)
    r.push('Регламентное ТО '+money(e.service)+' при выручке '+money(e.rev)+' — обслуживание не зависит от загрузки.');
  if(!r.length)r.push('Выручка '+money(e.rev)+' не покрыла расходы '+money(e.service+e.repair+e.downLoss)+' за период.');
  return r;
}

      '<td data-l="Оператор">'+esc(s.operator||'—')+'</td><td class="n num" data-l="Часы">'+fmt(s.hours,1)+'</td><td class="n num" data-l="Начислено">'+money(shiftAmount(c,s))+'</td></tr>'}).join('')+
    '</tbody></table></div>':'');

  if(!act.length)return;
  const upd=()=>{
    const c=contract($('[data-f="qc"] select').value), h=parseAmount($('[data-f="qh"] input').value);
    const d=$('[data-f="qd"] input').value;
    if(!c){$('#qcalc').textContent='';return;}
    const bad=d&&(d<c.from||d>c.to);
    $('#qcalc').className='note'+(bad?' dgr':'');
    $('#qcalc').innerHTML=bad?'Дата вне срока договора ('+dmy(c.from)+' — '+dmy(c.to)+')':
      (isFinite(h)?'К начислению: <b class="num">'+money(shiftAmount(c,{hours:h}))+'</b> · '+money(c.rate)+' за '+RATE[c.rateMode]+(c.minShift?' · минимум '+fmt(c.minShift,1)+' ч':'')+(c.otMult>1?' · переработка после '+fmt(c.otAfter,1)+' ч ×'+fmt(c.otMult,2):''):'Введите часы');
  };
  ['qc','qd','qh'].forEach(n=>{const el=$('[data-f="'+n+'"] select,[data-f="'+n+'"] input');el.oninput=upd;el.onchange=upd;});
  const saveQuick=()=>{
    const c=contract($('[data-f="qc"] select').value);
    const d=$('[data-f="qd"] input').value, hraw=$('[data-f="qh"] input').value;
    clearErrs(document);
    if(!c)return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return fieldErr(document,'qd','Укажите дату');
    if(d<c.from||d>c.to)return fieldErr(document,'qd','Дата вне срока договора');
    if(d>today())return fieldErr(document,'qd','Смена в будущем');
    const h=parseAmount(hraw);
    if(!isFinite(h)||h<=0||h>24)return fieldErr(document,'qh','Часы: 0,1—24');
    if(db.shifts.some(x=>x.contractId===c.id&&x.date===d))return fieldErr(document,'qd','За этот день смена уже есть');

  };
  $('#qs').onclick=saveQuick;
  ['qd','qh','qo'].forEach(n=>{const el=$('[data-f="'+n+'"] input');el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveQuick();}};});
  upd();
}

function renderData(){
  head('Данные','локальное хранилище браузера, версия '+db.version,'');
  const raw=JSON.stringify(db);
  const org=db.ui.org||{};
  $('#view').innerHTML=
   '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">'+
   '<div class="card"><h3>Экспорт и импорт</h3><p class="muted" style="font-size:13px;margin-top:0">Вся база — один JSON-файл: техника, клиенты, договоры, смены, обслуживание, платежи. Импорт проверяет структуру и ссылки и отказывается загружать посторонний файл.</p>'+
     '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="exp">'+ico('dl',14)+' Экспорт JSON</button><button class="btn" id="csv">'+ico('dl',14)+' Выгрузка в Excel</button><button class="btn" id="imp">Импорт JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div>'+
     '<div class="hint">Размер базы: '+fmt(raw.length/1024,1)+' КБ · ключ хранения <span class="mono">'+KEY+'</span></div></div>'+
   '<div class="card"><h3>Состав базы</h3><table><tbody>'+
     [['Техника','units'],['Клиенты','clients'],['Договоры','contracts'],['Смены','shifts'],['Обслуживание','maint'],['Платежи','payments']]
      .map(([l,k])=>'<tr><td>'+l+'</td><td class="n num">'+db[k].length+'</td></tr>').join('')+
     '</tbody></table></div>'+
   '<div class="card"><h3>Реквизиты для печатных форм</h3>'+
     F('oname','Арендодатель','<input value="'+esc(org.name||'')+'" placeholder="ООО «Ваша компания»">')+
     '<div class="row">'+F('oinn','ИНН','<input class="num" value="'+esc(org.inn||'')+'">')+F('oacc','Расчётный счёт','<input class="num" value="'+esc(org.acc||'')+'">')+'</div>'+
     F('oaddr','Адрес','<input value="'+esc(org.addr||'')+'">')+
     '<button class="btn pri" id="osave">Сохранить реквизиты</button>'+
     '<div class="hint">Пустые поля печатаются пропусками — программа ничего не придумывает за вас.</div></div>'+
   '<div class="card"><h3>Демонстрационные данные</h3><p class="muted" style="font-size:13px;margin-top:0">Генерируются кодом при каждом запуске заново: 12 единиц техники, 18 клиентов, около 60 договоров за 9 месяцев, смены по будням, ТО по моточасам, три ремонта с простоем. Внутри намеренные проблемы — их система должна поймать сама.</p>'+
     '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn'+(db.demo?'':' pri')+'" id="gen">'+(db.demo?'Пересоздать демо':'Загрузить демо-данные')+'</button>'+
     (db.demo?'<button class="btn dgr" id="wipe">Удалить демо-данные</button>':'')+'</div></div>'+
   '<div class="card"><h3>Проверка суммы прописью</h3><table><tbody>'+
     WORDS_TESTS.map(v=>'<tr><td class="num">'+fmt(v,v%1?2:0)+'</td><td>'+moneyWords(v)+'</td></tr>').join('')+
     '</tbody></table><div class="hint">Функция склоняет рубли и копейки по правилам русского языка; в актах и счетах используется она же.</div></div>'+
   '<div class="card"><h3>Опасная зона</h3><p class="muted" style="font-size:13px;margin-top:0">Полная очистка удаляет все записи из этого браузера без возможности вернуть. Сначала выгрузите JSON.</p>'+
     '<button class="btn dgr" id="clr">Очистить всё</button></div>'+
   '</div>';
  /* CSV, because "а в Excel это можно?" is the second question every director asks and
     until now there was no answer. Semicolon-separated with a UTF-8 BOM: Excel on a
     Russian Windows opens semicolon files into columns and needs the BOM to read
     Cyrillic, and a comma-separated UTF-8 file without one lands as a single grey column
     of mojibake - which looks like the export is broken rather than the locale. */
  $('#csv').onclick=()=>{
    const esc2=v=>{const t=String(v==null?'':v);return /[";\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
    const rows=[['Договор','Статус','Клиент','ИНН','Техника','Инв. №','С','По','Тариф','Ставка',
                 'Смен','Начислено','Оплачено','Долг','Просрочено','Залог внесён']];
    db.contracts.forEach(c=>{
      const u=unit(c.unitId), cl=client(c.clientId), sh=cShifts(c.id);
      rows.push([c.no||c.id, c.status==='closed'?'закрыт':'активен', cl?cl.name:'', cl?cl.inn||'':'',
        u?u.name:'', u?u.inv||'':'', c.from, c.to,
        c.rateMode==='hour'?'час':(c.rateMode==='shift'?'смена':'сутки'), r2(c.rate),
        sh.length, r2(contractAccrued(c)), r2(contractPaid(c)), r2(contractDebt(c)),
        r2(contractOverdue(c)), r2(depositPaid(c))]);
    });
    const csv='\ufeff'+rows.map(r=>r.map(esc2).join(';')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='dogovory-'+today()+'.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Выгружено договоров: '+db.contracts.length);
  };
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='arendapark-'+today()+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Файл выгружен: '+a.download);
  };
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      let o=null,parseErr=null;
      try{o=JSON.parse(fr.result)}catch(err){parseErr=err.message}
      if(parseErr)return importFail(['Файл не читается как JSON: '+parseErr]);
      const errs=validateDump(o);
      if(errs.length)return importFail(errs);
      const st=[o.units.length+' ед. техники',o.clients.length+' клиентов',o.contracts.length+' договоров',o.shifts.length+' смен',o.payments.length+' платежей'].join(', ');
      modal({title:'Импорт проверен',body:'<p>Файл корректен: '+st+'.</p><p class="muted">Текущая база в этом браузере будет полностью заменена. Отменить это нельзя — при сомнениях сначала сделайте экспорт.</p>',
        footer:'<span style="flex:1"></span><button class="btn" data-close>Отмена</button><button class="btn term" id="ok">Заменить базу</button>'});
      $('#ok',$('#modalWrap')).onclick=()=>{db=migrate(o);save();closeModal();route={v:'cal'};render();toast('База загружена: '+st);};
    };
    fr.readAsText(f); e.target.value='';
  };
  function importFail(errs){
    modal({title:'Импорт отклонён',body:'<div class="note dgr">Файл не похож на базу арендного парка или содержит противоречия. Ничего не изменено.</div><ul style="margin:12px 0 0 18px;padding:0;font-size:13px">'+errs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>',
      footer:'<span style="flex:1"></span><button class="btn pri" data-close>Понятно</button>'});
  }
  $('#osave').onclick=()=>{
    const m=document;
    const inn=V(m,'oinn');
    clearErrs(m);
    if(inn&&!innValid(inn))return fieldErr(m,'oinn','ИНН не проходит проверку по контрольным цифрам');
    db.ui.org={name:V(m,'oname'),inn,acc:V(m,'oacc'),addr:V(m,'oaddr')};
    commit('Реквизиты сохранены');
  };
  $('#gen').onclick=()=>{
    if(db.units.length||db.clients.length){
      modal({title:'Заменить текущие данные демонстрационными?',body:'<p class="muted">В базе уже есть записи. Демо-данные заменят их полностью.</p>',
        footer:'<span style="flex:1"></span><button class="btn" data-close>Отмена</button><button class="btn term" id="ok">Заменить на демо</button>'});
      $('#ok',$('#modalWrap')).onclick=()=>{closeModal();loadDemo()};
    } else loadDemo();
  };
  const w=$('#wipe'); if(w)w.onclick=()=>{db=BLANK();save();route={v:'data'};render();toast('Демо-данные удалены');};

/* THE CONTRACT ITSELF. Акт and счёт existed; договор did not - and a rental business
   lives on the contract, so it is the first document a director asks to see. Built from
   the same data the screen already holds: no new fields, no new state, and the terms it
   prints are the terms the system actually bills by. If the rate mode says hour, the
   contract says hour, and the minimum shift and overtime multiplier that appear in the
   text are the same numbers shiftAmount() uses. */
function printDogovor(id){
  const c=contract(id); if(!c)return;
  const u=unit(c.unitId), cl=client(c.clientId), o=db.ui.org||{};
  const unitName=c.rateMode==='hour'?'машино-час':(c.rateMode==='shift'?'смену':'сутки');
  const days=Math.max(1,daysBetween(c.from,c.to)+1);
  const terms=[];
  if(c.rateMode==='hour'&&c.minShift) terms.push('минимальная оплачиваемая смена — '+fmt(c.minShift,1)+' ч');
  if((c.otMult||1)>1) terms.push('переработка сверх '+(c.rateMode==='hour'?fmt(c.otAfter||0,1)+' ч':'нормы')+' оплачивается с коэффициентом '+fmt(c.otMult,2));
  if(c.deposit>0) terms.push('обеспечительный платёж (залог) — '+fmt(c.deposit,2)+' ₽');
  if(cl&&cl.defer) terms.push('оплата в течение '+cl.defer+' календарных дней с даты акта');
  doPrint('<div class="doc"><h1>Договор аренды техники № '+esc(c.no||c.id)+'</h1>'+
   '<div class="meta" style="text-align:right">от '+dlong(c.from)+'</div><hr>'+
   '<div class="meta"><b>Арендодатель:</b> '+esc(orgLine())+'</div>'+
   '<div class="meta"><b>Арендатор:</b> '+esc(clientLine(cl))+'</div>'+
   '<h2>1. Предмет договора</h2>'+
   '<div class="meta">Арендодатель передаёт, а Арендатор принимает во временное владение и пользование '+
     esc(u?u.name:'технику')+(u&&u.inv?', инвентарный № '+esc(u.inv):'')+(u&&u.reg?', гос. номер '+esc(u.reg):'')+
     ', далее — Техника.</div>'+
   '<h2>2. Срок аренды</h2>'+
   '<div class="meta">С '+dlong(c.from)+' по '+dlong(c.to)+' включительно ('+days+' дн.).</div>'+
   '<h2>3. Стоимость и порядок расчётов</h2>'+
   '<div class="meta">Ставка аренды — <b>'+fmt(c.rate,2)+' ₽</b> за '+unitName+'.'+
     (terms.length?' Дополнительные условия: '+terms.join('; ')+'.':'')+
     ' Фактическая наработка подтверждается сменными рапортами и актом.</div>'+
   '<h2>4. Обязанности сторон</h2>'+
   '<div class="meta">Арендодатель передаёт Технику в исправном состоянии. Арендатор использует '+
     'Технику по назначению, обеспечивает допущенного к управлению оператора и возвращает Технику '+
     'в исправном состоянии с учётом нормального износа.</div>'+
   '<h2>5. Реквизиты и подписи</h2>'+
   '<table><thead><tr><th>Арендодатель</th><th>Арендатор</th></tr></thead><tbody><tr>'+
   '<td>'+esc(orgLine())+(o.acc?'<br>Р/с '+esc(o.acc):'')+'<br><br>_______________ / подпись</td>'+
   '<td>'+esc(clientLine(cl))+'<br><br>_______________ / подпись</td>'+
   '</tr></tbody></table>'+
   '<div class="meta" style="margin-top:14px;opacity:.7">Демонстрационный документ, сформирован из данных системы.</div>'+
   '</div>');
}

function printAct(id){
  const c=contract(id); if(!c)return;
  const u=unit(c.unitId), cl=client(c.clientId);
  const sh=cShifts(c.id).sort((a,b)=>a.date<b.date?-1:1);
  const total=contractAccrued(c);
  const hours=contractHours(c.id);
  doPrint('<div class="doc"><h1>Акт о наработке и оказанных услугах аренды № '+esc(c.no||c.id)+'</h1>'+
   '<div class="meta">Дата составления: '+dlong(today())+'</div><hr>'+
   '<div class="meta"><b>Исполнитель (арендодатель):</b> '+esc(orgLine())+'</div>'+
   '<div class="meta"><b>Заказчик (арендатор):</b> '+esc(clientLine(cl))+'</div>'+
   '<div class="meta"><b>Договор аренды:</b> № '+esc(c.no||'—')+', период с '+dlong(c.from)+' по '+dlong(c.to)+'</div>'+
   '<div class="meta"><b>Техника:</b> '+esc(u?u.name+' (инв. № '+u.inv+', '+u.type+')':'—')+'</div>'+
   '<div class="meta"><b>Тариф:</b> '+money(c.rate)+' за '+RATE[c.rateMode]+
     (c.minShift?', минимальная смена '+fmt(c.minShift,1)+' ч':'')+
     (c.otMult>1?', переработка свыше '+fmt(c.otAfter,1)+' ч с коэффициентом '+fmt(c.otMult,2):'')+'</div>'+
   (sh.length?'<table><thead><tr><th>№</th><th>Дата</th><th>Оператор</th><th>Часы</th><th>Расшифровка</th><th>Сумма, ₽</th></tr></thead><tbody>'+
     sh.map((s,i)=>{const b=shiftBreak(c,s);
       return '<tr><td>'+(i+1)+'</td><td>'+dmy(s.date)+'</td><td>'+esc(s.operator||'—')+'</td><td>'+fmt(s.hours,1)+'</td>'+
       '<td>'+fmt(b.base,b.unit==='ч'?1:0)+' '+b.unit+' × '+fmt(c.rate)+(b.ot?' + '+fmt(b.ot,1)+' ч × '+fmt(c.otMult,2):'')+(b.minApplied?' (минимум смены)':'')+'</td>'+
       '<td style="text-align:right">'+fmt(shiftAmount(c,s),2)+'</td></tr>'}).join('')+
     '<tr><td colspan="3"><b>Итого</b></td><td><b>'+fmt(hours,1)+'</b></td><td></td><td style="text-align:right"><b>'+fmt(total,2)+'</b></td></tr></tbody></table>'
    :'<p>За период наработка не зафиксирована, начисление не производится.</p>')+
   '<div class="meta"><b>Всего к оплате: '+fmt(total,2)+' ₽</b></div>'+
   '<div class="meta">Сумма прописью: '+moneyWords(total)+'</div>'+
   /* ALL THREE DEPOSIT FIGURES WERE WRONG. depositPaid() is the BALANCE still held -
      paid minus returned - and it was being printed as the deposit itself; "возвращено"
      was depositPaid(c)-0, which is not a subtraction of anything. On the one closed
      contract in the demo the truth is 37 000 held / 22 000 withheld / 15 000 returned
      and the act printed 22 000 / 22 000 / 22 000. Now each number is derived from its
      own source: the contract's agreed deposit, the recorded withholding, and what is
      actually left over. */
   (c.deposit>0?(function(){
     const agreed=r2(c.deposit||0), withheld=r2(c.depWithheld||0);
     const returned=r2(Math.max(0, agreed-withheld));
     return '<div class="meta">Залог по договору: '+fmt(agreed,2)+' ₽'+
       (c.status==='closed'?'; удержано '+fmt(withheld,2)+' ₽'+
         (withheld>0&&c.note?' (основание: '+esc(c.note)+')':'')+
         '; возвращено '+fmt(returned,2)+' ₽':
        '; на руках '+fmt(depositPaid(c),2)+' ₽')+'</div>';
   })():'')+
   '<p style="margin-top:6mm;font-size:10pt">Услуги оказаны в полном объёме. Претензий по объёму и качеству нет.</p>'+
   '<div class="sig"><div>Исполнитель ______________ / '+esc((db.ui.org||{}).name||'')+'</div><div>Заказчик ______________ / '+esc(cl?cl.name:'')+'</div></div></div>');
}
function printInvoice(id){
  const c=contract(id); if(!c)return;
  const u=unit(c.unitId), cl=client(c.clientId);
  const accr=contractAccrued(c), paid=contractPaid(c), debt=r2(accr-paid);
  const sh=cShifts(c.id);
  /* THE LINE HAS TO MULTIPLY OUT. Before this, Кол-во ignored overtime while Сумма
     included it, so 33 of 59 demo invoices printed a row where qty x rate did not
     equal the total - the one arithmetic a client's accountant checks first, on the
     one piece of paper that leaves the meeting. Overtime is now its OWN line at its
     own rate, so every row multiplies and the total is the sum of the rows. */
  const baseQty=c.rateMode==='hour'
    ? r2(sh.reduce((a,s)=>a+Math.min(Math.max(s.hours,c.minShift||0), c.otAfter||1e9),0))
    : sh.length;
  const otQty=c.rateMode==='hour'
    ? r2(sh.reduce((a,s)=>a+Math.max(0,Math.max(s.hours,c.minShift||0)-(c.otAfter||1e9)),0))
    : r2(sh.reduce((a,s)=>{const norm=c.rateMode==='day'?24:8;return a+Math.max(0,(s.hours||0)-norm)/norm},0));
  const otRate=r2(c.rate*(c.otMult||1));
  const baseSum=r2(baseQty*c.rate), otSum=r2(otQty*otRate);
  const qty=baseQty;
  const unitName=c.rateMode==='hour'?'час':(c.rateMode==='shift'?'смена':'сутки');
  const o=db.ui.org||{};
  doPrint('<div class="doc"><h1>Счёт на оплату № '+esc(c.no||c.id)+' от '+dmy(today())+'</h1><hr>'+
   '<div class="meta"><b>Поставщик:</b> '+esc(orgLine())+(o.acc?'<br>Р/с '+esc(o.acc):'')+'</div>'+
   '<div class="meta"><b>Покупатель:</b> '+esc(clientLine(cl))+'</div>'+
   '<div class="meta"><b>Основание:</b> договор аренды № '+esc(c.no||'—')+' от '+dlong(c.from)+'</div>'+
   '<table><thead><tr><th>№</th><th>Наименование</th><th>Кол-во</th><th>Ед.</th><th>Цена, ₽</th><th>Сумма, ₽</th></tr></thead><tbody>'+
   '<tr><td>1</td><td>Аренда: '+esc(u?u.name+' (инв. № '+u.inv+')':'—')+', период с '+dmy(c.from)+' по '+dmy(c.to)+'</td>'+
   '<td style="text-align:right">'+fmt(baseQty,c.rateMode==='hour'?1:0)+'</td><td>'+unitName+'</td><td style="text-align:right">'+fmt(c.rate,2)+'</td><td style="text-align:right">'+fmt(baseSum,2)+'</td></tr>'+
   (otQty>0.001?'<tr><td>2</td><td>Переработка сверх нормы (коэффициент '+fmt(c.otMult||1,2)+')</td>'+
     '<td style="text-align:right">'+fmt(otQty,c.rateMode==='hour'?1:2)+'</td><td>'+unitName+'</td>'+
     '<td style="text-align:right">'+fmt(otRate,2)+'</td><td style="text-align:right">'+fmt(otSum,2)+'</td></tr>':'')+
   '<tr><td colspan="5"><b>Итого начислено по наработке</b></td><td style="text-align:right"><b>'+fmt(accr,2)+'</b></td></tr>'+
   (paid>0?'<tr><td colspan="5">Оплачено ранее</td><td style="text-align:right">−'+fmt(paid,2)+'</td></tr>'+
    '<tr><td colspan="5"><b>К оплате</b></td><td style="text-align:right"><b>'+fmt(debt,2)+'</b></td></tr>':'')+
   '</tbody></table>'+
   '<div class="meta">Всего к оплате: <b>'+fmt(debt,2)+' ₽</b></div>'+
   '<div class="meta">Сумма прописью: '+moneyWords(debt)+'</div>'+
   '<div class="meta">Срок оплаты: '+dlong(contractDue(c))+(cl&&cl.defer?' (отсрочка '+cl.defer+' '+plural(cl.defer,['день','дня','дней'])+' от окончания договора)':'')+'</div>'+
   (c.deposit>0?'<div class="meta">Залог по договору: '+fmt(c.deposit,2)+' ₽, внесено '+fmt(depositPaid(c),2)+' ₽.</div>':'')+
   '<div class="sig"><div>Руководитель ______________</div><div>Бухгалтер ______________</div></div></div>');
}

/* ТЕМА. Выбор запоминается: посмотреть демо в светлой, закрыть вкладку и вернуться в тёмную -
   это не демо, а сброс настроек. Ключ отдельный от данных, чтобы очистка демо-базы не
   сбрасывала оформление. */
const THKEY='park.theme';
function applyTheme(v){
  document.documentElement.classList.toggle('light', v==='light');
  $$('.thm button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.thm===v)));
  try{ localStorage.setItem(THKEY,v); }catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('.thm button'); if(b) applyTheme(b.dataset.thm);});
(function(){ let v='dark'; try{ v=localStorage.getItem(THKEY)||'dark'; }catch(e){} applyTheme(v); })();
</script>
