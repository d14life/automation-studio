/* Дизайн-система Premium Construction Fintech (Stitch), собственная реализация:

:root{

  --navy:#0a1a2b; --navy-2:#132638; --ink:#0b1c30; --mut:#64748b; --mut-2:#94a3b8;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);

  stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* ── каркас ── */
#app{display:flex;min-height:100vh}

aside{flex:0 0 260px;background:var(--navy);color:#dbe6f2;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;min-width:0;overflow:hidden}
aside.tuck{flex:0 0 68px}
aside.tuck .brand b,aside.tuck .brand span,aside.tuck nav button span,
aside.tuck .foot button span{display:none}
aside.tuck .foot{padding:14px 0}
aside.tuck .brand{padding:22px 0 18px;text-align:center}
aside.tuck nav button{justify-content:center;padding:11px 0}
aside.tuck .foot{padding:16px 0;text-align:center}

.tuckbtn{flex:none}
aside .brand{padding:22px 24px 18px}
aside .brand b{display:block;font-size:20px;font-weight:700;color:#fff;letter-spacing:-.01em}
aside .brand span{font-size:12px;color:#7f93a8}
aside nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
aside nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  background:none;border:0;border-left:3px solid transparent;border-radius:var(--r-md);
  font:inherit;color:#a8bacd;cursor:pointer;text-align:left}
aside nav button:hover{background:#ffffff0d;color:#e2ecf7}
aside nav button.on{background:#eef4ff;color:var(--navy);border-left-color:var(--green);font-weight:600}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .who i{font-style:normal;font-size:12px;color:#7f93a8}
aside.tuck .who span:last-child{display:none}
aside.tuck .who{justify-content:center}
aside .foot button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  font:inherit;color:#8fa2b6;cursor:pointer;padding:0}
aside .foot button:hover{color:#fff}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:64px;flex:none;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
header .title{font-weight:700;font-size:16px}
header .sep{width:1px;height:24px;background:var(--border)}
.stamp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .title{white-space:nowrap}

.wrap{padding:24px;max-width:1600px;width:100%}
h1{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
h1+.sub{color:var(--mut);margin:0 0 24px}
h1.solo{margin-bottom:24px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-sm);

.pill.cur{min-width:52px;justify-content:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.cur.fx{background:var(--blue-bg);color:var(--accent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.card .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border-soft)}
.card .hd b{font-size:18px;font-weight:600}
.card .bd{padding:20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}

.kpi .bar{height:4px;border-radius:99px;background:#eef2f7;margin-top:14px;overflow:hidden}

.pager{display:flex;align-items:center;gap:8px}

.alert.act:hover,.rank.act:hover{background:#f8fafc}
.kpi .more{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:12px;
  font-weight:600;color:var(--accent);opacity:0;transition:.12s}
.kpi.act:hover .more{opacity:1}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);

  cursor:pointer;user-select:none;white-space:nowrap}

@media print{aside,header,.toolbar,.noprint{display:none}}

const SIDEBAR={open:"0 0 260px",tuck:"0 0 68px"};
function applyTuck(tuck){
  const a=document.querySelector("aside");
  a.classList.toggle("tuck",tuck);
  a.style.flex=tuck?SIDEBAR.tuck:SIDEBAR.open;   // размер ставим явно: надёжнее каскада
  const b=document.querySelector("header .tuckbtn");
  if(b)b.title=tuck?"Развернуть меню":"Свернуть меню";
}
function toggleTuck(){
  const tuck=!document.querySelector("aside").classList.contains("tuck");
  applyTuck(tuck);
  localStorage.setItem("tuck",tuck?"1":"");
}
let PAGE_SIZE=50;     // ponytail: рисуем страницу, а не весь список — на 3000 строк DOM тормозит.
                      // Сортировка и итоги считаются по всему набору. Если строк станет >10k,
                      // переносить сортировку и постраничность на сервер.
function chartTip(ev,i){
  if(!chartData)return;
  const {h,SER,money}=chartData, p=h[i], box=$("#chtip");
  box.innerHTML=`<b>${p.date}</b>`+SER.map(([k,c,label,abs])=>
    `<div><i style="background:${c}"></i>${label}<span>${money(abs?Math.abs(p[k]):p[k])} ₸</span></div>`).join("");
  box.style.display="block";
  const r=ev.currentTarget.ownerSVGElement.getBoundingClientRect();
  box.style.left=Math.min(ev.clientX-r.left+14, r.width-250)+"px";
  box.style.top=Math.max(ev.clientY-r.top-10,0)+"px";
  const g=document.getElementById("ch-guide");
  if(g){g.style.display="";g.setAttribute("x1",chartData.X(i));g.setAttribute("x2",chartData.X(i))}
}
function chartTipOff(){const b=$("#chtip");if(b)b.style.display="none";
  const g=document.getElementById("ch-guide");if(g)g.style.display="none"}
const state={q:"",date:"",hide_zero:false,only_debtors:false,org:""};
const TABS=[["customers","Покупатели","customers"],["suppliers","Поставщики","suppliers"],
  ["aging","Сроки долга","aging"],["dashboard","Дашборд","dashboard"],
  ["calendar","Календарь","calendar"],["settings","Настройки","settings"]];

async function api(path,opts){
  const r=await fetch(path,opts);
  if(r.status===401){$("#login").hidden=false;$("#app").hidden=true;throw new Error("auth")}
  if(!r.ok){const e=await r.json().catch(()=>({error:r.status}));throw new Error(e.error)}
  return r.headers.get("Content-Type")?.includes("json")?r.json():r;
}
async function doLogin(ev){ev.preventDefault();
  try{me=await api("/api/login",{method:"POST",body:JSON.stringify(
      {login:$("#l_login").value,password:$("#l_pw").value})});
    $("#login").hidden=true;boot();
  }catch(e){$("#l_err").textContent=location.protocol==="file:"
    // страница открыта двойным кликом по файлу — запросы к серверу из file:// не уходят
    ?"Страница открыта из файла. Откройте http://127.0.0.1:8090 — приложению нужен сервер."
    :e.message}
  return false}
async function logout(){await api("/api/logout",{method:"POST"});location.reload()}
function openPassword(){
  $("#pw_who").textContent=`Пользователь ${me.login}`;
  ["pw_cur","pw_new","pw_new2"].forEach(i=>$("#"+i).value="");
  $("#pw_err").textContent="";$("#modal").hidden=false;$("#pw_cur").focus();
}
function closePassword(){$("#modal").hidden=true}
async function savePassword(ev){
  ev.preventDefault();
  const cur=$("#pw_cur").value,nw=$("#pw_new").value;
  if(nw!==$("#pw_new2").value){$("#pw_err").textContent="Новые пароли не совпадают";return false}
  try{
    await api("/api/password",{method:"POST",body:JSON.stringify({current:cur,new:nw})});
    closePassword();toast("Пароль изменён. Остальные ваши сессии закрыты.");
  }catch(e){$("#pw_err").textContent=e.message}
  return false;
}

function boot(){
  $("#app").hidden=false;
  applyTuck(!!localStorage.getItem("tuck"));
  $("#role").textContent=me.role==="admin"?"Администратор":"Бухгалтер";
  $("#whoLogin").textContent=me.login;
  $("#ava").textContent=$("#ava2").textContent=me.login.slice(0,2).toUpperCase();
  drawNav();render();loadNotes();
}
function drawNav(){
  $("#nav").innerHTML=TABS.filter(([k])=>k!=="settings"||me.role==="admin")
    .map(([k,t,ic])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"
      data-tip="${t}">${svg(ic)}<span>${t}</span></button>`).join("");
}
function snapshotView(){return {view,page,sortKey,sortDir,agingSet,state:{...state}}}
function go(v,keepHistory){
  if(!keepHistory&&v!==view)nav.push(snapshotView());
  view=v;drawNav();$("#notes").hidden=true;render();
}
function goBack(){
  const p=nav.pop();if(!p)return;
  view=p.view;page=p.page;sortKey=p.sortKey;sortDir=p.sortDir;agingSet=p.agingSet;
  Object.assign(state,p.state);
  drawNav();$("#notes").hidden=true;render();
}
function openReport(opts={}){        // клик по строке/карточке -> отчёт с нужным фильтром
  const set=opts.set||"customers";
  nav.push(snapshotView());          // чтобы можно было вернуться туда, откуда пришли
  Object.assign(state,{q:"",only_debtors:false,hide_zero:false},opts);
  if(opts.sort){sortKey=opts.sort;sortDir=opts.dir||-1}
  page=1;
  go(set,true);
}

const noteKey=x=>`${x.kind}|${x.text}`;
function seenNotes(){try{return new Set(JSON.parse(localStorage.getItem("seenNotes")||"[]"))}
  catch(e){return new Set()}}
function markNotesSeen(){
  localStorage.setItem("seenNotes",JSON.stringify(notes.map(noteKey)));
  paintBadge();
}
function paintBadge(){
  const seen=seenNotes(), fresh=notes.filter(x=>!seen.has(noteKey(x))).length;
  $("#ncount").hidden=!fresh;$("#ncount").textContent=fresh;
}
async function loadNotes(){
  notes=await api("/api/notifications");
  paintBadge();
}
function toggleNotes(){
  const n=$("#notes");n.hidden=!n.hidden;
  if(!n.hidden)markNotesSeen();      // открыли — счётчик гаснет, новые появятся снова
  n.innerHTML=notes.length?notes.map(x=>
    `<div class="n act" onclick='openReport({set:"${x.set||"customers"}",`+
    `q:${esc(JSON.stringify(x.name||""))}});toggleNotes()' data-tip="Открыть контрагента">`+
    `${svg(x.kind==="overdue"?"warn":"flip","i sm")}<span>${esc(x.text)}`+
    `${x.opposite?`<br><span class="mut">по итогу позиция обратная — учтён аванс</span>`:""}`+
    `</span></div>`).join("")
    :'<div class="empty">Нет уведомлений</div>';
}
async function refresh(){await api("/api/refresh",{method:"POST"});render();loadNotes()}

function params(){return new URLSearchParams({set:view,q:state.q,date:state.date,org:state.org,

function render(){
  $("#htitle").textContent=(TABS.find(t=>t[0]===view)||[,"Взаиморасчёты"])[1];

  if(view==="customers"||view==="suppliers")return renderReport();

function sortBy(k){sortDir=sortKey===k?-sortDir:-1;sortKey=k;page=1;renderReport()}
function goPage(n){page=n;renderReport();document.querySelector("main").scrollTo({top:0})}
function toggleDetail(i){const d=$("#d"+i);d.hidden=!d.hidden;$("#c"+i).classList.toggle("open",!d.hidden)}
function toggleDocs(i,j){  // второй уровень: документы расчётов по договору
  const d=$(`#dl${i}_${j}`);if(!d)return;
  d.hidden=!d.hidden;$(`#dc${i}_${j}`).classList.toggle("open",!d.hidden);
  event.stopPropagation();
}

              ${[15,30,60,120,240].map(v=>`<option value="${v}"
                ${st.sync_interval_min===v?"selected":""}>Каждые ${v} минут</option>`).join("")}
            </select>
            <button class="btn" onclick="refresh()">${svg("refresh","i sm")}Синхронизировать сейчас</button>
            <span class="grow"></span><span class="pill owes_us"><span class="dot"></span>Подключено</span>
          </div></div></div>
    </div>
    <div class="card"><div class="hd">${svg("users")}<b>Пользователи</b>${hint("Бухгалтер видит отчёты и может обновлять данные. Администратор дополнительно правит правила счетов, расписание и список пользователей.")}</div>
      ${users.map(u=>`<div class="userrow">
        <span class="avatar">${esc(u.login.slice(0,2).toUpperCase())}</span>
        <span class="body" style="flex:1"><div style="font-weight:600">${esc(u.login)}</div>
          <div class="mut" style="font-size:13px">${u.role==="admin"?"Администратор":"Бухгалтер"}</div></span>
        ${u.login!=="admin"?`<button class="btn icon" onclick="delUser(${u.id})"
          data-tip="Удалить">${svg("trash","i sm")}</button>`:""}</div>`).join("")}
      <div class="bd">
        <div class="caps" style="margin-bottom:10px">Добавить пользователя</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <input id="nu_l" placeholder="Логин">
          <input id="nu_p" type="password" placeholder="Пароль">
          <div style="display:flex;gap:10px">
            <select id="nu_r" style="flex:1">
              <option value="user">Бухгалтер</option><option value="admin">Администратор</option></select>
            <button class="btn dark" onclick="addUser()">${svg("plus","i sm")}</button>
          </div>
          <div class="err" id="nu_err"></div>
        </div></div></div>
  </div>
  <div class="card" style="margin-top:20px">
    <div class="hd">${svg("doc")}<b>Журнал обращений</b>${hint("Протокол работы: входы и неудачные попытки, каждое обращение к 1С с параметрами и временем ответа, выгрузки и изменения настроек. По техпредложению это одна из четырёх гарантий того, что приложение только читает: журнал показывает, что запросы были исключительно на выборку данных.")}
      <span class="grow"></span>
      <span class="mut" style="font-size:13px">последние ${log.length} событий</span></div>
    <div class="tblwrap"><table style="min-width:760px">
      <thead><tr><th style="width:170px">Время</th><th style="width:130px">Пользователь</th>
        <th style="width:210px">Событие</th><th>Подробности</th></tr></thead>
      <tbody>${log.map(r=>`<tr>
        <td class="num mut">${esc(r.at.replace("T"," "))}</td>
        <td>${r.login?esc(r.login):'<span class="mut">система</span>'}</td>
        <td><span class="pill ${LOGKIND[r.kind]?.[1]||""}">${esc(LOGKIND[r.kind]?.[0]||r.kind)}</span></td>
        <td class="mut" style="font-size:13px">${esc(r.detail||"—")}</td>
      </tr>`).join("")||'<tr><td colspan="4" class="empty">Журнал пуст</td></tr>'}</tbody>
    </table></div></div>`;
}
function toast(text,linkText,onClick){
  const d=document.createElement("div");d.className="t";
  d.innerHTML=`<span style="flex:1">${text}</span>`;
  if(linkText){const a=document.createElement("a");a.textContent=linkText;
    a.onclick=()=>{d.remove();onClick()};d.appendChild(a)}
  $("#toast").appendChild(d);setTimeout(()=>d.remove(),7000);
}
async function toggleRule(id,en){
  const rls=await api("/api/rules");
  const r=rls.find(x=>x.id===id)||{};
  await api("/api/rules",{method:"POST",body:JSON.stringify({id,enabled:en})});
  await api("/api/refresh",{method:"POST"});loadNotes();
  const set=r.rule_set==="customers"?"Покупатели":"Поставщики";
  // изменение видно на другой вкладке — говорим об этом прямо и даём перейти
  toast(`Счёт ${r.account} ${en?"включён в расчёт":"исключён из расчёта"}. `+
        `Отчёт «${set}» пересчитан.`, `Открыть ${set}`, ()=>go(r.rule_set));
}
async function saveInterval(v){
  await api("/api/settings",{method:"POST",body:JSON.stringify({sync_interval_min:+v})})}
async function addUser(){
  try{await api("/api/users",{method:"POST",body:JSON.stringify(
    {login:$("#nu_l").value,password:$("#nu_p").value,role:$("#nu_r").value})});
    renderSettings()}catch(e){$("#nu_err").textContent=e.message}
}
async function delUser(id){
  await api("/api/users",{method:"POST",body:JSON.stringify({delete:id})});renderSettings()}

document.addEventListener("click",e=>{
  const n=$("#notes");
  if(!n.hidden&&!n.contains(e.target)&&!e.target.closest(".bell"))n.hidden=true;
});
(async()=>{try{me=await api("/api/me");boot()}catch(e){}})();
</script><div style="position:fixed;left:12px;bottom:12px;z-index:999;background:#101828cc;color:#e2e8f0;font:600 12px/1.4 system-ui;padding:8px 14px;border-radius:99px;backdrop-filter:blur(4px)">Демо · данные обезличены · построено за 1 день</div></body></html>
