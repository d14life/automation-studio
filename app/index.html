<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solutions101 · рабочие инструменты для бизнеса за дни</title>
    <meta name="description" content="Собираем автоматизацию под вашу задачу за дни. Проверяете на своей реальной работе. Не помогло - не платите, предоплаты нет." />
    <!-- Nunito used to come from Google on every visit: a DNS lookup and a TLS handshake to
         fonts.googleapis.com, then a second pair to fonts.gstatic.com, then the stylesheet, and
         only then the font itself - four round trips before the first word could be drawn, and
         all of it blocking. The old argument for it was a browser cache shared across sites;
         Chrome partitioned that cache in 2020, so the argument is gone and only the cost is left.

         The two files below are the exact same faces, subset to what this page uses: Cyrillic
         and Latin, 60KB for both, one variable file per subset covering 700 and 900. They come
         from our own origin on a connection the browser has already opened, and the Cyrillic one
         is preloaded because the first screen is Russian. -->
    <link rel="preload" href="/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* font-display:swap keeps the text readable while the file arrives; the hero handles its
         own swap separately below, because there it would be a jarring flash. */
      @font-face{font-family:Nunito;font-style:normal;font-weight:700 900;font-display:swap;
        src:url(/fonts/nunito-cyrillic.woff2) format('woff2');
        unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      @font-face{font-family:Nunito;font-style:normal;font-weight:700 900;font-display:swap;
        src:url(/fonts/nunito-latin.woff2) format('woff2');
        unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,
          U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    </style>

    <!-- On body copy nobody notices the swap; on a 400px "101" it is a jarring flash of a
         completely different number. The hero holds still until the face is ready, with a 1.5s
         timeout so a slow or blocked font can never leave the first screen blank. -->
    <style>
      .hero101, .morph { visibility: hidden }
      html.fonts-in .hero101, html.fonts-in .morph { visibility: visible }
    </style>
    <script>
      (function () {
        var d = document.documentElement
        var shown = false
        function go() { if (shown) return; shown = true; d.classList.add('fonts-in') }
        setTimeout(go, 1500)
        if (document.fonts && document.fonts.load) {
          document.fonts.load('900 40px Nunito').then(go, go)
        } else { go() }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
