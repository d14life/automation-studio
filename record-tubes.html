<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Запись лент — Solutions101</title>
<style>
  /* the same subset files the site ships, so the measured slogan has the site's metrics */
  @font-face{font-family:Nunito;font-weight:700 900;font-display:block;
    src:url(./fonts/nunito-cyrillic.woff2) format('woff2')}
  html,body{margin:0;height:100%;background:#000;color:#DFF6FF;
    font:600 15px/1.5 Nunito,system-ui,sans-serif;overflow:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%}
  /* the slogan is rendered for MEASUREMENT only - the ribbon sweep on the real site is derived
     from the width of these very words, so the only way to record the same figure is to have
     the same words on screen. Invisible, but laid out exactly as the site lays them out. */
  #measure{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;visibility:hidden;pointer-events:none}
  .morph{position:relative;height:3.5rem;width:100%;max-width:1400px;margin:0 auto;
    font:900 31.5pt/1 Nunito,system-ui,sans-serif}
  @media (min-width:1024px){.morph{font-size:4.8rem;height:5.6rem}}
  .morph span{position:absolute;inset:0;display:block;text-align:center;white-space:nowrap}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;background:rgba(0,0,0,.75);z-index:9}
  #log{font:500 13px/1.6 ui-monospace,Menlo,monospace;color:#9fb3c8;white-space:pre}
  /* The capture dies the moment the tab goes to the background - the canvas simply stops
     producing frames - so the page has to say, loudly, how long it still needs. */
  #big{position:fixed;inset:0;display:grid;place-content:center;text-align:center;z-index:10;
    font:900 clamp(28px,7vw,84px)/1.15 Nunito,system-ui,sans-serif;color:#DFF6FF;
    text-shadow:0 0 40px rgba(0,0,0,.9);pointer-events:none}
  #big small{display:block;margin-top:14px;font:700 clamp(13px,1.6vw,20px)/1.4 Nunito,sans-serif;
    color:#7FD8FF}
  #big.done{color:#7FD8FF}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="measure">
  <div class="morph" id="liq1"><span>АВТОМАТИЗИРУЕМ</span></div>
  <div class="morph" id="liq2"><span>БИЗНЕС-ПРОЦЕССЫ</span></div>
</div>
<div id="big">…<small>не уходи с этой вкладки</small></div>
<div id="ui"><span id="log">запуск…</span></div>

<script src="./anim3.js"></script>
<script>
/* Records the real ribbon scene to a video loop, so the page can play a clip where it cannot
   afford to render one live. A tool, not part of the site.

   Three things had to be right, and the first version got all three wrong:

   1. THE RIBBONS MUST NOT FOLLOW THE CURSOR. On the site a capture-phase listener swallows
      pointermove before the library can see it, so the ribbons trace their own idle figure.
      Without that guard here they chased the mouse and the recording would have been of
      something the site never does. The same guard is installed below.

   2. THE FIGURE MUST BE THE SAME FIGURE. The sweep on the site is measured off the slogan's
      ink - 38% of its width across, 112.5% of the two lines' height down - not off the window.
      So the slogan is rendered here too, invisibly, and measured with the same formula, at the
      recording browser's own size. Same words, same font, same numbers.

   3. THE COLOUR MUST STILL FOLLOW THE TEXT. That is the one thing a baked clip cannot do, so
      it is not baked: the scene records in near-white and the page tints it live, on the same
      palette clock the slogan uses. That also lets the clip be exactly ONE period of the path
      (2*PI seconds at the library's own time scales), which closes the loop with no seam and
      keeps the motion at exactly the site's speed. */

const ICE = ['#DFF6FF', '#7FD8FF', '#5C82C9']
const GLOW = { l: 0.43, i: 135 }
/* x = cos(t * 1), y = sin(t * 2): the whole figure repeats every 2*PI seconds. Recording
   exactly that long is what makes the loop seamless without touching the speed. */
const PERIOD = 2 * Math.PI
const SETTLE_MS = 2600        /* the tubes lerp into the figure; let them arrive first */
const log = (t) => (document.getElementById('log').textContent = t)

/* Near-white so the clip is a luminance map the page can tint. Not pure white: the tubes keep
   a trace of their own three-stop spread, which is what gives the bundle depth. */
const PALE = ['#FFFFFF', '#EAF6FF', '#D6E8F7']

/* 1. the guard: the library listens for pointermove on the document, exactly as on the site */
addEventListener('pointermove', (e) => e.stopPropagation(), true)

const cv = document.getElementById('cv')

/* 2. the same measurement the site makes */
function sweep() {
  const a = document.getElementById('liq1').getBoundingClientRect()
  const b = document.getElementById('liq2').getBoundingClientRect()
  const s1 = document.querySelector('#liq1 span').getBoundingClientRect()
  const s2 = document.querySelector('#liq2 span').getBoundingClientRect()
  const textW = Math.max(s1.width, s2.width)
  const blockH = Math.max(a.bottom, b.bottom) - Math.min(a.top, b.top)
  return { x: Math.round(textW * 0.38), y: Math.round(blockH * 1.125) }
}

const big = document.getElementById('big')
const say = (t, sub) => { big.innerHTML = t + '<small>' + (sub || 'не уходи с этой вкладки') + '</small>' }

document.fonts.ready.then(() => {
  const s = sweep()
  const W = Math.round(innerWidth), H = Math.round(innerHeight)
  cv.width = W; cv.height = H
  log('экран ' + W + '×' + H + ', размах лент ' + s.x + '×' + s.y + ' — как на сайте')

  window.TubesCursorInit(cv, {
    bloom: false,
    sleepRadiusX: s.x,
    sleepRadiusY: s.y,
    tubes: {
      colors: PALE,
      count: 11,
      minTubularSegments: 42,
      maxTubularSegments: 166,
      radialSegments: 8,
      capSegments: 4,
      lights: { intensity: GLOW.i, colors: ['#FFFFFF', '#F2FAFF', '#E4F2FF', '#D8ECFF'] },
    },
  }, (app) => {
    try { app.three.minPixelRatio = 1; app.three.maxPixelRatio = 1; app.three.resize() } catch (e) {}
    run(cv, W, H)
  })
})

/* One attempt, counted down out loud. If the tab is backgrounded at any point the canvas stops
   feeding the recorder - the first take came back 0.4s long for exactly that reason - so the
   run aborts and starts again the moment the tab is looked at. */
function run(canvas, W, H) {
  const NEED = Math.ceil(SETTLE_MS / 1000 + PERIOD) + 1
  let left = NEED, timer = 0, rec = null, alive = true

  const abort = () => {
    if (!alive) return
    clearInterval(timer)
    if (rec && rec.state === 'recording') { rec.onstop = null; rec.stop() }
    rec = null
    say('пауза', 'вернись на эту вкладку — начну заново')
  }
  const start = () => {
    if (document.hidden) { say('пауза', 'вернись на эту вкладку — начну заново'); return }
    left = NEED
    clearInterval(timer)
    say(left, 'разгоняю сцену, не уходи с вкладки')
    timer = setInterval(() => {
      if (document.hidden) return abort()
      left--
      if (left > 0) say(left, rec ? 'пишу — не уходи с вкладки' : 'разгоняю сцену')
    }, 1000)
    setTimeout(() => {
      if (document.hidden) return abort()
      rec = record(canvas, W, H, () => { alive = false; clearInterval(timer) })
    }, SETTLE_MS)
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) abort()
    else if (alive && !rec) start()
  })
  start()
}

function record(canvas, W, H, done) {
  const stream = canvas.captureStream(30)
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find((t) => MediaRecorder.isTypeSupported(t))
  if (!mime) { log('этот браузер не умеет записывать webm'); return null }

  const chunks = []
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 })
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data) }
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = 'tubes-loop.webm'
    a.click()
    done()
    big.className = 'done'
    say('готово', (blob.size / 1048576).toFixed(2) + ' МБ · файл в Загрузках')
    log('готово: ' + (blob.size / 1048576).toFixed(2) + ' МБ, ' + W + '×' + H +
        ', ' + PERIOD.toFixed(3) + ' сек — файл ушёл в Загрузки')
  }
  rec.start()
  log('пишу ровно один оборот фигуры: ' + PERIOD.toFixed(3) + ' сек…')
  setTimeout(() => { if (rec.state === 'recording') rec.stop() }, PERIOD * 1000)
  return rec
}
</script>
</body>
</html>
