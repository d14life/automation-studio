<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint INTO the safe areas - behind the notch and the
         home indicator - instead of stopping politely at their edges. Without it the strand can
         never reach the top or bottom of a phone however far it is stretched, because those
         strips are not part of the web view at all.
         theme-color then paints Safari's own status bar and toolbar black, so the browser
         chrome stops reading as two grey bands across a black page and disappears into it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- THIS IS THE HOMEPAGE NOW, which is why both of the lines that used to sit here are
         gone. The title said «v2 — черновик» and the page said robots:noindex - correct while
         it was a draft parked at /v2.html, and both wrong the moment it became the first thing
         a buyer and a search engine see. A noindex homepage is invisible to Google. -->
    <title>Solutions101 — автоматизация бизнес-процессов: CRM, боты, телефония</title>
    <meta name="description" content="Собираем рабочие инструменты под вашу компанию: CRM под ваши этапы, телефония с записью, боты по вашему прайсу, сборщики прайсов. Прототип показываем до оплаты." />
    <!-- Same self-hosted faces the live site uses, so type metrics match and nothing is
         fetched from Google. -->
    <!-- Golos Text is the grotesk serious Russian fintech and SaaS use, and that is the whole
         reason it is here: the buyer this page is written for owns a logistics or gas company
         and is being asked to trust us with his processes. Nunito is a rounded, friendly face -
         it reads as approachable, which is the opposite of what that reader needs to feel.
         JetBrains Mono carries the figures ONLY. Monospaced numerals read as measured rather
         than marketed, which is the difference between a claim and a receipt - and the brief
         says бизнес любит цифры six different ways. Both are self-hosted and Cyrillic-subset:
         22KB and 9KB, nothing fetched from Google at runtime. -->
    <style>
      @font-face{font-family:Golos;font-style:normal;font-weight:400 900;font-display:swap;
        src:url(/fonts/golos-cyrillic.woff2) format('woff2');
        unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      @font-face{font-family:Golos;font-style:normal;font-weight:400 900;font-display:swap;
        src:url(/fonts/golos-latin.woff2) format('woff2');
        unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,
          U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:JBMono;font-style:normal;font-weight:500 700;font-display:swap;
        src:url(/fonts/jbmono-cyrillic.woff2) format('woff2');
        unicode-range:U+0000-00FF,U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    </style>
    <link rel="preload" href="/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The strand's first frame, 41KB. It is preloaded HERE rather than left to the <video
         poster> attribute alone because that attribute does not exist until React has parsed,
         mounted and rendered - by which point the blank screen has already been seen. From the
         head it is requested while the bundle is still downloading, so it is usually decoded
         before there is anything to put it in. -->
    <link rel="preload" href="/dna-poster.jpg" as="image" fetchpriority="high" />
    <script type="module" crossorigin src="/assets/v2--hQkcoHU.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/jsx-runtime-B5yqYJvp.js">
    <link rel="modulepreload" crossorigin href="/assets/client-qkPAuMPs.js">
    <link rel="modulepreload" crossorigin href="/assets/useCardTilt-DxpzkXX6.js">
    <link rel="stylesheet" crossorigin href="/assets/v2-DubaQzDQ.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- THE STALE PAGE GUARD. 6 August: he reported the strand "laggy again, like someone took
         the low frames version". Nothing had changed - the scrub code in the live bundle was
         character-for-character the build he signed off. What he was running was an OLD bundle,
         reached through a cached copy of THIS file.

         That is not a bug we can fix at the source. GitHub Pages serves fixed headers -
         `cache-control: max-age=600` on every HTML response - and a page kept in a tab or held
         by a proxy goes on loading whatever `assets/v2-*.js` it was born with. Every old build
         is still sitting in assets/, so the stale page finds its stale bundle and loads it
         happily. I hit it myself: one fetch of the live root came back pointing at the 03:21
         build, ten seconds later the same URL served the current one.

         So the page checks itself. One 4KB no-store fetch of its own URL after load, compare
         the bundle the server is handing out now against the one actually running, reload if
         they differ. A reload revalidates the document, so the second load gets the new HTML.

         THE GUARD ON THE GUARD IS THE IMPORTANT PART. A reload loop on the homepage is a far
         worse bug than the one being fixed, so the build we reloaded away from is written to
         sessionStorage first: if the refresh somehow lands on the same stale bundle again, the
         check has already spent its one shot and stops. At most one extra load, ever. -->
    <script>
      addEventListener('load', function () {
        try {
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return
          var tag = document.querySelector('script[src*="/assets/v2-"]')
          if (!tag) return
          var mine = tag.src.split('/').pop()
          if (sessionStorage.getItem('s101-stale') === mine) return
          fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : '' })
            .then(function (html) {
              var m = html.match(/assets\/v2-[A-Za-z0-9_-]+\.js/)
              if (!m) return
              var live = m[0].split('/').pop()
              if (live === mine) return
              sessionStorage.setItem('s101-stale', mine)
              location.reload()
            })
            .catch(function () {})
        } catch (e) {}
      })
    </script>
  </body>
</html>
