    const scaffold = {id:'__new__', channels:f.channels, rubric:f.rubric, tone:f.tone, postType:f.postType};
    const out = generatePost(state, scaffold);
    document.getElementById('pe-title').value = out.title;
    document.getElementById('pe-text').value = out.text;
  },
  smartedit(){
    const text = document.getElementById('pe-text').value;
    const instr = document.getElementById('pe-instruction').value;
    const result = smartEdit(text, instr);
    if(result===null){ toast('Инструкция не распознана. Доступно: короче / добавь техники / мягче', 'err'); return; }
    document.getElementById('pe-text').value = result;
    toast('Применено','ok');
  },
  savepost(el){
    const f = readEditForm();
    if(!f.title){ toast('Укажите заголовок','err'); return; }
    if(!f.text.trim()){ toast('Текст не может быть пустым','err'); return; }
    const id = el.dataset.id;
    if(id){
      const p = findPost(id);
      Object.assign(p, f);
      if(p.status==='rework' || p.status==='rejected'){ p.status='draft'; pushHistory(p,'draft',actorName(),'правки внесены после доработки'); }
      saveState(); toast('Изменения сохранены','ok');
    } else {
      const p = { id: uid(state,'p'), ...f, status:'draft', needsAttention:false, attempts:0, errorReason:null, publishedAt:null, createdAt:Date.now(), history:[], comments:[], adaptations:{} };
      pushHistory(p,'draft',actorName());
      state.posts.push(p);
      saveState(); toast('Пост создан','ok');
    }
    closeModal();
  },

  // schedule modal
  doschedule(el){
    const p = findPost(el.dataset.id);
    const dateV = document.getElementById('sch-date').value, timeV = document.getElementById('sch-time').value || '09:00';
    if(!dateV){ toast('Укажите дату','err'); return; }
    const ts = new Date(`${dateV}T${timeV}:00`).getTime();
    doSchedule(state, p, actorName(), ts);
    saveState(); closeModal(); toast('Запланировано на '+fmtDT(ts),'ok'); render();
  },
  // rework / reject
  doreword(el){
    const p = findPost(el.dataset.id);
    const c = document.getElementById('rw-comment').value.trim();
    if(!c){ toast('Комментарий обязателен при отправке на доработку','err'); return; }
    doRework(state, p, actorName(), c); saveState(); closeModal(); toast('Отправлено на доработку','ok'); render();
  },
  doreject(el){
    const p = findPost(el.dataset.id);
    const c = document.getElementById('rj-comment').value.trim();
    doReject(state, p, actorName(), c); saveState(); closeModal(); toast('Пост отклонён','ok'); render();
  },
  // bulk schedule
  dobulkschedule(){
    const dateV = document.getElementById('bsch-date').value, timeV = document.getElementById('bsch-time').value || '10:00';
    if(!dateV){ toast('Укажите дату','err'); return; }
    const ts = new Date(`${dateV}T${timeV}:00`).getTime();
    let n=0;
    [...UI.selection].forEach(id=>{ const p=findPost(id); if(p && p.status==='approved'){ doSchedule(state,p,actorName(),ts); n++; } });
    saveState(); closeModal(); toast(`Запланировано: ${n}`,'ok'); UI.selection=new Set(); render();
  },
  // channels
  openconnect(el){ openModal('connectchannel', {id: el.dataset.id}); },
  doconnect(el){
    const c = state.channels.find(c=>c.id===el.dataset.id);
    const v = document.getElementById('conn-val').value.trim();
    if(!v){ document.getElementById('conn-warn').textContent = 'Введите токен или имя аккаунта.'; return; }
    c.connected = true; c.account = v; c.connectedAt = Date.now();
    saveState(); closeModal(); toast(`${c.name} подключён`,'ok'); render();
  },
  disconnect(el){ const c=state.channels.find(c=>c.id===el.dataset.id); c.connected=false; c.account=''; saveState(); toast(`${c.name} отключён`); render(); },
  togglebot(el){ const b=state.bots.find(b=>b.id===el.dataset.id); b.status = b.status==='online'?'offline':'online'; saveState(); render(); },
  toggleautopost(el){ const c=state.channels.find(c=>c.id===el.dataset.id); c.autopost=!c.autopost; saveState(); render(); },
  runscheduler(){ const n=schedulerTick(); toast(n?`Прогон завершён, попыток: ${n}`:'Прогон завершён, задач не найдено','ok'); render(); },

  // users
  adduser(){ openModal('adduser', {}); },
  doadduser(){
    const name = document.getElementById('nu-name').value.trim();
    const role = document.getElementById('nu-role').value;
    if(!name){ toast('Укажите имя','err'); return; }
    state.users.push({id: uid(state,'u'), name, role});
    saveState(); closeModal(); toast('Пользователь добавлен','ok'); render();
  },
  changerole(el){ const u=state.users.find(u=>u.id===el.dataset.id); u.role = el.value; if(u.id===state.currentUserId) state.currentRole = u.role; saveState(); render(); },

  // KB / tones / rubrics
  savekb(el){
    const r = state.rubrics.find(r=>r.id===el.dataset.id);
    r.facts = document.getElementById('kb-facts-'+r.id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    r.hashtags = document.getElementById('kb-tags-'+r.id).value.split(/\s+/).map(s=>s.trim()).filter(Boolean);
    r.phrases = document.getElementById('kb-phrases-'+r.id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    saveState(); toast('База знаний обновлена — изменения повлияют на новую генерацию','ok'); render();
  },
  savetone(el){
    const t = state.tones.find(t=>t.id===el.dataset.id);
    t.openers = document.getElementById('tn-open-'+t.id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    t.dev = document.getElementById('tn-dev-'+t.id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    saveState(); toast('Тональность обновлена','ok'); render();
  },
  saverubric(el){
    const r = state.rubrics.find(r=>r.id===el.dataset.id);
    const v = document.getElementById('rb-name-'+r.id).value.trim();
    if(!v){ toast('Название не может быть пустым','err'); return; }
    r.name = v; saveState(); toast('Сохранено','ok'); render();
  },
  saveobjection(el){
    const o = state.objections.find(o=>o.id===el.dataset.id);
    o.triggers = document.getElementById('obj-trig-'+o.id).value.split(',').map(s=>s.trim()).filter(Boolean);
    o.official = document.getElementById('obj-off-'+o.id).value;
    o.crisis = document.getElementById('obj-cr-'+o.id).value;
    saveState(); toast('Библиотека возражений обновлена','ok'); render();
  },
  addkeyword(){
    const w = document.getElementById('kw-word').value.trim();
    const cat = document.getElementById('kw-cat').value || null;
    if(!w){ toast('Введите слово','err'); return; }
    state.keywords.push({word:w, cat});
    saveState(); toast('Слово добавлено — переклассифицируйте ленту, чтобы применить','ok'); render();
  },
  delkeyword(el){ state.keywords.splice(parseInt(el.dataset.idx,10),1); saveState(); render(); },
  reclassify(){
    let n=0;
    state.mentions.forEach(m=>{ if(m.status==='new'){ const {categories,keywords} = classifyMention(state, m.text); m.categories=categories; m.keywords=keywords; n++; } });
    saveState(); toast(`Переклассифицировано: ${n}`,'ok'); render();
  },

  // multichannel
  mcsource(el){ UI.mcSourceId = el.value; render(); },
  mcaddchannel(el){
    if(!el.value) return;
    const p = findPost(UI.mcSourceId);
    if(p && !p.channels.includes(el.value)){ p.channels.push(el.value); saveState(); }
    render();
  },

  // ORM mention detail
  mtab(el){ UI.mentionTab = el.dataset.tab; render(); },
  mstatus(el){
    const m = findMention(el.dataset.id); m.status = el.value;
    if(m.status==='done' && !m.resolvedAt) m.resolvedAt = Date.now();
    saveState(); render();
  },
  ormgen(el){
    const m = findMention(el.dataset.id); const tab = el.dataset.tab;
    m.genTries = (m.genTries||0)+1;
    let text, tries=0;
    do { text = buildOrmText(state, m, tab, m.genTries+tries); tries++; }
    while(state.mentions.some(o=>o.id!==m.id && (o.officialText===text || o.crisisText===text)) && tries<10);
    if(tab==='official') m.officialText = text; else m.crisisText = text;
    saveState(); toast('Сгенерировано','ok'); render();
  },
  ormsend(el){
    const m = findMention(el.dataset.id);
    const tab = UI.mentionTab || 'official';
    const text = document.getElementById('orm-text');
    if(text){ if(tab==='official') m.officialText=text.value; else m.crisisText=text.value; }
    const ch = state.channels.find(c=>c.id===m.source);
    m.status = m.status==='escalated' ? 'escalated' : 'done';
    if(!m.resolvedAt) m.resolvedAt = Date.now();
    saveState();
    if(ch && !ch.connected) toast(`Канал ${ch.name} не подключён — ответ поставлен в буфер, статус обновлён`, 'err');
    else toast('Отправлено в комментарии','ok');
    render();
  },
  ormtoqueue(el){
    const m = findMention(el.dataset.id);
    const tab = UI.mentionTab || 'official';
    const rubricId = CAT_TO_RUBRIC[m.categories[0]] || state.rubrics[0].id;
    const text = (tab==='crisis' ? m.crisisText : m.officialText) || buildOrmText(state, m, 'crisis', m.genTries||0);
    const p = {
      id: uid(state,'p'), title: `Разбор вопроса из ORM: ${m.text.replace(/[«»]/g,'').slice(0,42)}…`,
      text, tone: 'caring', rubric: rubricId, postType:'qa', channels:['vk'],
      status:'draft', needsAttention:false, attempts:0, errorReason:null, publishedAt:null,
      createdAt: Date.now(), scheduledAt:null, history:[], comments:[], adaptations:{},
    };
    pushHistory(p, 'draft', actorName(), `создан из упоминания ${m.id}`);
    state.posts.push(p);
    m.linkedPostId = p.id;
    saveState(); toast('Пост создан из упоминания','ok');
    openModal('postcard', {id:p.id});
  },

  // producer
  scenwizard(){ UI.scenarioWizard = {step:1, topic:'', duration:30, audience:AUDIENCES[0], emotion:EMOTIONS[0], rubricId:state.rubrics[0].id}; openModal('scenariowizard', {}); },
  wzduration(el){ UI.scenarioWizard.duration = parseInt(el.dataset.v,10); render(); },
  wzaudience(el){ UI.scenarioWizard.audience = el.dataset.v; render(); },
  wzemotion(el){ UI.scenarioWizard.emotion = el.dataset.v; render(); },
  wzback(){ UI.scenarioWizard.step = Math.max(1, UI.scenarioWizard.step-1); render(); },
  wznext(){
    const w = UI.scenarioWizard;
    if(w.step===1){
      const topicEl = document.getElementById('wz-topic'); const rubricEl = document.getElementById('wz-rubric');
      if(topicEl) w.topic = topicEl.value.trim();
      if(rubricEl) w.rubricId = rubricEl.value;
      if(!w.topic){ toast('Укажите тему ролика','err'); return; }
    }
    w.step = Math.min(4, w.step+1); render();
  },
  wzfinish(){
    const w = UI.scenarioWizard;
    const variant = state.scenarios.length;
    const sb = buildStoryboard(state, {topic:w.topic, duration:w.duration, audience:w.audience, emotion:w.emotion, rubricId:w.rubricId}, variant);
    const s = { id: uid(state,'sc'), topic:w.topic, duration:w.duration, audience:w.audience, emotion:w.emotion, rubric:w.rubricId, status:'Черновик', createdAt:Date.now(), scenes:sb.scenes, totalWords:sb.totalWords, wordTarget:sb.wordTarget };
    state.scenarios.push(s);
    saveState(); closeModal(); toast('Раскадровка собрана','ok');
    go('storyboard/'+s.id);
  },
  printscenario(el){ go('print-scenario:'+el.dataset.id); },
  printweekplan(){ go('print-weekplan'); },
  printormreport(){ go('print-orm-report'); },
  copystoryboard(el){ const s=findScenario(el.dataset.id); copyToClipboard(storyboardAsText(s)); },

  // queue keyboard-first actions
  queueselect(el){ UI.queueIdx = parseInt(el.dataset.idx,10); render(); },
  qapprove(el){
    if(!can(state,'post.approve')) return;
    const p = findPost(el.dataset.id); doApprove(state,p,actorName()); saveState(); toast('Одобрено','ok'); render();
  },
  qrework(el){
    if(!can(state,'post.approve')) return;
    const c = (document.getElementById('q-comment')||{value:''}).value.trim();
    if(!c){ toast('Введите комментарий, затем отправьте на доработку','err'); const ta=document.getElementById('q-comment'); if(ta) ta.focus(); return; }
    const p = findPost(el.dataset.id); doRework(state,p,actorName(),c); saveState(); toast('На доработку','ok'); render();
  },
  qreject(el){
    if(!can(state,'post.approve')) return;
    const c = (document.getElementById('q-comment')||{value:''}).value.trim();
    const p = findPost(el.dataset.id); doReject(state,p,actorName(),c); saveState(); toast('Отклонено','ok'); render();
  },

  // modal chrome
  closemodal(){ closeModal(); },
  overlayclose(el, e){ if(e.target===el) closeModal(); },
};

function runAction(name, el, e){
  const fn = ACTIONS[name];
  if(!fn){ return; }
  fn(el, e);
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.tagName==='SELECT') return;
  if(el.tagName==='INPUT' && el.type==='checkbox') return;
  if(el.tagName==='A') e.preventDefault();
  runAction(el.dataset.act, el, e);
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-act]');
  if(el && (el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type==='checkbox'))){ runAction(el.dataset.act, el, e); return; }
  const live = e.target.closest('[data-live]');
  if(live) runLive(live.dataset.live, live, e);
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-live]');
  if(!el) return;
  runLive(el.dataset.live, el, e);
});
function runLive(name, el){
  if(name==='feedsearch'){ UI.filters.q = el.value; UI.page=1; UI._focusSearch=true; render(); return; }
  if(name==='mcedit'){
    const chId = el.dataset.ch; const post = findPost(UI.mcSourceId); if(!post) return;
    post.adaptations[chId] = el.value; saveState();
    const limit = CH_LIMITS[chId]||4096; const len = el.value.length; const over = len>limit;
    const wrap = el.parentElement;
    const bar = wrap.querySelector('.limit-bar'); const txt = wrap.querySelector('.limit-txt');
    if(bar){ bar.classList.toggle('over', over); const i=bar.querySelector('i'); if(i) i.style.width = Math.min(100,len/limit*100)+'%'; }
    if(txt){ txt.classList.toggle('over', over); txt.textContent = `${len} / ${limit}` + (over?' — превышение':''); }
  }
}

/* ---------- schedule/connect live conflict + validation hints ---------- */
document.addEventListener('input', e=>{
  if(e.target.id==='sch-date' || e.target.id==='sch-time'){
    const modalId = UI.modal && UI.modal.payload.id;
    const p = modalId ? findPost(modalId) : null;
    if(!p) return;
    const dateV = document.getElementById('sch-date').value, timeV = document.getElementById('sch-time').value || '09:00';
    if(!dateV) return;
    const ts = new Date(`${dateV}T${timeV}:00`).getTime();
    const conflicts = slotConflicts(state, p, ts);
    const warn = document.getElementById('sch-warn');
    if(warn) warn.textContent = conflicts.length ? `Слот занят: «${conflicts[0].title}» на канале ${chLabel(p.channels[0])} в это же время. Можно запланировать всё равно — конфликт будет подсвечен в календаре.` : '';
  }
});

/* ============================================================
   §25 KEYBOARD — Escape closes modal; in queue: A / R / ↑↓
   ============================================================ */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(UI.modal){ closeModal(); } return; }
  const tag = document.activeElement && document.activeElement.tagName;
  const typing = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
  if(UI.modal) return;
  if(UI.route!=='queue' || typing) return;
  const items = state.posts.filter(p=>p.status==='review');
  if(items.length===0) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); UI.queueIdx = clamp((UI.queueIdx||0)+1, 0, items.length-1); render(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); UI.queueIdx = clamp((UI.queueIdx||0)-1, 0, items.length-1); render(); }
  else if(e.key==='a' || e.key==='A'){ e.preventDefault(); const p=items[UI.queueIdx||0]; if(p) ACTIONS.qapprove({dataset:{id:p.id}}); }
  else if(e.key==='r' || e.key==='R'){ e.preventDefault(); const p=items[UI.queueIdx||0]; if(p) ACTIONS.qrework({dataset:{id:p.id}}); }
});

/* ============================================================
   §26 CALENDAR DRAG & DROP
   ============================================================ */
document.addEventListener('dragstart', e=>{
  const el = e.target.closest('[data-dragid]');
  if(el && e.dataTransfer) e.dataTransfer.setData('text/plain', el.dataset.dragid);
});
document.addEventListener('dragover', e=>{
  const cell = e.target.closest('[data-cell]');
  if(cell){ e.preventDefault(); cell.classList.add('dragover'); }
});
document.addEventListener('dragleave', e=>{
  const cell = e.target.closest('[data-cell]');
  if(cell) cell.classList.remove('dragover');
});
document.addEventListener('drop', e=>{
  const cell = e.target.closest('[data-cell]');
  if(!cell) return;
  e.preventDefault(); cell.classList.remove('dragover');
  const id = e.dataTransfer.getData('text/plain');
  const post = findPost(id);
  if(!post){ return; }
  if(post.status!=='scheduled'){ toast('Перетаскиванием можно переносить только запланированные посты','err'); return; }
  if(cell.dataset.ch && !post.channels.includes(cell.dataset.ch)){ toast('Этот пост не публикуется в канал '+chLabel(cell.dataset.ch),'err'); return; }
  const ts = parseInt(cell.dataset.ts,10);
  const old = new Date(post.scheduledAt);
  const nd = new Date(ts); nd.setHours(old.getHours(), old.getMinutes(), 0, 0);
  post.scheduledAt = nd.getTime();
  pushHistory(post, 'scheduled', actorName(), 'перенесено перетаскиванием на '+fmtDT(post.scheduledAt));
  saveState(); toast('Дата перенесена на '+fmtDate(post.scheduledAt),'ok'); render();
});
document.getElementById('app').addEventListener('click', e=>{
  const el = e.target.closest('[data-act="calview"]'); if(el){ UI.calView = el.dataset.view; render(); return; }
  const nav = e.target.closest('[data-act="calnav"]'); if(nav){ const dir=parseInt(nav.dataset.dir,10); UI.calAnchor += days((UI.calView==='week'?7:28)*dir); render(); return; }
  const today = e.target.closest('[data-act="caltoday"]'); if(today){ UI.calAnchor = startOfWeek(Date.now()); render(); return; }
});

/* ============================================================
   §27 SCHEDULER — every 30s, publish due posts whose channels are
   all autopost-enabled. Manual "publishnow" bypasses this entirely.
   ============================================================ */
function schedulerTick(){
  const now = Date.now();
  const due = state.posts.filter(p=> p.status==='scheduled' && p.scheduledAt && p.scheduledAt<=now &&
    p.channels.every(id=>{ const c=state.channels.find(c=>c.id===id); return c && c.autopost; }));
  due.forEach(p=> attemptPublish(state, p, 'планировщик'));
  state.lastTick = now;
  if(due.length) saveState();
  return due.length;
}
setInterval(()=>{ const n = schedulerTick(); if(n) render(); }, 30000);

/* ============================================================
   §28 BOOT
   ============================================================ */
document.documentElement.setAttribute('data-theme', theme);
render();
