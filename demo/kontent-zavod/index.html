<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контент-Завод · АИР-ГАЗ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FF6B00'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%230A192F'/%3E%3C/svg%3E">
<style>
/* ============================================================
   TOKENS — 1b «Цех», industrial. border-radius:0 everywhere.
   ============================================================ */
:root{
  --paper:#FFFFFF; --surface:#F7F8FA; --line:#E6E9EF; --line-soft:var(--line);
  --ink:#1E2430; --ink-2:#5A6478; --ink-3:#6F7A8C;
  --brand:#FF6B00; --brand-ink:#B85410; --blue:#3E6FD9; --ok:#1F7D4D; --warn:#8A5E10; --bad:#BE3A33;
  /* ok-ink kept as an alias so every existing var(--ok-ink) call site (badges, toggles,
     status colors) picks up the new --ok value without a call-site-by-call-site rewrite. */
  --ok-ink:var(--ok);
  /* shape rhythm: 10px cards/panels, 8px controls, 999px pills/dots — the client's own words
     were "спокойный, лайтовый" against the old border-radius:0 everywhere. */
  --r-sm:8px; --r-md:10px; --r-pill:999px;
}
:root[data-theme="dark"]{
  --paper:#151A22; --surface:#1C222C; --line:#2B3340; --line-soft:var(--line);
  --ink:#E8ECF3; --ink-2:#A9B3C4; --ink-3:#7E8899;
  --brand:#FF8A3D; --blue:#6E9BF0; --ok:#4CBE86; --warn:#E0A74A; --bad:#E8706B;
  /* dark --brand is already legible as text on dark paper, so brand-ink just mirrors it —
     the light theme is the one that needs a separate darker orange for text. */
  --brand-ink:var(--brand);
  --ok-ink:var(--ok);
}
/* The shell follows the theme. Orange stays on the logo block only in both themes — that is
   the brand, and it is the one loud thing on the screen. Never white text on the orange fill
   (3.87:1) — chrome-logo-ink is a fixed dark ink, not a theme swap. */
:root{
  --chrome-side-bg:var(--surface); --chrome-side-ink:var(--ink); --chrome-side-active-bg:var(--paper); --chrome-side-active-ink:var(--ink);
  --chrome-side-line:var(--line);
  --chrome-logo-bg:var(--brand); --chrome-logo-ink:#1E2430;
  --chrome-top-bg:var(--paper); --chrome-top-ink:var(--ink); --chrome-top-dim:var(--ink-3);
}
:root[data-theme="dark"]{
  --chrome-side-bg:var(--paper); --chrome-side-ink:var(--ink); --chrome-side-active-bg:var(--surface); --chrome-side-active-ink:var(--ink);
  --chrome-side-line:var(--line);
  --chrome-logo-bg:var(--brand); --chrome-logo-ink:#1E2430;
  --chrome-top-bg:var(--paper); --chrome-top-ink:var(--ink); --chrome-top-dim:var(--ink-3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--surface); color:var(--ink); font-size:13px;
  -webkit-font-smoothing:antialiased;
}
.mono, .num, .tabnum{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
button:disabled{cursor:not-allowed;}
a{color:var(--blue);}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{width:236px; flex:none; border-right:1px solid var(--chrome-side-line); background:var(--chrome-side-bg); color:var(--chrome-side-ink); display:flex; flex-direction:column; min-height:100vh;}
.ch-logo{display:inline-flex;align-items:center;margin:0 6px 0 6px;vertical-align:middle;flex:none;}
.ch-logo svg{display:block;} .ch-logo{margin:0 7px 0 6px;}
.td-ch{white-space:nowrap;}
.set-sec{margin:0 0 34px; padding-top:6px;}
.set-sec .view-title{font-size:15px; letter-spacing:.06em;}
.set-sec .view-head{margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--line);}
.set-sec-head{display:flex; align-items:baseline; gap:12px; padding:0 0 8px; border-bottom:1px solid var(--line); margin-bottom:12px;}
.set-sec-head h2{margin:0; font-size:15px; font-weight:800; letter-spacing:.02em;}
.set-sec-note{font-size:12px; color:var(--ink-3);}
.bell{position:relative; background:none; border:1px solid var(--line); border-radius:var(--r-sm); color:var(--chrome-top-ink); width:34px; height:32px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
.bell-dot{position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px; border-radius:var(--r-pill); background:var(--bad); color:#fff; font:700 10px/17px ui-monospace,monospace; text-align:center;}
.notif-list{padding:14px 20px; display:flex; flex-direction:column; gap:8px; max-width:900px;}
.notif{display:flex; gap:14px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-left:4px solid var(--ink-3); background:var(--paper); cursor:pointer;}
.notif:hover{background:var(--surface);}
.notif.crit{border-left-color:var(--bad);}
.notif.warn{border-left-color:var(--brand);}
.notif.info{border-left-color:var(--blue);}
.notif-main{flex:1; min-width:0;}
.notif-title{font-weight:700; font-size:13px;}
.notif-body{font-size:12.5px; margin-top:2px;}
.notif-note{font-size:11.5px; color:var(--ink-3); margin-top:3px;}
.notif-right{text-align:right; flex:none;}
.notif-at{display:block; font-size:11px; color:var(--ink-3);}
.notif-act{font-size:11.5px; font-weight:600; color:var(--blue);}
.side-logo{padding:16px 16px 14px; background:var(--chrome-logo-bg); color:var(--chrome-logo-ink);}
.side-logo .name{font-size:19px; font-weight:700; letter-spacing:.03em; line-height:1;}
.side-logo .sub{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; opacity:.85;}
.side-scroll{flex:1; overflow-y:auto; padding-bottom:12px;}
.side-group-title{padding:16px 16px 6px; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--chrome-side-ink); opacity:.55;}
.side-item{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:1px 10px; padding:8px 10px; border-radius:var(--r-sm); font-size:14px; font-weight:500; letter-spacing:0; cursor:pointer; border-left:3px solid transparent;}
.side-item svg{flex:none;}
.side-item .label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:8px;}
.side-item .count{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; flex:none; font-variant-numeric:tabular-nums;}
.side-item.active{background:var(--chrome-side-active-bg); color:var(--chrome-side-active-ink); border-left-color:var(--brand); box-shadow:0 1px 2px rgba(0,0,0,.06);}
.side-item.disabled{opacity:.45; cursor:not-allowed;}
.side-item:not(.disabled):not(.active):hover{background:var(--chrome-side-active-bg);}

.topbar{height:44px; background:var(--chrome-top-bg); color:var(--chrome-top-ink); display:flex; align-items:center; padding:0 16px; gap:14px; flex:none; border-bottom:1px solid var(--chrome-side-line);}
.topbar .shift{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.05em; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.topbar .shift .dim{color:var(--chrome-top-dim);}
.topbar .sep{color:var(--chrome-top-dim);}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
.role-select, .user-select{background:transparent; border:1px solid var(--line); border-radius:var(--r-sm); color:var(--chrome-top-ink); padding:5px 8px; font-size:11.5px; letter-spacing:.02em;}
.role-select option, .user-select option{color:#000;}
.theme-btn{display:flex; align-items:center; justify-content:center; width:30px; height:30px; border:1px solid var(--line); border-radius:var(--r-sm); background:transparent; color:var(--chrome-top-ink);}
.reset-btn{border:1px solid var(--bad); border-radius:var(--r-sm); color:var(--bad); background:transparent; padding:6px 10px; font-size:11px; letter-spacing:.02em; font-weight:600;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--paper);}
.view{flex:1; min-height:0; display:flex; flex-direction:column; overflow:auto;}

/* ---------- view header / toolbar ---------- */
.view-head{padding:16px 20px 12px; border-bottom:1px solid var(--line); flex:none; background:var(--paper);}
.view-head-row{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;}
.view-title{font-size:24px; font-weight:700; letter-spacing:-.01em; line-height:1.2;}
.view-sub{font-size:12.5px; color:var(--ink-3);}
.view-tools{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

.stat-strip{display:flex; border:1px solid var(--line); border-radius:var(--r-md); margin-top:14px; flex-wrap:wrap; overflow:hidden; background:var(--paper);}
.stat{flex:1; min-width:130px; padding:10px 14px; border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat.warn{background:color-mix(in srgb, var(--warn) 14%, var(--paper));}
.stat-label{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);}
.stat-val{font-size:24px; font-weight:700; margin-top:1px;}
.stat-val .of{font-size:12px; font-weight:400; color:var(--ink-3);}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--ink); padding:7px 13px; font-size:12.5px; font-weight:600; letter-spacing:.01em; white-space:nowrap;}
.btn:hover:not(:disabled){background:var(--surface);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.btn-primary:hover:not(:disabled){background:var(--blue); border-color:var(--blue);}
.btn-accent{background:var(--brand); color:var(--chrome-logo-ink); border-color:var(--brand);}
.btn-accent:hover:not(:disabled){filter:brightness(1.05);}
.btn-danger{border-color:var(--bad); color:var(--bad);}
.btn-danger:hover:not(:disabled){background:var(--bad); color:var(--paper);}
.btn-sm{padding:4px 9px; font-size:11px;}
.btn-ic{display:inline-flex; align-items:center; gap:6px;}
.icon-btn{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--ink-2); width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;}
.icon-btn:hover{border-color:var(--ink-2); color:var(--ink);}
.icon-btn[disabled]{opacity:.35; cursor:not-allowed;}

/* ---------- filters / inputs ---------- */
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:700;}
.input, .select, .textarea{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--ink); padding:7px 9px; font-size:13px;}
.input:focus, .select:focus, .textarea:focus{outline:2px solid var(--blue); outline-offset:-1px;}
.textarea{width:100%; display:block; resize:vertical; min-height:90px; line-height:1.5; font-family:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--ink); font-size:13.5px;}
.checkline{display:flex; align-items:center; gap:6px; font-size:12.5px;}
.search-input{padding:6px 9px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); min-width:200px;}

/* ---------- table ---------- */
.table-wrap{flex:1; overflow:auto; min-height:0;}
.table{width:100%; border-collapse:collapse;}
.table thead th{position:sticky; top:0; background:var(--surface); color:var(--ink-2); border-bottom:1px solid var(--line); font-family:inherit; font-size:11px; letter-spacing:.03em; text-align:left; padding:9px 12px; font-weight:600; cursor:pointer; white-space:nowrap; z-index:2;}
.table thead th.nosort{cursor:default;}
.table thead th .arrow{opacity:.6; font-size:9px; margin-left:3px;}
.table tbody tr{border-bottom:1px solid var(--line-soft); height:42px;}
.table tbody tr:hover{background:var(--surface);}
.table tbody tr.selected{background:var(--surface); box-shadow:inset 3px 0 0 var(--blue);}
.table td{padding:8px 12px; vertical-align:middle;}
.td-ch{padding:0 !important; position:relative;}
.ch-bar{position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:2px 0 0 2px;}
.ch-name{padding-left:12px; font-weight:600; letter-spacing:.01em; font-size:12.5px;}
.ellip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:1px;}
.row-actions{display:flex; gap:8px; color:var(--ink-2);}
.row-actions svg{cursor:pointer;}
.row-actions svg:hover{color:var(--blue);}

.badge{display:inline-block; border-radius:var(--r-sm); border:1px solid; padding:2px 8px; font-size:11px; font-weight:600; letter-spacing:.02em; white-space:nowrap;}
.tone-txt{font-size:11.5px; letter-spacing:.02em; color:var(--ink-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:1px 6px;}

.foot-bar{height:36px; border-top:1px solid var(--line); background:var(--surface); display:flex; align-items:center; padding:0 16px; gap:16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-3); flex:none;}
.pager{display:flex; align-items:center; gap:8px; margin-left:auto;}

.empty-state{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:60px 20px; color:var(--ink-3); text-align:center;}
.empty-state .big{font-size:15px; color:var(--ink-2); font-weight:600;}

/* ---------- pill filters ---------- */
.pills{display:flex; gap:6px; flex-wrap:wrap;}
.pill{padding:6px 13px; font-size:12px; letter-spacing:.01em; border:1px solid var(--line); border-radius:var(--r-pill); cursor:pointer; background:var(--paper); font-weight:600;}
.pill.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.pill .n{font-family:'IBM Plex Mono',monospace; margin-left:4px;}

.dd{border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 10px; font-size:12px; letter-spacing:.01em; background:var(--paper); font-weight:600;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,24,32,.5); display:flex; align-items:flex-start; justify-content:center; z-index:100; padding:30px 16px; overflow:auto;}
.modal{background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); width:100%; max-width:720px; max-height:calc(100vh - 60px); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.18);}
.modal.wide{max-width:1040px;}
.modal-head{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); flex:none;}
.modal-title{font-size:17px; font-weight:700;}
.modal-close{margin-left:auto; background:none; border:none; color:var(--ink-2); font-size:20px; line-height:1; padding:2px 4px;}
.modal-body{padding:18px; overflow:auto; display:flex; flex-direction:column; gap:14px;}
.modal-foot{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line); flex:none; align-items:center;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

.tabs{display:flex; border-bottom:1px solid var(--line); flex:none;}
.tab{padding:9px 14px; font-size:12.5px; font-weight:600; letter-spacing:.01em; color:var(--ink-3); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px;}
.tab.active{color:var(--ink); border-bottom-color:var(--brand);}

.history-item{border-left:2px solid var(--line); padding:4px 0 4px 12px; font-size:12px; color:var(--ink-2);}
.history-item b{color:var(--ink);}
.comment-box{background:var(--surface); border-radius:var(--r-sm); border-left:3px solid var(--brand); padding:8px 10px; font-size:12.5px; margin-top:4px;}

.kv{display:grid; grid-template-columns:120px 1fr; gap:5px 12px; font-size:13px;}
.kv .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);}

.toast-wrap{position:fixed; bottom:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:var(--paper); border-radius:var(--r-sm); border-left:4px solid var(--brand); padding:10px 14px; font-size:12.5px; max-width:340px; box-shadow:0 4px 14px rgba(0,0,0,.25);}
.toast.err{border-left-color:var(--bad);}
.toast.ok{border-left-color:var(--ok);}

.kbd-hint{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-3); border:1px solid var(--line); border-radius:var(--r-sm); padding:0 5px;}

.qcard{border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:14px; background:var(--paper); overflow:hidden;}
.qcard.current{box-shadow:0 0 0 2px var(--brand) inset;}
.qhead{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line);}
.qbody{padding:14px;}
.qpreview{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; font-size:13.5px; line-height:1.55; white-space:pre-wrap;}

.limit-bar{height:4px; border-radius:var(--r-pill); background:var(--line-soft); margin-top:4px; position:relative; overflow:hidden;}
.limit-bar i{display:block; height:100%; background:var(--ok-ink);}
.limit-bar.over i{background:var(--bad);}
.limit-txt{font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--ink-3);}
.limit-txt.over{color:var(--bad); font-weight:700;}

.cal-grid{display:grid; border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; min-width:900px;}
.cal-head-cell{background:var(--surface); color:var(--ink-2); font-size:11px; letter-spacing:.03em; padding:7px 8px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center;}
.cal-row-label{background:var(--surface); border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px 8px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px;}
.cal-cell{border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:56px; padding:3px; vertical-align:top; position:relative;}
.cal-cell.today{background:color-mix(in srgb, var(--blue) 7%, var(--paper));}
.cal-chip{display:flex; align-items:center; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); border-left:3px solid; padding:2px 5px; font-size:10.5px; margin-bottom:2px; cursor:grab; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-chip.conflict{border-color:var(--bad); box-shadow:0 0 0 1px var(--bad) inset;}
.cal-cell.dragover{background:color-mix(in srgb, var(--warn) 16%, var(--paper));}

.scene-card{border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:10px; overflow:hidden;}
.scene-num{background:var(--surface); color:var(--ink-2); border-bottom:1px solid var(--line); padding:6px 12px; font-size:12px; font-weight:600; letter-spacing:.02em; display:flex; justify-content:space-between;}
.scene-grid{display:grid; grid-template-columns:1fr 1fr; gap:0;}
.scene-cell{padding:9px 12px; border-top:1px solid var(--line); border-right:1px solid var(--line);}
.scene-cell:nth-child(2n){border-right:none;}
.scene-cell .lbl{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:2px;}

.print-page{display:none;}
body.printing .shell{display:none;}
body.printing .print-page{display:block; background:#fff; color:#111; padding:18mm; font-family:'IBM Plex Sans',sans-serif;}
.print-page table{width:100%; border-collapse:collapse; font-size:12px;}
.print-page th, .print-page td{border:1px solid #999; padding:5px 7px; text-align:left; vertical-align:top;}
.print-page h1{font-size:20px; margin:0 0 4px;}
.print-page .meta{font-size:11px; color:#555; margin-bottom:14px;}
.no-print{}
@media print{
  .shell{display:none !important;}
  .no-print{display:none !important;}
  .print-page{display:block !important; background:#fff; color:#111;}
  body{background:#fff;}
}

.kbtag{display:inline-block; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:2px 7px; font-size:11.5px; margin:2px 4px 2px 0;}
.hl{background:color-mix(in srgb, var(--brand) 22%, var(--paper)); color:var(--brand-ink); border-radius:3px; padding:0 2px; font-weight:700;}

.mini-note{font-size:11.5px; color:var(--ink-3);}
.disabled-note{font-size:11px; color:var(--ink-3); font-style:italic;}
.sw{position:relative; width:36px; height:20px; border-radius:var(--r-pill); border:1px solid var(--line); background:var(--surface); flex:none; cursor:pointer;}
.sw i{position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:var(--r-pill); background:var(--ink-3); transition:transform .1s;}
.sw.on{background:var(--ok-ink); border-color:var(--ok-ink);}
.sw.on i{background:#fff; transform:translateX(16px);}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--ink-3);}

@media (max-width: 980px){
  .sidebar{width:56px;}
  .side-logo .sub, .side-item .label span:last-child, .side-group-title{display:none;}
}

/* ---------- дашборд: основа + плашки по ботам ---------- */
.sec-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:8px;}
.dash-block{margin-bottom:22px;}
.bot-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:14px;}
.bot-panel{border:1px solid var(--line); border-radius:var(--r-md); background:var(--paper); padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:10px;}
.bot-panel:hover{border-color:var(--ink-3); box-shadow:0 2px 10px rgba(0,0,0,.06);}
.bot-panel-head{display:flex; align-items:center; gap:10px;}
.bot-icon{width:34px; height:34px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; flex:none;}
.bot-panel-name{font-weight:700; font-size:14px;}
.bot-panel-desc{font-size:11.5px; color:var(--ink-3); margin-top:1px;}
.bot-status-pill{margin-left:auto; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:var(--r-pill); border:1px solid; white-space:nowrap;}
.bot-stats{display:flex; gap:18px; flex-wrap:wrap;}
.bot-stat .v{font-size:20px; font-weight:700;}
.bot-stat .l{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-top:1px;}
.bot-thumbs{display:flex; gap:6px;}
.bot-panel .btn{align-self:flex-start; margin-top:2px;}
.queue-summary{border:1px solid var(--line); border-radius:var(--r-md); background:var(--paper); padding:4px 16px; margin-top:14px;}
.queue-summary .empty-state{padding:20px;}

/* ---------- миниатюры постов/раскадровок — детерминированные inline SVG, без сети ---------- */
.thumb{position:relative; flex:none; border-radius:var(--r-sm); overflow:hidden; line-height:0;}
.thumb svg{display:block; width:100%; height:100%;}
.thumb-row{width:56px; height:32px;}
.thumb-card{width:100%; max-width:280px; aspect-ratio:16/9;}
.thumb-xs{width:22px; height:13px; border-radius:3px;}
.thumb-dur{position:absolute; right:3px; bottom:3px; background:rgba(20,24,32,.72); color:#fff; font:600 9px/1.6 'IBM Plex Mono',monospace; padding:0 4px; border-radius:3px;}
.thumb-play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.feed-title-cell{display:flex; align-items:center; gap:10px; min-width:0;}
.feed-title-cell .ttl{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
</style>
</head>

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDT(ts){ const d=new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts){ const d=new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; }
function fmtDateLong(ts){ const MS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']; const d=new Date(ts); return `${d.getDate()} ${MS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(ts){ const d=new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function days(n){ return n*24*60*60*1000; }
function hours(n){ return n*60*60*1000; }
function mins(n){ return n*60*1000; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function pickIdx(rng, n){ return Math.floor(rng()*n); }
function sameDay(a,b){ const da=new Date(a),db=new Date(b); return da.getFullYear()===db.getFullYear() && da.getMonth()===db.getMonth() && da.getDate()===db.getDate(); }
function sameMinute(a,b){ return Math.floor(a/60000)===Math.floor(b/60000); }

/* ============================================================
   §2b МИНИАТЮРЫ — детерминированный inline SVG на пост/сцену раскадровки.
   «это соцсети, там должно быть много контента» (Дамир): лента текстом не читается
   как соцсеть. Никакой сети, никакого Math.random — цвет и форма выводятся хэшем
   от id, поэтому одна и та же карточка выглядит одинаково после перезагрузки.
   ============================================================ */
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h>>>0;
}
// gradient family per product line, so all AG-PROTECT thumbnails read as one family
const RUBRIC_GRAD = {
  agp:['#FF6B00','#B85410'], nsps:['#3E6FD9','#1E2430'], grpsh:['#1F7D4D','#0B3B24'],
  gis:['#5A6478','#1E2430'], turnkey:['#8A5E10','#3E6FD9'],
};
const VIDEO_DURS = [15,30,45,60];
// ~1/5 of posts are video, per спецификация — derived from the post id, not from a stored flag,
// so an older saved state (kz_v1 without this concept) still renders correctly on load.
function postKind(id){ return hashStr(id)%5===0 ? 'video' : 'image'; }
function postDur(id){ return VIDEO_DURS[Math.floor(hashStr(id)/7)%VIDEO_DURS.length]; }
function thumbSvg(seedId, rubricId, label, size, opts){
  opts = opts||{};
  const kind = opts.forceKind || postKind(seedId);
  const h = hashStr(seedId);
  const [c1,c2] = RUBRIC_GRAD[rubricId] || RUBRIC_GRAD.gis;
  const gid = 'tg_'+size+'_'+seedId.replace(/[^a-zA-Z0-9]/g,'');
  const cx1 = 18 + (h%70), cy1 = 8 + ((h>>3)%40);
  const cx2 = 60 + ((h>>6)%70), cy2 = 36 + ((h>>9)%40);
  const showLabel = size==='card';
  const showDur = kind==='video' && size!=='xs';
  const dur = opts.dur!=null ? opts.dur : postDur(seedId);
  const durTxt = size==='card' ? `${dur} сек` : `${dur}с`;
  return `<div class="thumb thumb-${size}"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="160" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="160" height="90" fill="url(#${gid})"/>
    <circle cx="${cx1}" cy="${cy1}" r="${26+(h%16)}" fill="#fff" opacity=".08"/>
    <circle cx="${cx2}" cy="${cy2}" r="${16+(h%12)}" fill="#fff" opacity=".10"/>
    ${showLabel?`<rect x="0" y="62" width="160" height="28" fill="#14182080"/><text x="9" y="82" font-family="IBM Plex Sans,sans-serif" font-size="12" font-weight="700" fill="#fff">${esc(label)}</text>`:''}
    ${kind==='video'?`<circle cx="80" cy="45" r="15" fill="#14182066"/><path d="M75 38l13 7-13 7z" fill="#fff"/>`:''}
  </svg>${showDur?`<span class="thumb-dur">${durTxt}</span>`:''}</div>`;
}
function postThumb(post, size){ const r=RUBRIC_DEFS.find(r=>r.id===post.rubric); return thumbSvg(post.id, post.rubric, r?r.short:post.rubric, size); }
function scenarioThumb(sc, size, opts){ const r=RUBRIC_DEFS.find(r=>r.id===sc.rubric); return thumbSvg(sc.id, sc.rubric, r?r.short:sc.rubric, size, Object.assign({forceKind:'video', dur:sc.duration}, opts||{})); }

function contactsFor(chId, v){
  const phone = CONTACTS.phones[v % CONTACTS.phones.length];
  if(['max','vk','wa'].includes(chId)) return `Звоните: ${phone}.`;
  if(chId==='zen') return `Подробнее на ${CONTACTS.site}.`;

}
/* ТЗ §3.2: «автоматическая расстановка ГОСТ/ГАЗСЕРТ хештегов». The rubric tags alone were all
   product words - the standards the factory certifies against never appeared, which is the half
   of the requirement that matters to a gas client. Each rubric now contributes the standard it
   actually holds, and one always lands in the tail of the list. */
const STANDARD_TAGS = {
  agp:   ['#ГАЗСЕРТ','#ТРТС032'],
  nsps:  ['#ISO9001','#ГОСТ_Р_58121'],
  grpsh: ['#ГАЗСЕРТ','#ГОСТ_54983'],
  gis:   ['#ГОСТ_9.602','#ТРТС032'],
  turnkey: ['#СП_62_13330','#ГАЗСЕРТ'],
};
function hashtagsFor(rubric, chId){
  const std = STANDARD_TAGS[rubric.id] || ['#ГАЗСЕРТ'];
  const base = [...rubric.hashtags];
  let n = 4;
  if(chId==='vk') n = 6;         // spec: VK hashtags 5-7
  else if(chId==='tt' || chId==='ig') n = 5;
  // keep room for one standard tag, always last so it reads as the certification stamp
  const body = base.slice(0, Math.max(1, Math.min(n, base.length) - 1));
  return [...body, std[0]].join(' ');
}

const SOFTEN_MAP = {'обязаны':'рекомендуем','необходимо':'стоит','должны':'можете','срочно':'в удобные сроки','штраф':'нюанс','нельзя':'не стоит'};
function softenText(t){
  let r = t;
  Object.entries(SOFTEN_MAP).forEach(([k,v])=>{ r = r.split(k).join(v); r = r.split(capitalize(k)).join(capitalize(v)); });
  r = r.replaceAll('!','.');
  return r;
}

/* ============================================================
   §3 DETERMINISTIC TEXT GENERATOR — no LLM, no Math.random.
   text = opener(tone) + fact(rubric->KB) + development(postType,tone)
        + CTA(channel) + hashtags(rubric+standards) + contacts(channel)
   Same (tone,rubric,channel,postType,variant) always yields the same
   text. Variant advances only when the combo already exists in state
   (anti-dup), so re-generating for a *new* post explores new copy.
   ============================================================ */
function titleFor(rubric, type, v){
  const phrase = rubric.phrases[v % rubric.phrases.length];
  return `${type.name}: ${capitalize(phrase)}`;
}
function buildPostText(state, {toneId, rubricId, chId, postTypeId}, variant){
  const tone = state.tones.find(t=>t.id===toneId) || state.tones[0];
  const rubric = state.rubrics.find(r=>r.id===rubricId) || state.rubrics[0];
  const type = POST_TYPE_DEFS.find(t=>t.id===postTypeId) || POST_TYPE_DEFS[0];
  const ch = chId || 'vk';
  const v = variant;
  const lead = type.lead[v % type.lead.length];
  const opener = tone.openers[v % tone.openers.length];
  const fact = rubric.facts[(v+1) % rubric.facts.length];
  const dev = tone.dev[(v+2) % tone.dev.length];
  const phrase = rubric.phrases[v % rubric.phrases.length];
  const cta = (CTA_BY_CH[ch]||CTA_BY_CH.vk)[v % (CTA_BY_CH[ch]||CTA_BY_CH.vk).length];
  const hashtags = hashtagsFor(rubric, ch);
  const contacts = contactsFor(ch, v);
  let s1 = `${lead} ${opener} ${capitalize(phrase)} — ${fact}.`;
  let s2 = dev;
  let s3 = `${cta} ${contacts}`;
  let body = [s1, s2, s3].join(' ');
  if(tone.soften) body = softenText(body);
  const text = `${body}\n\n${hashtags}`;
  const title = titleFor(rubric, type, v);
  return {title, text};
}
function comboCount(state, toneId, rubricId, chId, postTypeId, excludeId){
  return state.posts.filter(p=> p.id!==excludeId && p.tone===toneId && p.rubric===rubricId && p.postType===postTypeId && p.channels.includes(chId)).length;
}
function generatePost(state, post){
  const chId = post.channels[0] || 'vk';
  let variant = comboCount(state, post.tone, post.rubric, chId, post.postType, post.id);
  let out, tries = 0;
  do{
    out = buildPostText(state, {toneId:post.tone, rubricId:post.rubric, chId, postTypeId:post.postType}, variant+tries);
    tries++;
  } while(state.posts.some(p=>p.id!==post.id && p.text===out.text) && tries<16);
  return out;
}
function smartEdit(text, instruction){
  const cmd = (instruction||'').trim().toLowerCase();
  if(!cmd) return null;
  if(cmd.includes('коро') || cmd.includes('кратк') || cmd.includes('сократ')){
    const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
    const keep = Math.max(1, Math.ceil(sentences.length*0.6));
    return sentences.slice(0, keep).join(' ');
  }
  if(cmd.includes('техник') || cmd.includes('цифр') || cmd.includes('норматив')){
    const extra = RUBRIC_DEFS.flatMap(r=>r.facts).find(f=>!text.includes(f));
    return extra ? `${text} ${capitalize(extra)}.` : text;
  }
  if(cmd.includes('мягч') || cmd.includes('дружелюбн') || cmd.includes('добр')){
    return softenText(text);
  }
  return null;
}

function classifyMention(state, text){

function buildOrmText(state, mention, kind, variant){

   §5 PRODUCER — storyboard generator
   duration -> word budget & scene count (spec §3)
   ============================================================ */
const AUDIENCES = ['Частные заказчики','Проектировщики и ГИПы','Муниципалитеты','Партнёры-монтажники'];
const EMOTIONS = ['Доверие','Забота','Экспертность','Драйв'];
const DURATION_META = {
  15:{scenes:2, words:[35,45]},
  30:{scenes:3, words:[70,85]},
  45:{scenes:4, words:[100,120]},
  60:{scenes:5, words:[130,150]},
};
const SFX_POOL = ['гул станка','щелчок затвора','фоновая индастриал-музыка','звук сварки','тишина, только голос'];
const SHOT_POOL = ['общий план цеха','крупный план узла','инженер у стенда','дрон над площадкой','рука на чертеже'];
function buildStoryboard(state, {topic, duration, audience, emotion, rubricId}, variant){
  const meta = DURATION_META[duration] || DURATION_META[30];
  const rubric = state.rubrics.find(r=>r.id===rubricId) || state.rubrics[0];
  const perScene = Math.round(((meta.words[0]+meta.words[1])/2) / meta.scenes);
  const sceneSec = Math.round(duration / meta.scenes);
  const scenes = [];
  let total = 0;
  for(let i=0;i<meta.scenes;i++){
    const fact = rubric.facts[(variant+i) % rubric.facts.length];
    const shot = SHOT_POOL[(variant+i) % SHOT_POOL.length];
    const sfx = SFX_POOL[(variant+i) % SFX_POOL.length];
    const sec = i===meta.scenes-1 ? (duration - sceneSec*(meta.scenes-1)) : sceneSec;
    let voice;
    if(i===0) voice = `${topic || rubric.name}. ${capitalize(emotion)} с первых секунд: ${fact}.`;
    else if(i===meta.scenes-1) voice = `Обращаемся к ${audience.toLowerCase()}: звоните ${CONTACTS.phones[0]}, ${CONTACTS.site}.`;
    else voice = `${capitalize(fact)}.`;
    const words = voice.split(/\s+/).filter(Boolean).length;
    total += words;
    scenes.push({
      n:i+1, shot:`${shot} — ${rubric.short}`, voice,
      onscreen: i===0 ? (topic || rubric.name).toUpperCase() : (i===meta.scenes-1 ? CONTACTS.site : fact.split(' ').slice(0,4).join(' ')),
      sfx, sec, words,
    });
  }
  return {scenes, totalSec:duration, totalWords:total, wordTarget:meta.words};
}

/* ============================================================
   §6 STATE MACHINE — posts
   Черновик -> На согласовании -> Одобрен -> Запланировано -> Опубликовано
        rework/rejected feed back to Черновик. Ошибка публикации sits
        between Запланировано and Опубликовано; 3rd failed attempt ->
        "Требует внимания" and the scheduler stops auto-retrying it
        (it simply never re-enters status 'scheduled' on its own).
   ============================================================ */
const STATUS_META = {
  draft:      {label:'Черновик',            tone:'grey'},
  review:     {label:'На согласовании',     tone:'blue'},
  rework:     {label:'На доработку',        tone:'orange'},
  approved:   {label:'Одобрен',             tone:'green'},
  scheduled:  {label:'Запланировано',       tone:'blue'},
  published:  {label:'Опубликовано',        tone:'green'},
  rejected:   {label:'Отклонён',            tone:'red'},
  error:      {label:'Ошибка публикации',   tone:'red'},
  archived:   {label:'Архив',               tone:'grey'},
};
function statusColorVar(tone){
  return {grey:'var(--ink-3)', blue:'var(--blue)', orange:'var(--warn)', green:'var(--ok-ink)', red:'var(--bad)'}[tone] || 'var(--ink-3)';
}
function statusLabel(post){
  if(post.status==='error' && post.needsAttention) return 'Требует внимания';
  return STATUS_META[post.status].label;
}
function statusColor(post){
  if(post.status==='error' && post.needsAttention) return statusColorVar('red');
  return statusColorVar(STATUS_META[post.status].tone);
}
function pushHistory(post, status, by, note){
  post.history.push({status, at:Date.now(), by: by || 'система', note: note || null});
}
function doSubmitForReview(state, post, actor){
  post.status='review'; pushHistory(post,'review', actor);
}
function doApprove(state, post, actor){
  post.status='approved'; pushHistory(post,'approved', actor);
}
function doRework(state, post, actor, comment){
  post.status='rework'; post.comments.push({by:actor, at:Date.now(), text:comment, type:'rework'});
  pushHistory(post,'rework', actor, comment);
}
function doReject(state, post, actor, comment){
  post.status='rejected'; if(comment) post.comments.push({by:actor, at:Date.now(), text:comment, type:'reject'});
  pushHistory(post,'rejected', actor, comment);
}
function doBackToDraft(state, post, actor){
  post.status='draft'; pushHistory(post,'draft', actor);
}
function doSchedule(state, post, actor, whenTs){
  post.scheduledAt = whenTs; post.status='scheduled'; post.attempts=0; post.needsAttention=false; post.errorReason=null;
  pushHistory(post,'scheduled', actor, fmtDT(whenTs));
}
function slotConflicts(state, post, whenTs){
  return state.posts.filter(p=> p.id!==post.id && ['scheduled','published'].includes(p.status) &&
    p.channels.some(c=>post.channels.includes(c)) &&
    ((p.status==='scheduled'&&p.scheduledAt&&sameMinute(p.scheduledAt,whenTs)) || (p.status==='published'&&p.publishedAt&&sameMinute(p.publishedAt,whenTs))));
}
function logPublish(state, post, ch, result, reason){
  state.publishLog.unshift({id:uid(state,'log'), postId:post.id, postTitle:post.title, channelId:ch.id, channelName:ch.name, at:Date.now(), result, reason, attempt:post.attempts});
}
function attemptPublish(state, post, actor){
  const chans = post.channels.map(id=>state.channels.find(c=>c.id===id)).filter(Boolean);
  post.attempts = (post.attempts||0)+1;
  const notConnected = chans.filter(c=>!c.connected);
  const connected = chans.filter(c=>c.connected);
  if(chans.length>0 && notConnected.length===0){
    connected.forEach(c=>logPublish(state, post, c, 'success', null));
    post.status='published'; post.publishedAt=Date.now(); post.errorReason=null;
    pushHistory(post,'published', actor);
  } else {
    connected.forEach(c=>logPublish(state, post, c, 'success', null));
    notConnected.forEach(c=>logPublish(state, post, c, 'fail', `Канал ${c.name} не подключён`));
    post.status='error';
    post.errorReason = `Канал${notConnected.length>1?'ы':''} ${notConnected.map(c=>c.name).join(', ')} не подключ${notConnected.length>1?'ены':'ён'}`;
    if(post.attempts>=3) post.needsAttention = true;
    pushHistory(post, post.needsAttention?'attention':'error', actor, post.errorReason);
  }
}
function doArchive(state, post, actor){
  post.status='archived'; pushHistory(post,'archived', actor);
}
function doDelete(state, post){
  state.posts = state.posts.filter(p=>p.id!==post.id);
}

    mentions: [],
    scenarios: [],
    publishLog: [],
  };

  // ---- posts ----
  const plan = [];
  const add = (status,n)=>{ for(let i=0;i<n;i++) plan.push(status); };
  add('draft',9); add('review',7); add('approved',5); add('scheduled',22);
  add('rework',3); add('rejected',2); add('error',2); add('attention',1);
  /* ~3 posts a working day across four channels for three months. The queue and the log
     have to look like a factory that has been running, not like a fresh install. */
  add('published',96); add('archived',6);

  plan.forEach((planStatus, i)=>{
    const rubric = state.rubrics[i % state.rubrics.length];
    const tone = state.tones[Math.floor(rng()*state.tones.length)];
    const type = POST_TYPE_DEFS[i % POST_TYPE_DEFS.length];
    let channels;
    const chRoll = rng();
    const phase1 = CHANNEL_DEFS.filter(c=>c.phase===1);
    const phase2 = CHANNEL_DEFS.filter(c=>c.phase===2);
    if(chRoll < 0.72) channels = [pick(rng, phase1).id];
    else if(chRoll < 0.9) channels = [pick(rng, phase1).id, pick(rng, phase1).id].filter((v,idx,a)=>a.indexOf(v)===idx);
    else channels = [pick(rng, phase2).id];
    if(channels.length===0) channels=[phase1[0].id];

    const {title, text} = buildPostText(state, {toneId:tone.id, rubricId:rubric.id, chId:channels[0], postTypeId:type.id}, i);

    const post = {
      id: uid(state,'p'), title, text, tone: tone.id, rubric: rubric.id, postType: type.id, channels,
      status: planStatus==='attention' ? 'error' : planStatus,
      needsAttention: planStatus==='attention',
      attempts: 0, errorReason: null,
      createdAt: now - Math.floor(rng()*80)*days(1) - Math.floor(rng()*20)*hours(1),
      scheduledAt: null, publishedAt: null,
      history: [], comments: [], adaptations: {},
    };
    pushHistory(post, 'draft', 'система', 'создан импортом демо-данных');

    if(planStatus==='review'){ post.status='review'; pushHistory(post,'review','Р. Сафина'); }
    if(planStatus==='approved'){ post.status='approved'; pushHistory(post,'review','Р. Сафина'); pushHistory(post,'approved','И. Хамидуллин'); }
    if(planStatus==='rework'){
      post.status='rework'; pushHistory(post,'review','Р. Сафина');
      const note = 'Добавь цифры по гарантии и уточни норматив — сейчас звучит общо.';
      post.comments.push({by:'И. Хамидуллин', at: post.createdAt+hours(2), text:note, type:'rework'});
      pushHistory(post,'rework','И. Хамидуллин', note);
    }
    if(planStatus==='rejected'){
      post.status='rejected'; pushHistory(post,'review','Р. Сафина');
      const note='Дублирует пост от прошлой недели, тема закрыта.';
      post.comments.push({by:'И. Хамидуллин', at: post.createdAt+hours(3), text:note, type:'reject'});
      pushHistory(post,'rejected','И. Хамидуллин', note);
    }
    if(planStatus==='scheduled'){
      post.status='scheduled'; pushHistory(post,'review','Р. Сафина'); pushHistory(post,'approved','И. Хамидуллин');
      post.scheduledAt = now + Math.floor(rng()*21)*days(1) + Math.floor(rng()*23)*hours(1);
      pushHistory(post,'scheduled','Р. Сафина', fmtDT(post.scheduledAt));
    }
    if(planStatus==='error' || planStatus==='attention'){
      /* With Phase 1 connected, a failure needs a genuine cause. These sit on a Phase-2 channel,
         which is exactly the real one: the channel is not connected yet. */
      const p2 = CHANNEL_DEFS.filter(c=>c.phase===2);
      post.channels = [pick(rng, p2).id];
      post.status='approved'; pushHistory(post,'review','Р. Сафина'); pushHistory(post,'approved','И. Хамидуллин');
      post.scheduledAt = now - Math.floor(rng()*4)*days(1) - hours(2);
      pushHistory(post,'scheduled','Р. Сафина', fmtDT(post.scheduledAt));
      const targetAttempts = planStatus==='attention' ? 3 : (1+Math.floor(rng()*2));
      for(let a=0;a<targetAttempts;a++) attemptPublish(state, post, 'планировщик');
    }
    if(planStatus==='published'){
      post.status='approved'; pushHistory(post,'review','Р. Сафина'); pushHistory(post,'approved','И. Хамидуллин');
      const chObjs = channels.map(id=>state.channels.find(c=>c.id===id));
      /* Phase 2 is not connected, so a post seeded onto it could never have published.
         Borrow the connection for the write and hand it straight back - Phase 1 keeps its own. */
      const borrowed = chObjs.filter(c=>!c.connected);
      borrowed.forEach(c=>{ c.connected=true; });
      post.scheduledAt = now - Math.floor(rng()*29)*days(1) - hours(3);
      pushHistory(post,'scheduled','Р. Сафина', fmtDT(post.scheduledAt));
      attemptPublish(state, post, 'планировщик');
      post.publishedAt = post.scheduledAt + mins(2);
      state.publishLog[0].at = post.publishedAt;
      borrowed.forEach(c=>{ c.connected=false; c.account=''; });
    }
    if(planStatus==='archived'){
      post.status='archived';
      post.createdAt = now - (90+Math.floor(rng()*30))*days(1);
      pushHistory(post,'review','Р. Сафина'); pushHistory(post,'approved','И. Хамидуллин');
      post.publishedAt = post.createdAt + days(2);
      pushHistory(post,'published','планировщик');
      pushHistory(post,'archived','М. Ситдиков');
    }
    state.posts.push(post);
  });

  // deliberate slot conflict for the calendar (2 scheduled posts, same channel, same minute)
  const sched = state.posts.filter(p=>p.status==='scheduled');
  if(sched.length>=2){
    sched[1].scheduledAt = sched[0].scheduledAt;
    sched[1].channels = [sched[0].channels[0]];
  }

  // ---- mentions ----
  MENTION_STATUS_PLAN.forEach((st, i)=>{
    const text = MENTION_TEXTS[i % MENTION_TEXTS.length];
    const {categories, keywords} = classifyMention(state, text);
    const source = MENTION_SOURCES[i % MENTION_SOURCES.length];
    const isOverdueSeed = i===0;
    const isUnresolved = st==='new' || st==='inprogress';
    // unresolved mentions get recent timestamps so only the deliberately
    // overdue one (i===0) trips the 30-min SLA on first load; resolved
    // ones (done/escalated) can carry realistic historical dates.
    const at = isOverdueSeed ? (now - hours(2))
      : isUnresolved ? (now - mins(1 + Math.floor(rng()*22)))
      : (now - Math.floor(rng()*10)*days(1) - Math.floor(rng()*20)*hours(1));
    const m = {
      id: uid(state,'m'), source: source.id, sourceLabel: source.label,
      author: MENTION_AUTHORS[i % MENTION_AUTHORS.length], at, text, categories, keywords,
      status: st, slaMin:30, officialText:'', crisisText:'', linkedPostId:null, resolvedAt:null,
    };
    if(st==='inprogress' || st==='done'){
      m.officialText = buildOrmText(state, m, 'official', i);
      m.crisisText = buildOrmText(state, m, 'crisis', i);
    }
    if(st==='done'){ m.resolvedAt = at + mins(8 + Math.floor(rng()*25)); }
    state.mentions.push(m);
  });

  // ---- scenarios ----
  SCENARIO_TOPICS.forEach((topic, i)=>{
    const durations=[15,30,45,60]; const duration = durations[i%4];
    const audience = AUDIENCES[i % AUDIENCES.length];
    const emotion = EMOTIONS[i % EMOTIONS.length];
    const rubric = state.rubrics[i % state.rubrics.length];
    const sb = buildStoryboard(state, {topic, duration, audience, emotion, rubricId:rubric.id}, i);
    state.scenarios.push({
      id: uid(state,'sc'), topic, duration, audience, emotion, rubric: rubric.id,
      status: i<5 ? 'Готово' : 'Черновик', createdAt: now - Math.floor(rng()*40)*days(1),
      scenes: sb.scenes, totalWords: sb.totalWords, wordTarget: sb.wordTarget,
    });
  });

  /* Last line wins: this used to reset the seed's admin default back to the marketer, which
     greyed out half the navigation and made most row actions no-ops on first open. */
  /* ---- demo coverage: three things the seed left with no data to exercise ---- */

  /* 1. Posts genuinely due, so «Прогнать планировщик» has work and the scheduler fires live
        during a demo instead of looking inert. Two publish, one is on an unconnected Phase-2
        channel and will fail - which is the pair you want to show. */
  (function seedDue(){
    const ready = state.posts.filter(p=>p.status==='scheduled').slice(0,3);
    ready.forEach((p,i)=>{
      p.scheduledAt = now + (i===2 ? -mins(1) : mins(1) + i*mins(1));
      if(i===2) p.channels=['ig'];
      pushHistory(p,'scheduled', actorNameFor('u1'), 'перепланировано для демо');
    });
  })();

  /* 2. Channel adaptations, so the Мультиканал screen opens with versions to compare rather
        than an empty right-hand column. */
  state.posts.filter(p=>p.channels.length>1).slice(0,8).forEach(p=>{
    p.adaptations = {};
    p.channels.forEach(ch=>{
      const lim = CH_LIMITS[ch] || 4096;
      let t = p.text;
      if(ch==='tt' || ch==='ig') t = t.split('\n')[0];
      if(t.length > lim) t = t.slice(0, lim-1) + '…';
      if(ch==='vk') t = t + '\n\n#АИРГАЗ #ГАЗСЕРТ #газификация #НСПС #AGPROTECT';
      if(ch==='wa') t = t.split('\n')[0] + '\n\nПодробности: ' + CONTACTS.phoneMain;
      p.adaptations[ch] = t;
    });
  });

  /* 3. Two mentions already turned into posts, so the ORM -> очередь link has history and the
        «уже в работе» state is visible without clicking it first. */
  state.mentions.filter(m=>m.status==='done').slice(0,2).forEach((m,i)=>{
    const src = state.posts.filter(p=>p.status==='published')[i];
    if(src){ m.linkedPostId = src.id; }
  });

  setCurrentUser(state, 'u5');
  return state;
}

function toneAbbr(id){ const t=toneOf(id); return t ? (TONE_DEFS.find(td=>td.id===id)||{}).abbr || t.name.slice(0,2).toUpperCase() : '—'; }
function chLabel(id){ return CH_BY_ID[id] ? CH_BY_ID[id].name : id; }

function matchesBaseFilter(p){
  if(UI.filters.ch && !p.channels.includes(UI.filters.ch)) return false;
  if(UI.filters.rubric && p.rubric!==UI.filters.rubric) return false;
  if(UI.filters.tone && p.tone!==UI.filters.tone) return false;
  if(UI.filters.q){ const q=UI.filters.q.toLowerCase(); if(!p.title.toLowerCase().includes(q)) return false; }
  return true;
}
function getFilteredForPills(){ return state.posts.filter(p=>p.status!=='archived' && matchesBaseFilter(p)); }
function getFilteredPosts(){
  return state.posts.filter(p=>{
    if(UI.filters.status){
      if(UI.filters.status==='attention'){ if(!(p.status==='error'&&p.needsAttention)) return false; }
      else if(p.status!==UI.filters.status) return false;
    } else if(p.status==='archived') return false;
    return matchesBaseFilter(p);
  });
}
function sortPosts(list){
  const {key,dir} = UI.sort;
  const mul = dir==='asc'?1:-1;
  const arr = [...list];
  arr.sort((a,b)=>{
    let av,bv;
    switch(key){
      case 'ch': av=chLabel(a.channels[0]); bv=chLabel(b.channels[0]); break;
      case 'rubric': av=rubricOf(a.rubric).name; bv=rubricOf(b.rubric).name; break;
      case 'title': av=a.title; bv=b.title; break;
      case 'tone': av=toneAbbr(a.tone); bv=toneAbbr(b.tone); break;
      case 'status': av=statusLabel(a); bv=statusLabel(b); break;
      default: av=postWhen(a); bv=postWhen(b);
    }
    if(av<bv) return -1*mul; if(av>bv) return 1*mul; return 0;
  });
  return arr;
}

function renderFeed(){
  const pillsBase = getFilteredForPills();
  const cAll = pillsBase.length;
  const cDraft = pillsBase.filter(p=>p.status==='draft').length;
  const cReview = pillsBase.filter(p=>p.status==='review').length;
  const cSched = pillsBase.filter(p=>p.status==='scheduled').length;
  const cErr = pillsBase.filter(p=>p.status==='error').length;

  const filtered = getFilteredPosts();
  const sorted = sortPosts(filtered);
  const totalPages = Math.max(1, Math.ceil(sorted.length/UI.pageSize));
  UI.page = clamp(UI.page,1,totalPages);
  const pageItems = sorted.slice((UI.page-1)*UI.pageSize, UI.page*UI.pageSize);

  const chConnected = state.channels.filter(c=>c.phase===1 && c.connected).length;

  const rubricOpts = state.rubrics.map(r=>`<option value="${r.id}" ${UI.filters.rubric===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  const toneOpts = state.tones.map(t=>`<option value="${t.id}" ${UI.filters.tone===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const chOpts = CHANNEL_DEFS.map(c=>`<option value="${c.id}" ${UI.filters.ch===c.id?'selected':''}>${esc(c.name)}</option>`).join('');

  const canCreate = can(state,'post.create');
  const canBulkApprove = can(state,'post.approve');
  const canBulkSchedule = can(state,'post.schedule');

/* ---------- post card (view + state machine actions) ---------- */
function findPost(id){ return state.posts.find(p=>p.id===id); }
function renderPostCardModal(payload){
  const p = findPost(payload.id);
  if(!p) return `<div class="modal"><div class="modal-body">Пост не найден.</div></div>`;
  const r = rubricOf(p.rubric), t = toneOf(p.tone);
  const primaryCh = p.channels[0];
  const limit = CH_LIMITS[primaryCh] || 4096;
  const len = p.text.length;
  const canEdit = can(state,'post.edit');
  const canSubmit = can(state,'post.submit');
  const canApprove = can(state,'post.approve');
  const canSchedule = can(state,'post.schedule');
  const canArchive = can(state,'post.archive');
  const canDelete = can(state,'post.delete');

  let actions = '';
  if(p.status==='draft'){
    actions = btnRow([
      act('Отправить на согласование', 'submitreview', p.id, canSubmit, 'primary'),
      act('Редактировать', 'editpost', p.id, canEdit),
      act('Архивировать', 'archivepost', p.id, canArchive),
    ]);
  } else if(p.status==='review'){
    actions = `<div style="display:flex; flex-direction:column; gap:8px;">
      ${btnRow([
        act('Одобрить', 'approvepost', p.id, canApprove, 'primary'),
        act('На доработку', 'reworkpost', p.id, canApprove),
        act('Отклонить', 'rejectpost', p.id, canApprove, 'danger'),
      ])}
      ${!canApprove ? `<div class="disabled-note">Одобрять и отклонять может Главред или Администратор.</div>` : ''}
    </div>`;
  } else if(p.status==='rework'){
    actions = btnRow([ act('Открыть и переработать', 'editpost', p.id, canEdit, 'primary') ]);
  } else if(p.status==='rejected'){
    actions = btnRow([ act('Вернуть в черновик', 'backtodraft', p.id, canEdit, 'primary') ]);
  } else if(p.status==='approved'){
    actions = btnRow([
      act('Запланировать', 'openschedule', p.id, canSchedule, 'primary'),
      act('Опубликовать сейчас', 'publishnow', p.id, canSchedule),
      act('Редактировать', 'editpost', p.id, canEdit),
    ]);
  } else if(p.status==='scheduled'){
    const conflicts = slotConflicts(state, p, p.scheduledAt);
    actions = `<div style="display:flex; flex-direction:column; gap:8px;">
      ${btnRow([
        act('Опубликовать сейчас', 'publishnow', p.id, canSchedule, 'primary'),
        act('Изменить время', 'openschedule', p.id, canSchedule),
        act('Архивировать', 'archivepost', p.id, canArchive),
      ])}
      ${conflicts.length ? `<div class="disabled-note" style="color:var(--bad);">Конфликт слота: на этот канал и время уже стоит «${esc(conflicts[0].title)}».</div>` : ''}
    </div>`;
  } else if(p.status==='error'){
    actions = `<div style="display:flex; flex-direction:column; gap:8px;">
      <div class="disabled-note" style="color:var(--bad); font-weight:700;">${esc(p.errorReason||'')} · попыток: ${p.attempts}${p.needsAttention?' · автоповторы остановлены':''}</div>
      ${btnRow([ act('Повторить', 'publishnow', p.id, canSchedule, 'primary'), act('Архивировать', 'archivepost', p.id, canArchive) ])}
    </div>`;
  } else if(p.status==='published'){
    actions = btnRow([ act('Архивировать', 'archivepost', p.id, canArchive) ]);
  } else if(p.status==='archived'){
    actions = btnRow([ act('Удалить безвозвратно', 'deletepost', p.id, canDelete, 'danger') ]);
  }

  const historyHtml = p.history.slice().reverse().map(h=>`<div class="history-item"><b>${esc(STATUS_META[h.status]?STATUS_META[h.status].label:h.status)}</b> — ${fmtDT(h.at)} · ${esc(h.by)}${h.note?`<div class="comment-box">${esc(h.note)}</div>`:''}</div>`).join('');
  const commentsHtml = p.comments.length ? p.comments.map(c=>`<div class="comment-box"><b>${esc(c.by)}</b> (${c.type==='rework'?'на доработку':'отклонение'}), ${fmtDT(c.at)}<br>${esc(c.text)}</div>`).join('') : '<div class="mini-note">Комментариев нет.</div>';

  return `<div class="modal wide">
    <div class="modal-head">
      <div class="modal-title">${esc(p.title)}</div>
      <span class="badge" style="border-color:${statusColor(p)}; color:${statusColor(p)};">${esc(statusLabel(p))}</span>
      <button class="modal-close" data-act="closemodal">${ICO.x}</button>
    </div>
    <div class="modal-body">
      ${postThumb(p,'card')}
      <div class="kv">
        <div class="k">Каналы</div><div>${p.channels.map(c=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px;">${chLogo(c)}${esc(chLabel(c))}</span>`).join('')}</div>
        <div class="k">Рубрика</div><div>${esc(r?r.name:'')}</div>
        <div class="k">Тональность</div><div>${esc(t?t.name:'')}</div>
        <div class="k">Дата/время</div><div class="mono">${p.scheduledAt?fmtDT(p.scheduledAt):(p.publishedAt?fmtDT(p.publishedAt):'—')}</div>
        <div class="k">Автор</div><div>${esc(p.history[0]?p.history[0].by:'—')}</div>
      </div>
      <div class="grid2" style="align-items:start;">
        <div>

          <div class="qpreview">${esc(p.text)}</div>
        </div>
        <div>
          <div class="k" style="margin-bottom:4px;">Превью · ${esc(chLabel(primaryCh))}</div>
          <div class="qpreview" style="max-height:220px; overflow:auto;">${esc(p.text)}</div>
          <div class="limit-txt ${len>limit?'over':''}">${len} / ${limit} символов${len>limit?' — превышение лимита канала':''}</div>
        </div>
      </div>
      <div class="grid2" style="align-items:start;">
        <div>
          <div class="k" style="margin-bottom:4px;">История статусов</div>
          ${historyHtml}
        </div>
        <div>
          <div class="k" style="margin-bottom:4px;">Комментарии согласующего</div>
          ${commentsHtml}
        </div>
      </div>
    </div>
    <div class="modal-foot">${actions}</div>
  </div>`;
}
function act(label, action, id, enabled, kind){
  const cls = 'btn'+(kind==='primary'?' btn-primary':kind==='danger'?' btn-danger':'');
  return enabled ? `<button class="${cls}" data-act="${action}" data-id="${id}">${esc(label)}</button>`
                 : `<button class="${cls}" disabled title="Недоступно для роли ${esc(roleName(state.currentRole))}">${esc(label)}</button>`;
}
function btnRow(list){ return `<div style="display:flex; gap:8px; flex-wrap:wrap;">${list.join('')}</div>`; }

function renderPostEditModal(payload){
  const editing = !!payload.id;
  const p = editing ? findPost(payload.id) : null;
  const title = p ? p.title : '';
  const text = p ? p.text : '';
  const rubric = p ? p.rubric : state.rubrics[0].id;
  const tone = p ? p.tone : state.tones[0].id;
  const postType = p ? p.postType : POST_TYPE_DEFS[0].id;
  const channels = p ? p.channels : [CHANNEL_DEFS[0].id];
  const d = p && p.scheduledAt ? new Date(p.scheduledAt) : null;
  const dateVal = d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : '';

function renderMultichannel(){

  const p = findPost(UI.mcSourceId);

  const addOpts = CHANNEL_DEFS.filter(c=>!p.channels.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');

  const versions = p.channels.map(chId=>{
    const ch = CH_BY_ID[chId];
    const limit = CH_LIMITS[chId] || 4096;
    const val = p.adaptations[chId] != null ? p.adaptations[chId] : p.text;
    const over = val.length > limit;

    let extraWarn = '';
    if(chId==='vk' && (hashN<5 || hashN>7)) extraWarn = `<div class="limit-txt over">Хештегов ${hashN}, для VK нужно 5–7</div>`;
    return `<div style="border:1px solid var(--line); border-radius:var(--r-md); padding:10px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">

        <span class="mini-note">лимит ${limit}</span>
      </div>
      <textarea class="textarea" rows="7" data-live="mcedit" data-ch="${chId}">${esc(val)}</textarea>
      <div class="limit-bar ${over?'over':''}"><i style="width:${Math.min(100,val.length/limit*100)}%;"></i></div>
      <div class="limit-txt ${over?'over':''}">${val.length} / ${limit}${over?' — превышение':''}</div>
      ${extraWarn}

  }).join('');

  return head + `<div style="padding:16px 20px; display:flex; flex-direction:column; gap:14px; overflow:auto; flex:1;">

      <div>
        <div class="k" style="margin-bottom:4px;">Исходник</div>
        <div class="qpreview" style="min-height:220px;">${esc(p.text)}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:14px;">${versions}</div>
    </div>
  </div>`;
}

function calendarPosts(){ return state.posts.filter(p=>p.status==='scheduled' || p.status==='published'); }
function renderCalendar(){
  const isWeek = UI.calView==='week';
  const dayCount = isWeek ? 7 : 28;
  const start = isWeek ? UI.calAnchor : startOfWeek(UI.calAnchor);
  const dayLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const posts = calendarPosts();
  const channelsRows = CHANNEL_DEFS.filter(c=>c.phase===1).concat(CHANNEL_DEFS.filter(c=>c.phase===2));

  let cols = `108px repeat(${dayCount}, minmax(${isWeek?130:74}px,1fr))`;
  let head = `<div class="cal-row-label" style="border-bottom:1px solid var(--line);">Канал</div>`;
  const dayTs = [];
  for(let i=0;i<dayCount;i++){
    const ts = start + days(i);
    dayTs.push(ts);
    const d = new Date(ts);
    const today = sameDay(ts, Date.now());
    head += `<div class="cal-head-cell" style="${today?'background:color-mix(in srgb, var(--blue) 16%, var(--paper));color:var(--ink);':''}">${dayLabels[(d.getDay()+6)%7]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}</div>`;
  }
  let body = '';
  channelsRows.forEach(ch=>{
    body += `<div class="cal-row-label"><span style="width:8px;height:8px;border-radius:50%;background:${ch.color};display:inline-block;"></span>${esc(ch.name)}</div>`;
    dayTs.forEach(ts=>{
      const dayPosts = posts.filter(p=>p.channels.includes(ch.id) && sameDay(p.publishedAt||p.scheduledAt, ts));
      const cellId = `${ch.id}__${ts}`;
      body += `<div class="cal-cell ${sameDay(ts,Date.now())?'today':''}" data-cell="${cellId}" data-ch="${ch.id}" data-ts="${ts}">
        ${dayPosts.map(p=>{
          const conflict = slotConflicts(state,p,p.scheduledAt||p.publishedAt).length>0;
          return `<div class="cal-chip ${conflict?'conflict':''}" style="border-left-color:${statusColor(p)};" draggable="true" data-dragid="${p.id}" data-act="openpost" data-id="${p.id}" title="${esc(p.title)} · ${fmtTime(p.publishedAt||p.scheduledAt)}">${postThumb(p,'xs')}<span style="flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${fmtTime(p.publishedAt||p.scheduledAt)} ${esc(p.title)}</span></div>`;
        }).join('')}
      </div>`;
    });
  });

  return `<div class="view-head"><div class="view-head-row">
      <div class="view-title">Контент-календарь</div>
      <div class="view-sub">Строки — каналы, ячейки — слоты · перетащите карточку на другой день</div>
      <div class="view-tools">
        <div class="pills"><div class="pill ${isWeek?'active':''}" data-act="calview" data-view="week">Неделя</div><div class="pill ${!isWeek?'active':''}" data-act="calview" data-view="month">Месяц</div></div>
        <button class="icon-btn" data-act="calnav" data-dir="-1">‹</button>
        <button class="btn btn-sm" data-act="caltoday">Сегодня</button>
        <button class="icon-btn" data-act="calnav" data-dir="1">›</button>
      </div>
    </div></div>
    <div style="padding:16px 20px; overflow:auto; flex:1;">
      <div class="cal-grid" style="grid-template-columns:${cols};">${head}${body}</div>
    </div>`;
}

/* ============================================================
   §19 ORM — лента упоминаний
   ============================================================ */
const MSTATUS_META = {
  new:{label:'Новое', tone:'blue'}, inprogress:{label:'В работе', tone:'orange'},
  done:{label:'Отработано', tone:'green'}, escalated:{label:'Эскалация', tone:'red'},
};
function isOverdue(m){ return (m.status==='new'||m.status==='inprogress') && Date.now() > m.at + m.slaMin*60000; }
function sourceMeta(id){ return MENTION_SOURCES.find(s=>s.id===id) || {label:id, color:'#999'}; }
function catName(id){ const o=state.objections.find(o=>o.id===id); return o?o.name:id; }
function renderMentions(){
  const canManage = can(state,'orm.manage');
  const cat = UI.filters.mcat||''; const st = UI.filters.mstatus||'';
  let list = state.mentions.filter(m=> (!cat || m.categories.includes(cat)) && (!st || m.status===st));
  list = list.slice().sort((a,b)=>b.at-a.at);
  const catOpts = state.objections.map(o=>`<option value="${o.id}" ${cat===o.id?'selected':''}>${esc(o.name)}</option>`).join('');
  const stOpts = Object.entries(MSTATUS_META).map(([k,v])=>`<option value="${k}" ${st===k?'selected':''}>${esc(v.label)}</option>`).join('');
  const overdueN = state.mentions.filter(isOverdue).length;
  const head = `<div class="view-head"><div class="view-head-row">
      <div class="view-title">Лента упоминаний</div>

/* ---------- mention detail ---------- */
function findMention(id){ return state.mentions.find(m=>m.id===id); }
function highlightKeywords(text, keywords){
  let out = esc(text);
  keywords.forEach(k=>{ const e = esc(k); out = out.split(e).join(`<span class="hl">${e}</span>`); });
  return out;
}
function renderMentionDetail(){
  const id = UI.route.split('/')[1];
  const m = findMention(id);
  if(!m) return `<div class="empty-state">Упоминание не найдено. <button class="btn" data-act="opennav" data-id="mentions">К ленте</button></div>`;
  const canManage = can(state,'orm.manage');
  const tab = UI.mcTab || 'official';
  const deadline = m.at + m.slaMin*60000;
  const remain = deadline - Date.now();
  const slaTxt = remain>=0 ? `SLA ${fmtTime(Date.now()+remain)} · осталось ${Math.floor(remain/60000)} мин` : `SLA просрочен на ${Math.abs(Math.floor(remain/60000))} мин`;
  const src = sourceMeta(m.source);
  const linkedPost = m.linkedPostId ? findPost(m.linkedPostId) : null;
  const text = tab==='official' ? m.officialText : m.crisisText;

  return `<div class="view-head"><div class="view-head-row">
      <div class="view-title">Упоминание ${esc(m.id)}</div>
      <div class="view-sub" style="color:${isOverdue(m)?'var(--bad)':'var(--ink-3)'}; font-weight:${isOverdue(m)?'700':'400'};">${slaTxt}</div>
      <div class="view-tools"><button class="btn" data-act="opennav" data-id="mentions">← К ленте упоминаний</button></div>
    </div></div>
  <div style="padding:16px 20px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:14px; max-width:900px;">
    <div class="kv">
      <div class="k">Источник</div><div style="display:flex; align-items:center; gap:7px;"><span style="width:8px;height:8px;border-radius:50%;background:${src.color};display:inline-block;"></span>${esc(src.label)}</div>
      <div class="k">Автор</div><div>${esc(m.author)} · ${fmtDateLong(m.at)}, ${fmtTime(m.at)}</div>
      <div class="k">Ключевые слова</div><div>${m.keywords.map(k=>`<span class="kbtag">${esc(k)}</span>`).join('') || '<span class="mini-note">не найдены</span>'}</div>
      <div class="k">Категория</div><div>${m.categories.map(catName).join(' + ')}</div>
      <div class="k">Отработка</div><div>
        <select class="dd" data-act="mstatus" data-id="${m.id}" ${canManage?'':'disabled'}>
          ${Object.entries(MSTATUS_META).map(([k,v])=>`<option value="${k}" ${m.status===k?'selected':''}>${esc(v.label)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="qpreview" style="font-size:15px;">${highlightKeywords(m.text, m.keywords)}</div>
    ${linkedPost ? `<div class="disabled-note">Из этого упоминания уже создан пост: <a href="#" data-act="openpost" data-id="${linkedPost.id}">${esc(linkedPost.title)}</a></div>` : ''}
    <div class="tabs">
      <div class="tab ${tab==='official'?'active':''}" data-act="mtab" data-tab="official">Официальный ответ поддержки</div>
      <div class="tab ${tab==='crisis'?'active':''}" data-act="mtab" data-tab="crisis">Антикризисный экспертный пост</div>
    </div>
    <div>
      <textarea class="textarea" id="orm-text" rows="9" style="max-width:900px;">${esc(text)}</textarea>
      <div class="limit-txt ${text.length>limit?'over':''}">${text.length} / ${limit}</div>

    <div style="display:flex; gap:8px; flex-wrap:wrap;">

}

/* УВЕДОМЛЕНИЯ — это не лента истории.
   Раньше здесь просто перечислялись все переходы статусов: сто строк, в которых
   ничего не требует действия. Уведомление обязано отвечать на два вопроса —
   что сломалось и куда нажать. Поэтому каждое несёт важность, объект и переход.
   Прочитанные помечаются в localStorage (kz_seen), иначе счётчик у колокольчика
   врёт после первой же перезагрузки. */
function buildNotifications(){
  const out = [];
  const seen = new Set(JSON.parse(localStorage.getItem('kz_seen') || '[]'));

  state.posts.forEach(p=>{
    if(p.status==='error'){
      const attempts = p.attempts || 1;
      out.push({
        id:'err_'+p.id, at: p.scheduledAt || p.createdAt, level: attempts>=3?'crit':'warn',
        title: attempts>=3 ? 'Публикация не удалась · нужна помощь' : 'Ошибка публикации',
        body: p.title, note: p.errorReason || 'причина не записана',
        action:'Открыть пост', route:'feed', postId:p.id,
      });
    }
    if(p.status==='review'){
      out.push({ id:'rev_'+p.id, at: p.createdAt, level:'info',
        title:'Ждёт согласования', body:p.title, note:'нужен главред',
        action:'Открыть', route:'feed', postId:p.id });
    }
  });

  state.mentions.forEach(m=>{
    if(isOverdue(m) && m.status!=='done'){
      out.push({ id:'sla_'+m.id, at: m.at + m.slaMin*60000, level:'crit',
        title:'Просрочен SLA · 30 минут', body:'Упоминание от '+m.author,
        note:(m.text||'').slice(0,80), action:'Отработать', route:'mention/'+m.id });
    }
  });

  state.channels.filter(c=>c.phase===1 && !c.connected).forEach(c=>{
    out.push({ id:'ch_'+c.id, at: Date.now(), level:'warn',
      title:'Канал не подключён', body:c.name, note:'посты в этот канал не уйдут',
      action:'Настройки', route:'settings' });
  });

  state.bots.filter(b=>b.status!=='online').forEach(b=>{
    out.push({ id:'bot_'+b.id, at: Date.now(), level:'warn',
      title:'Бот офлайн', body:b.name, note:b.desc||'', action:'Настройки', route:'settings' });
  });

  out.sort((a,b)=> (a.level===b.level ? b.at-a.at : (a.level==='crit'?-1:b.level==='crit'?1:a.level==='warn'?-1:1)));
  out.forEach(n=> n.unread = !seen.has(n.id));
  return out;
}
function unreadCount(){ return buildNotifications().filter(n=>n.unread).length; }
function markAllSeen(){
  localStorage.setItem('kz_seen', JSON.stringify(buildNotifications().map(n=>n.id)));
}
function renderNotifications(){
  const items = buildNotifications();
  markAllSeen();
  const head = `<div class="view-head"><div class="view-head-row"><div class="view-title">Уведомления</div>
    <div class="view-sub">Только то, что требует действия</div></div></div>`;
  if(!items.length) return head + `<div class="empty-state"><div class="big">Всё спокойно</div>
    <div class="sub">Просрочек нет, каналы на связи, публикации проходят.</div></div>`;
  return head + `<div class="notif-list">` + items.map(n=>`
    <div class="notif ${n.level}" data-act="opennotif" data-route="${esc(n.route)}" ${n.postId?`data-post="${n.postId}"`:''}>
      <div class="notif-main">
        <div class="notif-title">${esc(n.title)}</div>

}

function currentPageItems(){
  const filtered = getFilteredPosts();
  const sorted = sortPosts(filtered);
  const totalPages = Math.max(1, Math.ceil(sorted.length/UI.pageSize));
  UI.page = clamp(UI.page,1,totalPages);
  return sorted.slice((UI.page-1)*UI.pageSize, UI.page*UI.pageSize);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Скопировано в буфер','ok')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Скопировано в буфер','ok'); }catch(e){ toast('Не удалось скопировать','err'); }
  document.body.removeChild(ta);
}
function storyboardAsText(s){
  let out = `Сценарий: ${s.topic}\n${s.audience} · ${s.emotion} · ${s.duration} сек · ${s.totalWords} слов\n\n`;
  s.scenes.forEach(sc=>{
    out += `Сцена ${sc.n} (${sc.sec} сек)\nКадр/видеоряд: ${sc.shot}\nГолос: ${sc.voice}\nТекст на экране: ${sc.onscreen}\nАудио/SFX: ${sc.sfx}\n\n`;
  });
  return out;
}

  genpost(){
