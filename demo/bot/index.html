<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бот-калькулятор — демо Solutions101</title>
<style>
  :root{
    --bg:#0e202d; --text:#F2F7F5; --soft:rgba(242,247,245,.72);
    --accent:#7FD8FF; --warm:#ff6b5e; --panel:#132937; --border:rgba(242,247,245,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    min-height:100vh; padding-top:56px;
  }
  header{
    position:fixed; top:0; left:0; right:0; height:56px; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; background:rgba(14,32,45,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  header .brand{font-weight:600; font-size:14px; letter-spacing:.02em}
  header a{color:var(--soft); font-size:14px; text-decoration:none}
  header a:hover{color:var(--accent)}

  main{
    max-width:960px; margin:0 auto; padding:28px 16px 60px;
    display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; justify-content:center;
  }

  /* phone frame */
  .phone{
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid var(--border); border-radius:20px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .chat-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--accent);
    color:#0e202d; font-weight:700; font-size:12px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .chat-head .name{font-size:14px; font-weight:600}
  .chat-head .status{font-size:12px; color:var(--soft)}

  .chat-body{
    height:440px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width:82%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.45;
    white-space:pre-wrap;
  }
  .bubble.bot{
    align-self:flex-start; background:#0e202d; border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .bubble.client{
    align-self:flex-end; background:rgba(127,216,255,.15); border:1px solid rgba(127,216,255,.35);
    border-bottom-right-radius:4px;
  }
  .bubble .actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .bubble button.opt{
    background:transparent; border:1px solid var(--accent); color:var(--accent);
    border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .bubble button.opt:hover{background:rgba(127,216,255,.12)}
  .bubble button.opt.warm{border-color:var(--warm); color:var(--warm)}
  .bubble button.opt.warm:hover{background:rgba(255,107,94,.12)}
  .bubble button.opt:disabled{opacity:.4; cursor:default}

  .typing{align-self:flex-start; display:flex; gap:4px; padding:12px 14px;
    background:#0e202d; border:1px solid var(--border); border-radius:14px; border-bottom-left-radius:4px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--soft); animation:blink 0.9s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .chips{padding:12px 16px; display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--border)}
  .chip{
    text-align:left; background:transparent; border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:9px 12px; font-size:13px; cursor:pointer;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .chip:disabled{opacity:.35; cursor:default}
  .reset-row{padding:0 16px 14px; display:flex; justify-content:flex-end}
  .reset-row button{
    background:transparent; border:1px solid var(--border); color:var(--soft);
    border-radius:10px; padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .reset-row button:hover{color:var(--warm); border-color:var(--warm)}

  /* price panel */
  .price-panel{
    width:100%; max-width:340px; background:var(--panel); border:1px solid var(--border);
    border-radius:16px; overflow:hidden;
  }
  .price-panel summary{
    list-style:none; cursor:pointer; padding:14px 16px; font-size:14px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
  }
  .price-panel summary::-webkit-details-marker{display:none}
  .price-panel summary .arrow{transition:transform .2s; color:var(--soft)}
  .price-panel[open] summary .arrow{transform:rotate(90deg)}
  .price-panel table{width:100%; border-collapse:collapse; font-size:13px}
  .price-panel td{padding:8px 16px; border-top:1px solid var(--border)}
  .price-panel td:last-child{text-align:right; color:var(--accent); white-space:nowrap}
  .price-panel .note{padding:10px 16px 14px; font-size:11px; color:var(--soft)}

  .toast{
    position:fixed; right:16px; bottom:16px; background:var(--panel); border:1px solid var(--accent);
    color:var(--text); padding:10px 16px; border-radius:12px; font-size:13px;
    transform:translateY(20px); opacity:0; transition:all .25s; z-index:20;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{transform:translateY(0); opacity:1}

  @media (max-width:480px){
    .chat-body{height:380px}
  }
</style>
</head>
<body>

<header>
  <span class="brand">Solutions101 · демо</span>
  <a href="/v2.html">← на сайт</a>
</header>

<main>
  <div class="phone">
    <div class="chat-head">
      <div class="avatar">S101</div>
      <div>
        <div class="name">Бот-калькулятор</div>
        <div class="status">считает по прайсу компании</div>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chips" id="chips"></div>
    <div class="reset-row"><button id="resetBtn">Сбросить</button></div>
  </div>

  <details class="price-panel" open>
    <summary>Прайс компании (демо-данные) <span class="arrow">›</span></summary>
    <table id="priceTable"></table>
    <div class="note">Цены условные, для демонстрации сценария</div>
  </details>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  var PRICE = [
    {id:'proflist', name:'профлист С8', unit:'м²', price:520},
    {id:'screws', name:'саморезы', unit:'шт', price:3.2},
    {id:'delivery', name:'доставка по городу', unit:'', price:1500},
    {id:'pipe', name:'труба профильная', unit:'м', price:210},
    {id:'insulation', name:'утеплитель', unit:'м²', price:380},
    {id:'install', name:'монтаж кровли', unit:'м²', price:650}
  ];

  var fmt = function(n){ return n.toLocaleString('ru-RU'); };

  var priceTable = document.getElementById('priceTable');
  PRICE.forEach(function(p){
    var row = document.createElement('tr');
    var priceText = p.unit ? fmt(p.price) + ' ₽/' + p.unit : fmt(p.price) + ' ₽';
    row.innerHTML = '<td>'+p.name+'</td><td>'+priceText+'</td>';
    priceTable.appendChild(row);
  });

  var chatBody = document.getElementById('chatBody');
  var chipsBox = document.getElementById('chips');
  var toastEl = document.getElementById('toast');
  var orderNo = 1042;

  function scrollDown(){ chatBody.scrollTop = chatBody.scrollHeight; }

  function addBubble(text, who){
    var el = document.createElement('div');
    el.className = 'bubble ' + who;
    el.textContent = text;
    chatBody.appendChild(el);
    scrollDown();
    return el;
  }

  function showTyping(cb){
    var el = document.createElement('div');
    el.className = 'typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(el);
    scrollDown();
    setTimeout(function(){
      el.remove();
      cb();
    }, 900);
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 3000);
  }

  function addBotOptions(text, onYes, onHuman){
    var el = addBubble(text, 'bot');
    var actions = document.createElement('div');
    actions.className = 'actions';
    var yes = document.createElement('button');
    yes.className = 'opt'; yes.textContent = 'Да';
    var human = document.createElement('button');
    human.className = 'opt warm'; human.textContent = 'Позвать человека';
    actions.appendChild(yes); actions.appendChild(human);
    el.appendChild(actions);
    yes.onclick = function(){
      yes.disabled = true; human.disabled = true;
      onYes();
    };
    human.onclick = function(){
      yes.disabled = true; human.disabled = true;
      onHuman();
    };
  }

  function callHuman(){
    showTyping(function(){
      addBubble('Передал менеджеру Ирине — ответит в течение 15 минут.', 'bot');
    });
  }

  var SCENARIOS = [
    {
      chip: 'Сколько стоит 40 м² профлиста с доставкой?',
      run: function(){
        var proflist = PRICE.find(function(p){return p.id==='proflist';});
        var delivery = PRICE.find(function(p){return p.id==='delivery';});
        var sum1 = 40 * proflist.price;
        var total = sum1 + delivery.price;
        var text = '40 м² × ' + fmt(proflist.price) + ' ₽ = ' + fmt(sum1) + ' ₽ · доставка ' +
          fmt(delivery.price) + ' ₽ · итого ' + fmt(total) + ' ₽. Оформить заявку?';
        addBotOptions(text, function(){
          showTyping(function(){
            addBubble('Заявка №' + (orderNo++) + ' создана и передана в CRM.', 'bot');
            toast('→ CRM: новая сделка');
          });
        }, callHuman);
      }
    },
    {
      chip: 'Нужно 200 саморезов и 10 м² профлиста',
      run: function(){
        var proflist = PRICE.find(function(p){return p.id==='proflist';});
        var screws = PRICE.find(function(p){return p.id==='screws';});
        var sum1 = 200 * screws.price;
        var sum2 = 10 * proflist.price;
        var total = sum1 + sum2;
        var text = '200 шт × ' + fmt(screws.price) + ' ₽ = ' + fmt(sum1) + ' ₽ · 10 м² × ' +
          fmt(proflist.price) + ' ₽ = ' + fmt(sum2) + ' ₽ · итого ' + fmt(total) + ' ₽. Оформить заявку?';
        addBotOptions(text, function(){
          showTyping(function(){
            addBubble('Заявка №' + (orderNo++) + ' создана и передана в CRM.', 'bot');
            toast('→ CRM: новая сделка');
          });
        }, callHuman);
      }
    },
    {
      chip: 'Работаете в выходные?',
      run: function(){
        var text = 'Да, работаем ежедневно с 9:00 до 20:00, включая выходные. Могу сразу посчитать заказ или соединить с менеджером?';
        addBotOptions(text, function(){
          showTyping(function(){
            addBubble('Хорошо, опишите, что нужно посчитать — количество и материал.', 'bot');
          });
        }, callHuman);
      }
    }
  ];

  var chipButtons = [];

  function buildChips(){
    chipsBox.innerHTML = '';
    chipButtons = [];
    SCENARIOS.forEach(function(s){
      var btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = s.chip;
      btn.onclick = function(){
        addBubble(s.chip, 'client');
        showTyping(s.run);
      };
      chipsBox.appendChild(btn);
      chipButtons.push(btn);
    });
  }

  function initChat(){
    chatBody.innerHTML = '';
    addBubble('Здравствуйте! Посчитаю стоимость по прайсу компании — выберите вопрос ниже или напишите свой.', 'bot');
  }

  document.getElementById('resetBtn').onclick = function(){
    initChat();
  };

  buildChips();
  initChat();
})();
</script>
</body>
</html>
