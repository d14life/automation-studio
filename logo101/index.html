<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const PHONE = innerWidth < 700
const canvas = document.getElementById('c')
const stat = document.getElementById('stat')
const slider = document.getElementById('d')
const errBox = document.getElementById('err')
const fail = (m) => { errBox.style.display = 'grid'; errBox.textContent = m; console.error(m) }

/* ── WHAT ACTUALLY MAKES REAL-TIME METAL LOOK EXPENSIVE ──────────────────────
   Not polygons and not the material sliders. Metal has no colour of its own -
   it is ONLY a reflection of its surroundings, so a metal object in an empty
   scene renders as a dark smear no matter how the roughness is tuned. That is
   precisely why the helix looked cheap: three lights and nothing to reflect.

   So the environment is built here rather than downloaded: a small equirect
   painted with a studio's worth of light - a bright soft ceiling, two hard strips
   standing in for softboxes, a cool rim behind, a dark floor - run through
   PMREMGenerator. 64x32 pixels of data buys the thing that was missing. */
function studioEnv(renderer) {
  const W = 256, H = 128
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H
  const g = cv.getContext('2d')

  const sky = g.createLinearGradient(0, 0, 0, H)
  sky.addColorStop(0.00, '#eaf4ff')   /* ceiling bounce, brighter - the mark had nothing to catch */
  sky.addColorStop(0.42, '#5f8299')
  sky.addColorStop(0.55, '#16303f')
  sky.addColorStop(1.00, '#050c12')   /* dark floor, so the underside stays weighty */
  g.fillStyle = sky; g.fillRect(0, 0, W, H)

  /* two hard sources: the specular streaks that draw the edges of the letterforms */
  const softbox = (x, y, w, h, c) => {
    const r = g.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, Math.max(w, h) / 2)
    r.addColorStop(0, c); r.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = r; g.fillRect(x, y, w, h)
  }
  /* TWO TEMPERATURES, NOT ONE. Every reflection on the mark used to be the same
     cold blue, which is why it read as flat black no matter how bright the lights
     got: an object with one colour in its environment has one colour on its
     surface. A warm key against a cold fill is the oldest trick in product
     photography and it is what makes metal look like metal - the eye reads the
     TEMPERATURE SHIFT across a curve as form. */
  softbox(W * 0.04, H * 0.00, W * 0.34, H * 0.40, 'rgba(255,255,255,1)')      /* hard white key */
  softbox(W * 0.20, H * 0.06, W * 0.24, H * 0.26, 'rgba(255,214,170,0.95)')   /* warm bounce beside it */
  softbox(W * 0.63, H * 0.06, W * 0.28, H * 0.30, 'rgba(175,220,255,0.95)')   /* cold fill opposite */
  softbox(W * 0.42, H * 0.48, W * 0.36, H * 0.24, 'rgba(90,190,255,0.70)')    /* cold rim from behind */
  softbox(W * 0.86, H * 0.40, W * 0.20, H * 0.24, 'rgba(255,150,90,0.55)')    /* warm kicker, far side */

  const tex = new THREE.CanvasTexture(cv)
  tex.mapping = THREE.EquirectangularReflectionMapping
  tex.colorSpace = THREE.SRGBColorSpace
  const pmrem = new THREE.PMREMGenerator(renderer)
  const env = pmrem.fromEquirectangular(tex).texture
  pmrem.dispose(); tex.dispose()
  return env
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !PHONE })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.toneMapping = THREE.ACESFilmicToneMapping   /* highlights roll off instead of clipping */
renderer.toneMappingExposure = 1.06
renderer.outputColorSpace = THREE.SRGBColorSpace

const scene = new THREE.Scene()
scene.environment = studioEnv(renderer)
/* no background yet, by his instruction - the object is what is being judged */
scene.background = new THREE.Color(0x0e202d)

const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 60)
const root = new THREE.Group()
scene.add(root)

/* a key light on top of the environment, only to sharpen the bevel highlights */
/* SOFT. Three directionals at 2.4/3.0/1.5 put a hard mirror highlight on every
   one of the ~500 fracture facets, and a surface covered in mirror highlights is
   the definition of shiny. Rock is lit mostly by the room; the directionals are
   now shaping light, not the light. */
const key  = new THREE.DirectionalLight(0xfff1e0, 1.05); key.position.set(-3, 4, 5)
const rim  = new THREE.DirectionalLight(0x7FD8FF, 0.85); rim.position.set(4, -1, -4)
const kick = new THREE.DirectionalLight(0xff9a5c, 0.30); kick.position.set(5, 2, 2)
scene.add(new THREE.HemisphereLight(0x9fc6dd, 0x0b1a24, 1.25))
scene.add(key, rim, kick)

/* REAL ROCK MAPS, projected triplanar. The fractured pieces have no UVs - bisect
   makes new faces and there is nothing sensible to unwrap - so the texture is
   projected from world position on all three axes and blended by the normal. That
   is the standard answer for procedurally cut geometry and it costs three samples. */
const texLoader = new THREE.TextureLoader()
const rockTex = (f) => { const t = texLoader.load('./tex/' + f); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t }
const uniforms = {
  uRock:  { value: rockTex('rock_color.jpg') },
  uRough: { value: rockTex('rock_rough.jpg') },
  uNormal:{ value: rockTex('rock_normal.jpg') },   /* was on the server, never loaded */
  uDamage: { value: 0 },
  uMorph:  { value: 0 },   /* 0 = the mark is 101, 1 = the swarm has become Solutions */
  uSpin:   { value: 0 },
  uMinY:   { value: -1 },
  uMaxY:   { value: 1 },
}

/* ── THE SKIN AND WHAT IS UNDER IT ───────────────────────────────────────────
   Blender marked every face: on the original surface = skin, created by a cut =
   inside. That distinction is the whole idea, so the two get genuinely different
   materials rather than two shades of the same one.

   The skin is near-black metal that exists only as reflection. The core is not
   metal at all - it is emissive, and it is DIM until the piece it belongs to
   starts moving. Nothing glows while the mark is whole; the light is what the
   skin was hiding. */
/* MeshPhysicalMaterial, and the clearcoat is the reason. A single glossy layer
   gives one specular; clearcoat gives TWO - a tight bright one from the lacquer
   sitting over a broader softer one from the metal underneath. That doubled
   highlight is most of what separates a rendered product shot from a shiny shape.
   Iridescence adds a thin-film colour shift at grazing angles, so the edges of
   the letterforms pick up colour instead of dying into the background. */
const skinMat = new THREE.MeshPhysicalMaterial({
  /* STONE IS A DIELECTRIC. metalness plus clearcoat plus thin-film iridescence is
     the recipe for a polished glass bead, which is exactly what it looked like: no
     metal in rock, no lacquer on it, no oil-slick colour shift at its edges. And the
     base colour was near-black, so an albedo map multiplied into it had nothing to
     show. Mid grey, roughness fully driven by the map. */
  color: 0x6d757a, metalness: 0.0, roughness: 1.0, envMapIntensity: 0.55,
})

function patch(mat, isCore) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, uniforms)
    sh.vertexShader = `
      attribute vec3 aCenter; attribute vec3 aSeed; attribute vec3 aPartner; attribute float aTone; attribute float aWord;
      uniform float uDamage, uMorph, uSpin, uMinY, uMaxY;
      varying float vT; varying float vTone; varying float vFade; varying vec3 vLocalN; varying vec3 vWorld;
      mat3 axisRot(vec3 a, float ang){
        float c=cos(ang), s=sin(ang), o=1.0-c;
        return mat3(c+a.x*a.x*o, a.x*a.y*o-a.z*s, a.x*a.z*o+a.y*s,
                    a.y*a.x*o+a.z*s, c+a.y*a.y*o, a.y*a.z*o-a.x*s,
                    a.z*a.x*o-a.y*s, a.z*a.y*o+a.x*s, c+a.z*a.z*o);
      }
    ` + sh.vertexShader

    /* THE BREAK TRAVELS: a piece's threshold falls with its height, so the mark
       opens from the top instead of detonating all at once.

       It lives in a FUNCTION, not in a snippet pasted twice. begin_vertex and
       beginnormal_vertex are injected into the same GLSL scope, so two copies of
       the same declarations is a redefinition error - which compiles to nothing
       and renders a black screen while the page reports no error worth reading.
       That cost the first run of this file. */
    sh.vertexShader = sh.vertexShader.replace('void main() {', `
      float breakT(vec3 c, float dmg, float lo, float hi){
        float h = clamp((c.y - lo) / max(hi - lo, 0.0001), 0.0, 1.0);
        float thr = (1.0 - h) * 0.5;
        return smoothstep(thr, thr + 0.5, dmg);
      }
      void main() {`)

    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      /* ONE SCROLL, TWO WORDS - and THIS is the line the whole effect hung on.
         aTarget was uploaded correctly for all 484 pieces and uMorph was reaching the
         shader, but transformed was still built from aCenter alone, so every piece
         flew outward and came straight back home. A ring.

         home TRAVELS: 101 at one end, a point sampled on the letterforms of
         "Solutions" at the other. The pieces cannot morph into the second word -
         different letters mean different topology - so they simply relocate, and the
         explosion rides on top of the journey rather than being the destination.

         Throw scaled to the mark rather than to a round number: 1.35 flung every piece
         off screen and ended the scroll on an empty frame. */
      /* aWord: 0 for the 101's pieces, 1 for Solutions'. Each word runs its OWN
         explosion - the 101 forward with the scroll, Solutions in reverse - so both
         ends are a genuinely solid fractured word, not a cloud shaped like one. */
      /* HALF THE SCROLL EACH, AND NO PLATEAU. Both words used to run their whole
         explosion across the whole scroll, which caused both faults at once: they
         were on screen together the entire time - so the 101's debris hung over the
         Solutions - and dmg was own*1.4, so past own 0.71 every piece was already
         fully broken and the remaining third of the scroll changed nothing. Just a
         big ring sitting there.

         Now 101 breaks over the FIRST half and is gone by the midpoint; Solutions
         assembles over the SECOND half from nothing. They never share the frame, and
         every scroll pixel moves something. */
      /* 1.61, not 2.0. At exactly 2.0 the two halves meet edge to edge: 101 finishes
         its explosion on the same frame Solutions starts, both sit at own=1, both are
         faded out, and the middle of the scroll is a blank screen. 1.61 stretches each
         word over ~62% of the travel so they OVERLAP in the middle third - the last of
         the 101 is still in the air while the first of Solutions arrives. */
      float own = min(mix(uMorph, 1.0 - uMorph, aWord) * 1.61, 1.0);
      float t = breakT(aCenter, own, uMinY, uMaxY);
      vT = t; vTone = aTone;
      /* NO ALPHA. Fading one word out while the other faded in is what made the middle
         read as a transition between two unrelated objects sitting in different places.
         A fragment now SHRINKS to nothing on the spot where the other word needs it,
         and grows from nothing on the spot the first word left - so the rubble is one
         continuous stream, not two piles. It also drops the material back to opaque,
         which is what was letting far fragments blend over near ones and look like
         slabs floating in front of the letters. */
      vFade = 1.0;
      /* THE MATE'S SCALE IS THE COMPLEMENT OF ITS PARTNER'S - that is the whole trick,
         and driving both off their own progress was the bug. Each word's own runs 0->1
         over its half, so at the crossover BOTH mates were deep into their swap and
         both shrank to nothing at the same moment: the frame emptied out however the
         curve was shaped, because two things going to zero together cannot conserve
         anything.

         k is now computed ONCE from the global scroll and word B takes 1-k. Volume is
         (1-k) for one and k for the other, which sums to exactly 1 at every point in
         the scroll - there is never a frame with less rock than the frame before it.
         The cube root is what makes that true in volume rather than in width: scale is
         a length, and a rock at half scale is an EIGHTH of a rock.

         lo staggers the moment each pair trades, and because a mate inherits its
         partner's aTone the pair shares one lo - so one shrinks exactly as the other
         grows, in the same place, in the same instant. */
      float lo = 0.30 + aTone * 0.40;
      float kA = smoothstep(lo, lo + 0.14, uMorph);
      float k = mix(kA, 1.0 - kA, aWord);
      float shrink = pow(1.0 - k, 0.3333);
      /* where the piece lives right now: its own word's slot, travelling to the slot
         the other word needs filled */
      vec3 home = mix(aCenter, aPartner, smoothstep(0.12, 1.0, t));
      /* PHYSICS, NOT A BLENDER. The spin was t*6.2 plus a term driven by the global
         clock, so every fragment tumbled forever at speed - which reads as a special
         effect, not as something breaking. Real debris does three things: it bursts
         fast and decelerates (drag), it falls (gravity, accelerating), and it tumbles
         only a little, by an amount fixed per piece rather than by a running clock.
         pow(t,0.55) is the deceleration - most of the distance is covered early. */
      float fly = pow(t, 0.55);
      float ang = fly * (0.35 + aTone * 0.8);
      mat3 R = axisRot(normalize(aSeed + vec3(0.001)), ang);
      /* NO GRAVITY. A falling fragment is correct physics for rubble that is going
         to land, and wrong for rubble that is being handed to the other word: it made
         every piece sink out of frame as it shrank, so the effect read as "these fall
         away and different ones appear" instead of as a transfer. The pieces drift on
         their own axis and trade in place. */
      vec3 transformed = home + R * (position - aCenter) * shrink
                       + aSeed * fly * 0.11;
      /* vWorld was DECLARED in both shaders and NEVER ASSIGNED. Every triplanar
         lookup therefore sampled the same single texel, and the whole rock pack
         resolved to one flat colour multiply - which is why the surface still had
         no texture on it. Locked to the UNDEFORMED position so the grain is baked
         into the stone and does not swim while the piece flies. */
      vWorld = position;
    `)
    sh.vertexShader = sh.vertexShader.replace('#include <beginnormal_vertex>', `
      float tn = breakT(aCenter, min(mix(uMorph,1.0-uMorph,aWord)*1.61,1.0), uMinY, uMaxY);
      float angn = pow(tn, 0.55) * (0.35 + aTone * 0.8);
      vec3 objectNormal = axisRot(normalize(aSeed + vec3(0.001)), angn) * normal;
      vLocalN = objectNormal;
    `)

    sh.fragmentShader = 'uniform sampler2D uRock; uniform sampler2D uRough; uniform sampler2D uNormal;\nvarying float vT; varying float vTone; varying float vFade; varying vec3 vLocalN; varying vec3 vWorld;\nvec3 tri(sampler2D s, vec3 p, vec3 n){ vec3 b=pow(abs(n),vec3(2.0)); b/=(b.x+b.y+b.z+0.0001); return texture2D(s,p.zy*2.6).rgb*b.x + texture2D(s,p.xz*2.6).rgb*b.y + texture2D(s,p.xy*2.6).rgb*b.z; }\n' + sh.fragmentShader
    /* NO SECOND MATERIAL. The interior used to be its own emissive blue with a
       three-stop colour ramp, so a stone that split showed coloured light inside -
       which is a video-game crystal, not a rock. Rock that breaks reveals more rock.
       One material for the shell, the interior and every fragment, and the only thing
       Blender's skin/interior split still buys us is nothing, so it is ignored. */
      const T = 'tri(uRock, vWorld, normalize(vLocalN))'
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <map_fragment>', 'diffuseColor.rgb *= ' + T + ' * 1.5;')
        .replace('#include <roughnessmap_fragment>',
                 'float roughnessFactor = roughness * (0.60 + 0.45 * tri(uRough, vWorld, normalize(vLocalN)).r);')
        .replace('#include <normal_fragment_maps>',
                 'vec3 nrm = tri(uNormal, vWorld, normalize(vLocalN)) * 2.0 - 1.0; normal = normalize(normal + vec3(nrm.xy, 0.0) * 1.3);')
      sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', `
        #include <dithering_fragment>
        /* a soft rim so near-black stone keeps its silhouette against a near-black
           background - colourless now, it was tinting the edges teal and amber */
        float fres = pow(1.0 - abs(dot(normalize(vLocalN), vec3(0.0, 0.0, 1.0))), 3.2);
        gl_FragColor.rgb += fres * vec3(0.10, 0.13, 0.15);
        gl_FragColor.a *= vFade;
      `)
  }
  mat.customProgramCacheKey = () => 'stone'
}
patch(skinMat, false)

/* ── LOAD AND MERGE ──────────────────────────────────────────────────────────
   78 objects would be 78 draw calls. They are merged into one buffer per
   material, and each vertex keeps its own piece's centre and throw direction -
   which is exactly the data the fracture produced and exactly what a naive merge
   would destroy. Two draw calls for the whole mark. */
function mergeBucket(list) {
  let n = 0
  for (const e of list) n += e.g.attributes.position.count
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3)
  const cen = new Float32Array(n * 3), sed = new Float32Array(n * 3), par = new Float32Array(n * 3)
  const ton = new Float32Array(n), wrd = new Float32Array(n)
  let o = 0
  for (const e of list) {
    const p = e.g.attributes.position.array, nm = e.g.attributes.normal.array
    for (let i = 0; i < e.g.attributes.position.count; i++) {
      pos[(o + i) * 3] = p[i * 3]; pos[(o + i) * 3 + 1] = p[i * 3 + 1]; pos[(o + i) * 3 + 2] = p[i * 3 + 2]
      nor[(o + i) * 3] = nm[i * 3]; nor[(o + i) * 3 + 1] = nm[i * 3 + 1]; nor[(o + i) * 3 + 2] = nm[i * 3 + 2]
      cen[(o + i) * 3] = e.c.x; cen[(o + i) * 3 + 1] = e.c.y; cen[(o + i) * 3 + 2] = e.c.z
      sed[(o + i) * 3] = e.s.x; sed[(o + i) * 3 + 1] = e.s.y; sed[(o + i) * 3 + 2] = e.s.z
      par[(o + i) * 3] = e.p.x; par[(o + i) * 3 + 1] = e.p.y; par[(o + i) * 3 + 2] = e.p.z
      ton[o + i] = e.t; wrd[o + i] = e.w
    }
    o += e.g.attributes.position.count
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3))
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3))
  g.setAttribute('aCenter', new THREE.BufferAttribute(cen, 3))
  g.setAttribute('aSeed', new THREE.BufferAttribute(sed, 3))
  g.setAttribute('aPartner', new THREE.BufferAttribute(par, 3))
  g.setAttribute('aTone', new THREE.BufferAttribute(ton, 1))
  g.setAttribute('aWord', new THREE.BufferAttribute(wrd, 1))
  return g
}

let composer = null, bloom = null
const build = (gltf) => { try {
  const byPiece = new Map()
  gltf.scene.updateMatrixWorld(true)
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return
    /* the exporter splits a piece into one primitive per material and renames them
       piece012, piece012_1, piece012.001 - so the fragment id is the DIGITS. Get
       this wrong and a fragment's shell flies one way while its interior flies
       another, which is the single thing this effect cannot survive. */
    let key = o
    while (key.parent && !/^[ab]\d+/.test(key.name)) key = key.parent
    const mm = /^([ab])(\d+)/.exec(key.name) || /^([ab])(\d+)/.exec(o.name)
    const id = mm ? mm[1] + mm[2] : o.uuid
    if (!byPiece.has(id)) byPiece.set(id, [])
    byPiece.get(id).push(o)
  })

  /* STAND IT UP. The exporter's Y-up conversion maps Blender (x,y,z) to three
     (x,z,-y): the glyphs' HEIGHT axis was Blender Y, so it arrives pointing into
     the screen and the mark lies flat like type printed on the floor. Every
     previous screenshot was the edge of that. Rotating +90 about X sends -Z to
     +Y and stands it up.
     Baked into the geometry rather than set on the group, because the shader's
     destruction wave runs along OBJECT-space Y - leave the rotation on the parent
     and the wave would still sweep through the old, wrong axis. */
  const STAND = new THREE.Matrix4().makeRotationX(Math.PI / 2)
  const skin = [], core = []
  let count = 0
  const box = new THREE.Box3()
  /* TWO PASSES, because a piece cannot know where it is going until every piece on
     the other side has been placed. Pass one measures each piece; pass two pairs
     each 101 fragment with a Solutions fragment and vice versa. That pairing is what
     makes the handoff continuous: the rubble does not fade out here and fade in over
     there, it flies from where it was to where the other word needs it. */
  const meta = []
  for (const [pid, meshes] of byPiece) {
    const pb = new THREE.Box3()
    for (const m of meshes) pb.expandByObject(m)
    meta.push({ pid, meshes, pb, c: pb.getCenter(new THREE.Vector3()).applyMatrix4(STAND),
                w: /^b/.test(String(pid)) ? 1 : 0 })
  }
  /* THE SWAP HAS TO BE MUTUAL. The pairing used to be two independent walks, so a
     101 fragment shrank away at one place while some unrelated Solutions fragment
     grew somewhere else - which is why it read as things vanishing and other things
     appearing rather than as rock being re-used.

     Now the mapping is symmetric: A[i] and B[i] are each other's mate. One shrinks to
     nothing exactly where the other grows from nothing, at the same moment, spinning
     on the same axis at the same rate - because the mate inherits its partner's seed
     and tone rather than rolling its own. Two draw calls' worth of geometry, but on
     screen it is one rock that keeps going. 228 against 328 means the last hundred
     Solutions cells share a mate; at the instant they trade, both are microscopic. */
  const A = meta.filter(m => m.w === 0), B = meta.filter(m => m.w === 1)
  const dir = () => {
    const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
    return v.lengthSq() < 1e-6 ? new THREE.Vector3(0, 1, 0) : v.normalize()
  }
  A.forEach((m) => { m.s = dir(); m.t = Math.random() })
  A.forEach((m, i) => { m.mate = B[Math.floor(i * B.length / A.length)] })
  B.forEach((m, i) => {
    const a = A[Math.floor(i * A.length / B.length)]
    m.mate = a; m.s = a.s.clone(); m.t = a.t
  })
  for (const m of meta) m.p = m.mate.c

  for (const { pid, meshes, pb, c, w, p, s, t: tone } of meta) {

    box.union(pb.clone().applyMatrix4(STAND))
    for (const m of meshes) {
      const g = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone())
      g.applyMatrix4(m.matrixWorld)
      g.applyMatrix4(STAND)
      if (!g.attributes.normal) g.computeVertexNormals()
      const name = (m.material?.name || '').toLowerCase()
      ;(name.includes('core') ? core : skin).push({ g, c, s, t: tone, w, p })
      count++
    }
  }

  const size = box.getSize(new THREE.Vector3())
  uniforms.uMinY.value = box.min.y
  uniforms.uMaxY.value = box.max.y

  root.add(new THREE.Mesh(mergeBucket(skin.concat(core)), skinMat))

  /* frame it by whichever axis binds, with air around it */
  const fit = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight
    renderer.setSize(w, h, false)
    camera.aspect = w / h
    const fov = THREE.MathUtils.degToRad(camera.fov)
    const dh = (size.y * 1.5) / 2 / Math.tan(fov / 2)
    /* size is ALREADY the union box of both words, so Solutions' width is in it -
       multiplying by 3.05 on top of that pushed the camera three times further back
       than needed and rendered the whole mark at a third of the frame. 1.2 is the
       margin, not the word count. */
    const dw = (size.x * 1.2) / 2 / Math.tan(fov / 2) / Math.max(camera.aspect, 0.0001)
    camera.position.set(0, 0, Math.max(dh, dw))
    camera.lookAt(0, 0, 0)
    camera.updateProjectionMatrix()
    if (composer) composer.setSize(w, h)
  }
  addEventListener('resize', fit); fit()

  if (!PHONE) {
    composer = new EffectComposer(renderer)
    composer.addPass(new RenderPass(scene, camera))
    /* small radius, high threshold: only the exposed core blooms, never the whole
       frame. Bloom that touches the metal is what makes real-time look like a
       screensaver. */
    /* Bloom down hard. At 0.62 strength with a 0.86 threshold every little fracture
       facet caught a specular hot enough to bloom, so the mark grew headlights - which
       is exactly what stone must not do. 0.22 past a 0.97 threshold means only the
       exposed core can bloom, never the skin. */
    bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.55, 0.97)
    composer.addPass(bloom)
    composer.addPass(new OutputPass())
    composer.setSize(canvas.clientWidth, canvas.clientHeight)
  }

  /* aTarget died with the sampled-cloud approach. This block still read it, so
     build() threw a TypeError before loop() was ever called - the deployed page
     rendered nothing and every screenshot of it was a stale cached build. */
  window.__dbg = { pieces: byPiece.size, u: uniforms }
  stat.textContent = `${byPiece.size} кусков · ${count} примитивов`
  loop()
} catch (e) { fail('build: ' + (e && e.message ? e.message : e)) } }
new GLTFLoader().load('./words.glb', build, undefined, (e) => fail('GLB не загрузился: ' + e))

let damage = 0, target = 0, spin = 0, last = performance.now()
slider.addEventListener('input', () => { target = parseFloat(slider.value) })
addEventListener('wheel', (e) => {
  target = Math.min(1, Math.max(0, target + e.deltaY * 0.0012))
  slider.value = String(target)
}, { passive: true })
let ty = null
addEventListener('touchstart', (e) => { ty = e.touches[0].clientY }, { passive: true })
addEventListener('touchmove', (e) => {
  if (ty === null) return
  const y = e.touches[0].clientY
  target = Math.min(1, Math.max(0, target + (ty - y) * 0.004))
  slider.value = String(target); ty = y
}, { passive: true })

function loop() {
  requestAnimationFrame(loop)
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now
  damage += (target - damage) * Math.min(1, dt * 5)

  /* ONE VALUE, THREE JOBS - and this block is why the swarm kept forming a ring.
     Every other edit landed; this one silently did not match after the file was
     restored, so uMorph was declared in the shader, uploaded as an attribute, and
     NEVER ASSIGNED. It sat at 0 forever, home stayed aCenter, and what rendered was
     the plain explosion - which is exactly what a ring is. Three sessions of looking
     for a coordinate bug in data that was correct the whole time.

     The break rises and falls so the mark is SOLID at both ends; the morph runs
     straight through, so the 101 that comes apart settles as Solutions. */
  uniforms.uDamage.value = Math.sin(Math.min(1, Math.max(0, damage)) * Math.PI)
  uniforms.uMorph.value = damage
  spin += dt * 0.9
  uniforms.uSpin.value = spin

  stat.textContent = `morph ${damage.toFixed(2)} · разлёт ${uniforms.uDamage.value.toFixed(2)}`
  root.rotation.y = Math.sin(spin * 0.42) * 0.46
  root.rotation.x = Math.sin(spin * 0.31) * 0.10
  if (composer) composer.render(); else renderer.render(scene, camera)
}
</script>
